# The nginx that test/t/cases/auto_ssl.rb starts next to the test nginx,
# with the prefix NGINX_INSTALL_DIR/auto_ssl/peer/. The case replaces
# __LOAD_MODULE__ (the load_module line of a dynamic module build, or
# nothing), __PREFIX__ and __LOGS__ (NGINX_INSTALL_DIR/logs/).
#
# It serves what dehydrated and Pebble call while the test nginx is blocked
# in Nginx::SSL::ACME::Dehydrated#auto_cert_deploy, which runs dehydrated and
# waits for it during the TLS handshake (see "Design principles" in
# AGENTS.md): the hook server of test/auto_ssl/hook.sh on 18173 and the
# http-01 challenge server on 18174. Both are the servers of
# test/conf/auto-ssl/nginx.conf.dehydrated_example on other ports, with one
# difference: the challenge handler returns Nginx::HTTP_OK after the token.
# The example ends its lambda with Nginx.rputs, so Nginx.return gets the
# class Nginx, raises TypeError and the challenge gets a 500. The test
# nginx runs as a single process, so a hook request to it would wait for
# itself.
#
# 18173 also serves the directory of an ACME v1 server at /directory, which
# Nginx::SSL::ACME::Client#client reads. Nothing on this nginx answers the
# other ACME v1 requests.

__LOAD_MODULE__
daemon on;
master_process off;
worker_processes 1;
pid __PREFIX__nginx.pid;
error_log __LOGS__auto_ssl_peer.error.log info;

events {
    worker_connections 64;
}

http {
    access_log off;

    mruby_init_worker_code '
        Userdata.new.redis = Redis.new "127.0.0.1", 6379
    ';

    mruby_init_code '
        Userdata.new.auto_ssl_secret = "auto-ssl-test-secret"
    ';

    server {
        listen 127.0.0.1:18173;
        server_name localhost;

        location /deploy-cert {
            mruby_enable_read_request_body on;
            mruby_content_handler_code '
              Nginx.return -> do
                r = Nginx::Request.new

                if Userdata.new.auto_ssl_secret == Nginx::SSL::ACME::Dehydrated.secret_token(r)
                  cert_info = Nginx::SSL::ACME::Dehydrated.deploy_cert_information r
                  redis = Userdata.new.redis
                  redis.mset "#{cert_info[:domain]}.key", cert_info[:key], "#{cert_info[:domain]}.crt", cert_info[:crt]
                  Nginx.rputs "deploy cert ok"
                  return Nginx::HTTP_OK
                end

                return Nginx::HTTP_UNAUTHORIZED
              end.call
            ';
        }

        location /deploy-challenge {
            mruby_enable_read_request_body on;
            mruby_content_handler_code '
              Nginx.return -> do
                r = Nginx::Request.new

                if Userdata.new.auto_ssl_secret == Nginx::SSL::ACME::Dehydrated.secret_token(r)
                  domain = Nginx::SSL::ACME::Dehydrated.challenged_domain r
                  redis = Userdata.new.redis
                  redis["#{domain}_token_filename"] = Nginx::SSL::ACME::Dehydrated.challenged_token_filename r
                  redis["#{domain}_token_value"] = Nginx::SSL::ACME::Dehydrated.challenged_token_value r
                  Nginx.rputs "deploy challenge ok"
                  return Nginx::HTTP_OK
                end

                return Nginx::HTTP_UNAUTHORIZED
              end.call
            ';
        }

        location = /directory {
            default_type application/json;
            return 200 '{"new-reg":"http://127.0.0.1:18173/acme-v1/new-reg","new-authz":"http://127.0.0.1:18173/acme-v1/new-authz","new-cert":"http://127.0.0.1:18173/acme-v1/new-cert","revoke-cert":"http://127.0.0.1:18173/acme-v1/revoke-cert"}';
        }

        location = /up {
            return 200 'auto-ssl peer is up';
        }
    }

    server {
        listen 127.0.0.1:18174;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            mruby_content_handler_code '
              Nginx.return -> do
                r = Nginx::Request.new
                redis = Userdata.new.redis
                access_token = Nginx::SSL::ACME::Dehydrated.token_filename_from_url(r)
                stored_token = redis["#{r.hostname}_token_filename"]

                if access_token != stored_token
                  Nginx.log Nginx::LOG_ERR, "ACME challenge token not found"
                  return Nginx::HTTP_NOT_FOUND
                end

                Nginx.rputs redis["#{r.hostname}_token_value"]
                return Nginx::HTTP_OK
              end.call
            ';
        }
    }
}
