# nginx.conf for the agent proxy scenarios of the memory soak test
# (test/soak/soak.rb) and the performance comparison (test/perf/perf.rb):
# nginx in front of the mock LLM upstream test/soak/mock_llm.rb, which the
# drivers start on __SOAK_MOCK_PORT__ for each scenario.
#
# The drivers replace __SOAK_PORT__, __SOAK_MOCK_PORT__ and
# __SOAK_HANDLERS__ as in test/soak/nginx.conf, and perf.rb replaces the line
# "master_process on;" in the same way.
#
# This is a configuration of its own, not more locations in
# test/soak/nginx.conf, for two reasons:
# - Any mruby body filter directive installs ngx_mruby's body filter for every
#   response of its http {} block, and test/soak/nginx.conf has one (the
#   filter scenario). Each chunked response, such as a stream, would pass
#   that filter and log a notice. No location here has a filter.
# - error_log is at warn, so that the notices nginx logs for some requests do
#   not become part of what is measured. The soak still sees the [error]
#   lines it fails on.
#
# Requests go to __SOAK_PORT__. The scenarios use these locations (see
# SCENARIOS in test/soak/scenarios.rb):
#   /v1/plain    proxy_pass to the mock, no Ruby
#   /v1/route    the access handler agent_route.rb reads the model from the
#                JSON body and picks the upstream block, then proxy_pass
#   /ruby_call_1, /ruby_call_10
#                1 and 10 mruby_set_code variables, no upstream
# and the server "auth.agent.test" on the same port (the client sends that
# Host) runs the server rewrite handler agent_auth.rb before its /v1/plain.

master_process on;
worker_processes 1;
daemon off;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 4096;
}

http {
    default_type text/plain;
    access_log off;

    # The variables that the handlers assign are declared in /.agent-vars
    # and are read only after they were assigned; this keeps a missed
    # assignment from logging a warning on every request.
    uninitialized_variable_warn off;

    # The client key, model and upstream tables of the handlers.
    mruby_init_worker __SOAK_HANDLERS__/agent_init.rb;

    # Request bodies of up to 4 MB stay in memory, where Nginx::Request#body
    # reads them.
    client_max_body_size 4m;
    client_body_buffer_size 4m;

    # The proxy relays the response as it arrives, as an LLM proxy does for
    # streams. One upstream read takes at most proxy_buffer_size bytes. The
    # client's credential is never forwarded; the upstream gets the one that
    # agent_auth.rb picked (none, and so no header, elsewhere). Every location
    # inherits these lines, so that two scenarios of the same shape differ
    # only in their Ruby.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header x-api-key $agent_upstream_key;
    proxy_buffering off;
    proxy_buffer_size 4k;

    # The mock never closes an idle connection. With a large
    # keepalive_requests and keepalive_timeout, nginx does not close one
    # either, so the connections cached here are those that were open at the
    # same time at the busiest moment so far (at most the number of client
    # connections). soak.rb asks the mock how many are open when it counts
    # the worker's file descriptors.
    upstream mock_llm {
        server 127.0.0.1:__SOAK_MOCK_PORT__;
        keepalive 32;
        keepalive_requests 1000000;
        keepalive_timeout 1h;
    }

    server {
        listen 127.0.0.1:__SOAK_PORT__;

        # Sampling endpoints, as in test/soak/nginx.conf.
        location = /status {
            stub_status;
        }

        location = /debug/stats {
            mruby_content_handler_code '
                Nginx::Debug.gc
                Nginx.rputs JSON.generate(Nginx::Debug.stats)
            ';
        }

        # Declares the variables that the handlers assign. A declaration
        # anywhere in the configuration is enough; this location is never
        # requested.
        location = /.agent-vars {
            internal;
            set $agent_key_id "";
            set $agent_backend "";
            set $agent_upstream_key "";
            return 404;
        }

        # proxy_plain_*, proxy_stream_plain_*: no Ruby
        location = /v1/plain {
            proxy_pass http://mock_llm/v1/messages;
        }

        # route_json_*, agent_*: an access handler parses the body
        location = /v1/route {
            mruby_enable_read_request_body on;
            mruby_access_handler __SOAK_HANDLERS__/agent_route.rb cache;
            proxy_pass http://$agent_backend/v1/messages;
        }

        # ruby_call_*: the cost of one Ruby call, without an upstream
        location = /ruby_call_1 {
            mruby_set_code $call_1 '"1"';
            return 200 "$call_1";
        }

        location = /ruby_call_10 {
            mruby_set_code $call_1 '"1"';
            mruby_set_code $call_2 '"2"';
            mruby_set_code $call_3 '"3"';
            mruby_set_code $call_4 '"4"';
            mruby_set_code $call_5 '"5"';
            mruby_set_code $call_6 '"6"';
            mruby_set_code $call_7 '"7"';
            mruby_set_code $call_8 '"8"';
            mruby_set_code $call_9 '"9"';
            mruby_set_code $call_10 '"10"';
            return 200 "$call_1$call_2$call_3$call_4$call_5$call_6$call_7$call_8$call_9$call_10";
        }
    }

    # auth: the server rewrite handler runs for every request of this server
    # (before a location is chosen), so it has a server of its own. Its
    # /v1/plain is the same as the one above.
    server {
        listen 127.0.0.1:__SOAK_PORT__;
        server_name auth.agent.test;

        mruby_server_rewrite_handler __SOAK_HANDLERS__/agent_auth.rb cache;

        location = /v1/plain {
            proxy_pass http://mock_llm/v1/messages;
        }
    }
}
