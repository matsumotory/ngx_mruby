# TCP stream sleep scenario; HTTP endpoints control and sample the same worker.
# Both drivers replace the three port placeholders. Perf never calls the GC server.
master_process on;
worker_processes 1;
daemon off;
error_log logs/error.log notice;
pid logs/nginx.pid;

events {
    worker_connections 4096;
}

http {
    default_type text/plain;
    access_log off;

    server {
        listen 127.0.0.1:__SOAK_PORT__;

        # Control endpoints. The soak also reads stats during its counter
        # preflight; memory samples are taken with no stream session open.
        location = /status {
            stub_status;
        }

        location = /debug/stats {
            mruby_content_handler_code '
                Nginx::Debug.gc
                Nginx.rputs JSON.generate(Nginx::Debug.stats)
            ';
        }

        # The check of Nginx::Debug itself, which soak.rb requests once in
        # each scenario of this file, before the warmup ("Soak test for
        # memory" in docs/test/README.md). The code makes Strings that
        # nothing references, and reads gc_live after the first full GC,
        # after the Strings, and after a second full GC. GC.disable keeps
        # the incremental GC from freeing the Strings before the second
        # read; mrb_full_gc does nothing while the GC is disabled, so the
        # code enables it before the second full GC.
        location = /debug/check {
            mruby_content_handler_code '
                Nginx::Debug.gc
                stats = Nginx::Debug.stats
                GC.disable
                begin
                    1000.times { |i| "soak debug check #{i}" }
                    filled = Nginx::Debug.stats[:gc_live]
                ensure
                    GC.enable
                end
                result = Nginx::Debug.gc
                emptied = Nginx::Debug.stats[:gc_live]
                Nginx.rputs JSON.generate({
                    "keys" => stats.keys.map { |k| k.inspect }.sort,
                    "classes" => stats.values.map { |v| v.class.to_s }.uniq,
                    "gc" => result.inspect,
                    "base" => stats[:gc_live],
                    "filled" => filled,
                    "emptied" => emptied,
                })
            ';
        }

    }
}

stream {
    access_log off;

    server {
        listen 127.0.0.1:__SOAK_BACKEND_PORT__;
        mruby_stream_code '
            Nginx::Stream::Async.sleep 1
            Nginx::Stream::Connection.stream_status = Nginx::Stream::OK
        ';
        return "stream slept";
    }

    # Used only by the soak, outside its request windows. The wait lets the
    # preflight observe nonzero counters; GC.start collects this stream VM.
    # The HTTP Nginx::Debug.gc endpoint collects the separate HTTP VM only.
    server {
        listen 127.0.0.1:__SOAK_MOCK_PORT__;
        mruby_stream_code '
            Nginx::Stream::Async.sleep 250
            GC.start
            Nginx::Stream::Connection.stream_status = Nginx::Stream::OK
        ';
        return "stream gc complete";
    }
}
