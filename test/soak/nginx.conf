# nginx.conf for the memory soak test (test/soak/soak.rb) and the
# performance comparison (test/perf/perf.rb).
#
# soak.rb replaces __SOAK_PORT__, __SOAK_BACKEND_PORT__ and __SOAK_HANDLERS__,
# writes the result to build_soak/nginx/soak/conf/nginx.conf and starts
# nginx with -p build_soak/nginx/soak/. Each scenario is one location on
# __SOAK_PORT__; soak.rb sends its requests there (see SCENARIOS in
# test/soak/scenarios.rb).
#
# perf.rb makes the same replacements (with its own ports), and also replaces
# the line "master_process on;" with "master_process off;", because
# callgrind_control cannot reach a worker that valgrind forked. perf.rb stops
# with an error when it does not find that line exactly, so keep it as it is.

master_process on;
worker_processes 1;
daemon off;
error_log logs/error.log notice;
pid logs/nginx.pid;

events {
    # The disconnect scenario keeps a few hundred requests open at once.
    worker_connections 4096;
}

http {
    default_type text/plain;
    access_log off;

    server {
        listen 127.0.0.1:__SOAK_PORT__;

        # Sampling endpoints. soak.rb reads them only while no scenario
        # request is open.
        location = /status {
            stub_status;
        }

        location = /debug/stats {
            mruby_content_handler_code '
                Nginx::Debug.gc
                Nginx.rputs JSON.generate(Nginx::Debug.stats)
            ';
        }

        # 1. hello
        location = /hello {
            mruby_content_handler_code 'Nginx.rputs "hello"';
        }

        # 2. headers: read three request headers, set two response headers
        location = /headers {
            mruby_content_handler_code '
                r = Nginx::Request.new
                a = r.headers_in["X-Soak-A"]
                b = r.headers_in["X-Soak-B"]
                ua = r.headers_in["User-Agent"]
                r.headers_out["X-Soak-Out-A"] = a.upcase
                r.headers_out["X-Soak-Out-B"] = b.upcase
                Nginx.rputs "#{a},#{b},#{ua}"
            ';
        }

        # 3. var: read two variables, set one
        location = /var {
            set $soak_out "";
            mruby_content_handler_code '
                v = Nginx::Var.new
                v.set "soak_out", "#{v.request_method}:#{v.arg_q}"
                Nginx.rputs v.soak_out
            ';
        }

        # 4. filter: rewrite the body of a static response
        location = /filter {
            mruby_output_body_filter_code '
                f = Nginx::Filter.new
                f.body = f.body.upcase
            ';
            return 200 "filtered body";
        }

        # 5. sleep
        location = /sleep {
            mruby_rewrite_handler_code '
                Nginx::Async.sleep 1
                Nginx.rputs "slept"
                Nginx.return Nginx::HTTP_OK
            ';
        }

        # 6. sub_request to the static location of the backend server
        location = /sub_request {
            mruby_rewrite_handler_code '
                Nginx::Async::HTTP.sub_request "/backend"
                res = Nginx::Async::HTTP.last_response
                Nginx.rputs res.body
            ';
        }

        location = /backend {
            internal;
            proxy_pass http://127.0.0.1:__SOAK_BACKEND_PORT__/static;
        }

        # 7. file: a handler file with the cache option
        location = /file {
            mruby_content_handler __SOAK_HANDLERS__/file.rb cache;
        }

        # 8. disconnect: the client closes the connection during the sleep
        location = /disconnect {
            mruby_rewrite_handler_code '
                Nginx::Async.sleep 50
                Nginx.rputs "late"
                Nginx.return Nginx::HTTP_OK
            ';
        }
    }

    # Backend for the sub_request scenario.
    server {
        listen 127.0.0.1:__SOAK_BACKEND_PORT__;

        location = /static {
            return 200 "static body";
        }
    }
}
