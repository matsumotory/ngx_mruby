# ngx_mruby's handlers, filters and SSL handshake handler over HTTP/1.1,
# HTTP/2 and HTTP/3. Cases: test/t/cases/http2_http3.rb, which sends each
# request with each of the three versions (HttpVersions in test/t/client.rb)
# and expects the same response.
#
# Port 18173 over TCP (TLS, with HTTP/1.1 or HTTP/2 chosen by ALPN) and over
# UDP (QUIC, HTTP/3). test.sh waits for the TCP port only
# (test/t/cases/_wait_for_listen.rb), so the quic listen has the number of
# the TCP one. On master, 18173 belongs to the auto-ssl case, which next
# does not have ("HTTP/2 and HTTP/3" in docs/test/README.md).
#
# HTTP/2 and HTTP/3 give nginx the request in frames, not in a request line
# and header lines: their own code reads the headers and the request body,
# and writes the response through their own output filters. The locations
# below go through these paths with ngx_mruby's API.
server {
    listen 18173 ssl;
    listen 18173 quic;
    http2 on;
    server_name localhost;

    ssl_certificate     __NGXDOCROOT__/dummy.crt;
    ssl_certificate_key __NGXDOCROOT__/dummy.key;

    # The handshake of each connection, HTTP/3 included, replaces the
    # certificate with the one of the server name and counts itself.
    # /handshake reads the count and what the handler saw.
    mruby_ssl_handshake_handler_code '
      ssl = Nginx::SSL.new
      ssl.certificate = "__NGXDOCROOT__/#{ssl.servername}.crt"
      ssl.certificate_key = "__NGXDOCROOT__/#{ssl.servername}.key"
      u = Userdata.new
      u.http2_http3_handshakes = u.http2_http3_handshakes.to_i + 1
      u.http2_http3_handshake = "#{ssl.servername} #{ssl.tls_version}"
    ';

    client_max_body_size 1m;

    location = /handshake {
        mruby_content_handler_code '
          u = Userdata.new
          Nginx.rputs "#{u.http2_http3_handshakes} #{u.http2_http3_handshake}"
        ';
    }

    # The version that nginx took the request for: HTTP/1.1, HTTP/2.0 or
    # HTTP/3.0.
    location = /protocol {
        mruby_content_handler_code 'Nginx.rputs Nginx::Request.new.var.server_protocol';
    }

    # A content handler that sets the status, the Content-Type and a header
    # of its own.
    location = /content {
        mruby_content_handler_code '
          r = Nginx::Request.new
          r.content_type = "text/x-http2-http3"
          r.headers_out["X-Out"] = "content"
          Nginx.rputs "content "
          Nginx.rputs "body"
          Nginx.return Nginx::HTTP_CREATED
        ';
    }

    # Nginx::Headers_in: a header of the request, a header that the handler
    # adds and one that it deletes, and the Host header next to nginx's
    # $http_host and $host. HTTP/2 and HTTP/3 send the host as :authority.
    location = /headers_in {
        mruby_content_handler_code '
          r = Nginx::Request.new
          h = r.headers_in
          h["X-Added"] = "added"
          h.delete "X-Deleted"
          Nginx.rputs [
            "x-test=#{h["X-Test"].inspect}",
            "x-added=#{h["X-Added"].inspect}",
            "x-deleted=#{h["X-Deleted"].inspect}",
            "host=#{h["Host"].inspect}",
            "http_host=#{r.var.http_host.inspect}",
            "var_host=#{r.var.host.inspect}",
          ].join(" ")
        ';
    }

    # Nginx::Headers_out: a header set, one replaced, one deleted, and the
    # Content-Type and Location that nginx keeps in fields of its own.
    location = /headers_out {
        mruby_content_handler_code '
          h = Nginx::Request.new.headers_out
          h["X-Set"] = "set"
          h["X-Replaced"] = "first"
          h["X-Replaced"] = "second"
          h["X-Deleted"] = "deleted"
          h.delete "X-Deleted"
          h["Content-Type"] = "application/x-http2-http3"
          h["Location"] = "/headers_out_location"
          Nginx.rputs "x-set=#{h["X-Set"].inspect} x-deleted=#{h["X-Deleted"].inspect}"
        ';
    }

    # The request body, as the content handler reads it, written back. The
    # case sends a short body and one of 100,000 bytes, which arrives in
    # several reads (HTTP/1.1) or frames (HTTP/2 and HTTP/3).
    # Nginx::Request#body is nginx's $request_body, which is empty when nginx
    # wrote the body to a temporary file, so the buffer holds the whole body.
    location = /body {
        client_body_buffer_size 128k;
        mruby_enable_read_request_body on;
        mruby_content_handler_code '
          b = Nginx::Request.new.body.to_s
          Nginx.rputs "#{b.bytesize}:"
          Nginx.rputs b
        ';
    }

    # A header filter and a body filter on the output of a content handler.
    location = /filter {
        mruby_content_handler_code 'Nginx.rputs "origin"';
        mruby_output_header_filter_code 'Nginx::Request.new.headers_out["X-Header-Filter"] = "ran"';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase + " (body filter)"
        ';
    }

    # A content handler that waits on an nginx timer before it answers.
    location = /sleep {
        mruby_content_handler_code '
          Nginx::Async.sleep 50
          Nginx.rputs "slept"
        ';
    }

    # A subrequest from the content handler, and its response.
    location = /sub_request {
        mruby_content_handler_code '
          Nginx::Async::HTTP.sub_request "/leaf"
          res = Nginx::Async::HTTP.last_response
          Nginx.rputs "sub_request=#{res.status} #{res.body}"
        ';
    }

    location = /leaf {
        return 200 "leaf";
    }
}
