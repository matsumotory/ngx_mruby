# The accessors of Nginx::Var (v.NAME and v.NAME = value), which become
# methods of Nginx::Var at their first use in a worker, and the methods of
# Nginx::Connection, Nginx::Server and Nginx::Request that read a variable.
# Cases: test/t/cases/var_method_lookup.rb. Hook script:
# test/html/var_accessor.rb, which runs the calls that the path of the
# request names. Port 18159.
#
# test.sh runs a single nginx process, so the methods that one request
# defines on Nginx::Var stay for the later requests of the whole suite.
server {
    listen 18159;
    server_name var-accessor.test;

    # Declared variables that no other test reads, so that their accessors
    # do not exist before the first request of the cases. Each request starts
    # with these values.
    set $var_accessor_declared "initial";
    set $var_accessor_target "initial";
    set $var_accessor_after_freeze "after freeze";
    set $var_accessor_alias "alias value";

    location / {
        mruby_content_handler build/nginx/html/var_accessor.rb;
        # nginx reads the variable after the handler: the value that a setter
        # of the handler assigned.
        add_header X-Var-Accessor-Target $var_accessor_target;
    }

    # The methods that read a variable, next to the values that nginx gives
    # the same variables.
    location /own_methods {
        mruby_content_handler build/nginx/html/var_accessor.rb;
        add_header X-Remote-Addr $remote_addr;
        add_header X-Remote-Port $remote_port;
        add_header X-Server-Addr $server_addr;
        add_header X-Server-Port $server_port;
        add_header X-Document-Root $document_root;
        add_header X-Realpath-Root $realpath_root;
        add_header X-Host $host;
        add_header X-Http-Host $http_host;
        add_header X-Request-Filename $request_filename;
        add_header X-Remote-User $remote_user;
    }

    location = /own_methods/get_body {
        mruby_enable_read_request_body on;
        mruby_rewrite_handler_code '
            Nginx.rputs Nginx::Request.new.get_body.inspect
        ';
    }
}
