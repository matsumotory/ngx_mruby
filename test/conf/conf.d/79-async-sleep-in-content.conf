# Nginx::Async.sleep in a content handler. Cases:
# test/t/cases/async_sleep_in_content.rb. Port 18133.
#
# The content handler sleeps and then writes its body, so the request must
# get 200 with that body after the sleep, and the fiber of the handler must
# not stay in the GC root.
server {
    listen 18133;

    location /sleep_in_content {
        mruby_content_handler_code '
          Nginx::Async.sleep 100
          Nginx.rputs "slept"
        ';
    }

    location /sleep_then_status {
        mruby_content_handler_code '
          Nginx::Async.sleep 100
          Nginx.return Nginx::HTTP_SERVICE_UNAVAILABLE
        ';
    }

    location /sleep_then_raise {
        mruby_content_handler_code '
          Nginx::Async.sleep 100
          Nginx.rputs "not sent"
          raise "raised after the sleep in a content handler"
        ';
    }

    location /sleep_twice {
        mruby_content_handler_code '
          Nginx::Async.sleep 50
          Nginx.rputs "one,"
          Nginx::Async.sleep 50
          Nginx.rputs "two"
        ';
    }

    # Number of live Fiber objects after a full GC. A fiber that is still
    # registered with mrb_gc_register survives it; the count includes the
    # fiber that runs this handler.
    location /fibers {
        mruby_content_handler_code '
          GC.start
          n = 0
          ObjectSpace.each_object(Fiber) { |f| n += 1 }
          Nginx.rputs n.to_s
        ';
    }
}
