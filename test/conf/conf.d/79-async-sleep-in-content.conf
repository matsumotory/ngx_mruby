# Nginx::Async.sleep in a content handler. Cases:
# test/t/cases/async_sleep_in_content.rb. Port 18133.
#
# The content handler sleeps and then writes its body, so the request must
# get 200 with that body after the sleep, and the fiber of the handler must
# not stay in the GC root.
server {
    listen 18133;

    location /sleep_in_content {
        mruby_content_handler_code '
          Nginx::Async.sleep 100
          Nginx.rputs "slept"
        ';
    }

    location /sleep_then_status {
        mruby_content_handler_code '
          Nginx::Async.sleep 100
          Nginx.return Nginx::HTTP_SERVICE_UNAVAILABLE
        ';
    }

    location /sleep_then_raise {
        mruby_content_handler_code '
          Nginx::Async.sleep 100
          Nginx.rputs "not sent"
          raise "raised after the sleep in a content handler"
        ';
    }

    location /sleep_twice {
        mruby_content_handler_code '
          Nginx::Async.sleep 50
          Nginx.rputs "one,"
          Nginx::Async.sleep 50
          Nginx.rputs "two"
        ';
    }

    # Nginx.redirect from a rewrite handler to a location whose content
    # handler sleeps, and then a status. Nginx.redirect takes effect when the
    # calling handler ends, so its status is not sent, and the content
    # handler of the target answers after its sleep.
    location /redirect_to_sleeping_content_then_status {
        mruby_rewrite_handler_code '
          Nginx.redirect "/sleep_in_content"
          Nginx.return Nginx::HTTP_SERVICE_UNAVAILABLE
        ';
    }

    # Nginx::Async::HTTP.sub_request after a sleep in a content handler.
    location /sleep_then_sub_request {
        mruby_content_handler_code '
          Nginx::Async.sleep 50
          res = Nginx::Async::HTTP.sub_request "/sub_request_leaf"
          Nginx.rputs "after the sub_request:#{res.body}"
        ';
    }

    location /sub_request_leaf {
        mruby_content_handler_code 'Nginx.rputs "leaf"';
    }

    # A subrequest to a location whose content handler sleeps.
    location /sub_request_to_sleeping_content {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/sleep_in_content"
          res = Nginx::Async::HTTP.last_response
          Nginx.rputs "got:#{res.status}:#{res.body}"
          Nginx.return Nginx::HTTP_OK
        ';
    }

    # Number of live Fiber objects after a full GC. A fiber that is still
    # registered with mrb_gc_register survives it; the count includes the
    # fiber that runs this handler.
    location /fibers {
        mruby_content_handler_code '
          GC.start
          n = 0
          ObjectSpace.each_object(Fiber) { |f| n += 1 }
          Nginx.rputs n.to_s
        ';
    }
}
