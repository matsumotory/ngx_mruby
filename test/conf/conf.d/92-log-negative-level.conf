# Nginx.log with a negative level. Cases: test/t/cases/log_negative_level.rb.
# Port 18194. The stream session of the same cases is in
# test/conf/conf.d/stream/50-log-negative-level.conf.
server {
    listen 18194;
    server_name localhost;

    location /log_negative_level {
        mruby_content_handler_code '
            Nginx.log(-1, "log negative level: http")
            Nginx.rputs "logged"
        ';
    }
}
