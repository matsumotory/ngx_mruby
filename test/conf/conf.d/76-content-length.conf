# Nginx::Headers_out Content-Length (section 2.2 of docs/proposals/core-alpha1.md
# and the 3.0.0 release notes). []= sets nginx's own Content-Length field, and
# ngx_http_mruby_header_filter reconciles the length a script sets with the body
# nginx frames before the headers go out: the output's length in a handler that
# writes output, the proxied/static length in a header or phase handler, or the
# response chunked when that length is not known or #delete removed it. So the
# response carries one Content-Length that matches the body, or is sent chunked.
# Cases: test/t/cases/content_length.rb. Ports 18096 (the handlers) and 18122
# (the upstream of the proxy cases).
server {
    listen 18096;

    # content handler: a length the script sets but that differs from the
    # output is replaced by the output's length, with a warn.
    location = /cl_set_then_rputs {
        mruby_content_handler_code '
          h = Nginx::Request.new.headers_out
          h["Content-Length"] = "3"
          Nginx.rputs "hello world"
        ';
    }
    location = /cl_rputs_then_set {
        mruby_content_handler_code '
          Nginx.rputs "hello world"
          Nginx::Request.new.headers_out["Content-Length"] = "3"
        ';
    }
    # a correct length is sent as it is, with no warn.
    location = /cl_set_correct {
        mruby_content_handler_code '
          b = "hello"
          Nginx::Request.new.headers_out["Content-Length"] = b.bytesize.to_s
          Nginx.rputs b
        ';
    }
    # a length with no output: Content-Length: 0, with a warn.
    location = /cl_set_no_output {
        mruby_content_handler_code '
          Nginx::Request.new.headers_out["Content-Length"] = "5"
        ';
    }
    # a value that is not a non-negative decimal raises ArgumentError (500).
    location = /cl_bad_value {
        mruby_content_handler_code '
          Nginx::Request.new.headers_out["Content-Length"] = "x"
          Nginx.rputs "not reached"
        ';
    }
    location = /cl_bad_negative {
        mruby_content_handler_code '
          Nginx::Request.new.headers_out["Content-Length"] = "-1"
          Nginx.rputs "not reached"
        ';
    }
    location = /cl_bad_array {
        mruby_content_handler_code '
          Nginx::Request.new.headers_out["Content-Length"] = ["1", "2"]
          Nginx.rputs "not reached"
        ';
    }
    # [] returns the value the script set.
    location = /cl_read {
        mruby_content_handler_code '
          h = Nginx::Request.new.headers_out
          h["Content-Length"] = "7"
          Nginx.rputs "get=#{h["Content-Length"]}"
        ';
    }
    # a content handler that sets Content-Length and answers 204 sends no
    # Content-Length, as nginx sends none for 204.
    location = /cl_204 {
        mruby_content_handler_code '
          Nginx::Request.new.headers_out["Content-Length"] = "5"
          Nginx.return 204
        ';
    }

    # a phase handler sets Content-Length before a static file: the file's
    # length is sent, with a warn.
    location = /cl_access_static {
        alias html/content_length_static.txt;
        mruby_access_handler_code '
          Nginx::Request.new.headers_out["Content-Length"] = "5"
        ';
    }

    # header filter on a proxied response of a known length.
    location = /cl_hf_proxy_wrong {
        mruby_output_header_filter_code '
          Nginx::Request.new.headers_out["Content-Length"] = "4"
        ';
        proxy_pass http://127.0.0.1:18122/u_static;
    }
    location = /cl_hf_proxy_read {
        mruby_output_header_filter_code '
          h = Nginx::Request.new.headers_out
          h["X-Cl"] = h["Content-Length"].to_s
        ';
        proxy_pass http://127.0.0.1:18122/u_static;
    }
    location = /cl_hf_proxy_correct {
        mruby_output_header_filter_code '
          Nginx::Request.new.headers_out["Content-Length"] = "28"
        ';
        proxy_pass http://127.0.0.1:18122/u_static;
    }
    location = /cl_hf_proxy_delete {
        mruby_output_header_filter_code '
          Nginx::Request.new.headers_out.delete("Content-Length")
        ';
        proxy_pass http://127.0.0.1:18122/u_static;
    }
    # header filter sets Content-Length on a proxied response of an unknown
    # length (the upstream sent no Content-Length): the response is sent
    # chunked, with a warn.
    location = /cl_hf_proxy_chunked {
        mruby_output_header_filter_code '
          Nginx::Request.new.headers_out["Content-Length"] = "4"
        ';
        proxy_pass http://127.0.0.1:18122/u_chunked;
    }
    # the same with a body filter: the body filter does not run for a response
    # of an unknown length, so the response is still sent chunked, with a warn.
    location = /cl_hf_bf_chunked {
        mruby_output_header_filter_code '
          Nginx::Request.new.headers_out["Content-Length"] = "4"
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body
        ';
        proxy_pass http://127.0.0.1:18122/u_chunked;
    }
    # a content handler that sets Content-Length and answers 304 sends no
    # Content-Length, as nginx sends none for 304.
    location = /cl_304 {
        mruby_content_handler_code '
          Nginx::Request.new.headers_out["Content-Length"] = "5"
          Nginx.return 304
        ';
    }
}

server {
    listen 18122;

    location = /u_static {
        alias html/content_length_static.txt;
    }
    # a response without a Content-Length: #delete clears the length, so this
    # server sends the body without one (chunked on HTTP/1.1, else close
    # delimited), and a proxy in front sees an unknown length.
    location = /u_chunked {
        mruby_content_handler_code '
          Nginx::Request.new.headers_out.delete("Content-Length")
          Nginx.rputs "static-file-body-0123456789\n"
        ';
    }
}
