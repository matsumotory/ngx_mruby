# Nginx::Headers_out Content-Length on the 2.x line. Setting Content-Length
# through Nginx::Headers_out does not add a second response header line next to
# the one nginx writes from the response body's length; nginx sends its own
# Content-Length, and content_length_n is left as nginx set it. Reading and
# deleting through Nginx::Headers_out are unchanged (delete has no effect on
# Content-Length, as before). v3 lets a script set the field; the 2.x line
# cannot change the length this way.
# Cases: test/t/cases/content_length.rb. Ports 18096 (the handlers) and 18122
# (the upstream of the proxy cases).
server {
    listen 18096;

    # content handler: the value the script sets is not sent as a second line;
    # nginx sends the length of the output.
    location = /cl_set_then_rputs {
        mruby_content_handler_code '
          Nginx::Request.new.headers_out["Content-Length"] = "3"
          Nginx.rputs "hello world"
        ';
    }
    location = /cl_set_correct {
        mruby_content_handler_code '
          b = "hello"
          Nginx::Request.new.headers_out["Content-Length"] = b.bytesize.to_s
          Nginx.rputs b
        ';
    }

    # header filter on a proxied response: the value is not sent; nginx sends
    # the length it has for the response.
    location = /cl_hf_proxy {
        mruby_output_header_filter_code '
          Nginx::Request.new.headers_out["Content-Length"] = "4"
        ';
        proxy_pass http://127.0.0.1:18122/u_static;
    }
    # #delete has no effect on Content-Length on the 2.x line: nginx's own
    # length stays.
    location = /cl_hf_proxy_delete {
        mruby_output_header_filter_code '
          Nginx::Request.new.headers_out.delete("Content-Length")
        ';
        proxy_pass http://127.0.0.1:18122/u_static;
    }
}

server {
    listen 18122;

    location = /u_static {
        alias html/content_length_static.txt;
    }
}
