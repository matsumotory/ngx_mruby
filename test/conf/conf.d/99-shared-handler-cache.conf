# A file-based mruby content handler at server level, with no cache keyword, is
# inherited by two locations. /off keeps mruby_cache off (the default) and
# recompiles the shared code on every request; /on has mruby_cache on and
# reuses the compiled proc. The suite runs with -DMRB_GC_STRESS.
# See test/t/cases/shared_handler_cache.rb.
server {
    listen 18121;
    server_name localhost;

    mruby_content_handler build/nginx/html/shared_handler_cache.rb;

    location = /off {
    }

    location = /on {
        mruby_cache on;
    }
}
