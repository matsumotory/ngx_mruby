# An mruby_set handler that waits in Nginx::Async.sleep. Cases:
# test/t/cases/async_set_var.rb. Port 18182.
#
# The handler runs build/nginx/html/async_set_var.rb, which reads from the
# URI whether it sleeps and how it ends. The server has no other mruby
# handler before the mruby_set, so no status that an earlier handler stored
# decides how the request goes on. The directives after the mruby_set in the
# same rewrite script run before the sleep ends, so the variable is read in
# later phases: by the content handler of /set/ and by proxy_pass in
# /proxy/.
server {
    listen 18182;

    location /set/ {
        mruby_set $async_set_value build/nginx/html/async_set_var.rb cache;
        mruby_content_handler_code 'Nginx.rputs "value=#{Nginx::Var.new.async_set_value}"';
    }

    location /proxy/ {
        mruby_set $async_set_value build/nginx/html/async_set_var.rb cache;
        proxy_pass http://127.0.0.1:18182/echo?v=$async_set_value;
    }

    location = /echo {
        mruby_content_handler_code 'Nginx.rputs "echo=#{Nginx::Request.new.args}"';
    }

    location = /plain {
        mruby_content_handler_code 'Nginx.rputs "plain"';
    }
}
