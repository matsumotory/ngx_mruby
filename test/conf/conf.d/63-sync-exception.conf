# How a request ends when a handler calls Nginx.rputs and then raises before
# its fiber ever yields, for each kind of handler that answers the request.
# Cases: test/t/cases/sync_exception.rb. Port 18143.
#
# Each handler below raises after Nginx.rputs "partial", so the request must
# get 500 with nginx's 500 page, without that output. A handler that raises
# after Nginx::Async.sleep resumed it answers the same way
# (53-async-exception-state.conf). /content_raise raises without any output
# and is the control: it answers 500 already.
#
# The access handler of /access_rputs_then_raise raises, so the content
# handler of that location must not run. Post-read and server rewrite
# handlers are set for a whole server, so they get servers of their own on
# the same port, selected with the Host header; their content handlers must
# not run either.
#
# mruby_set handlers and output header filters do not answer the request,
# so after their exception the request goes on. The output that they wrote
# before the exception must not be sent, and the Content-Length of the
# response must not count it. The content handlers of the /set_* locations
# write the variable of the mruby_set handler with inspect: after an
# exception the variable is an empty string, also when an earlier set
# directive of the location gave it a value.
#
# In /content_then_header_filter_rputs_then_raise and
# /content_then_header_filter_raise the content handler starts the response
# with Nginx.rputs, so the header filter runs while the content handler
# sends that output, and the filter's Nginx.rputs adds to the same output.
# Only the output of the filter is dropped: the client must get the content
# handler's output with its length, also when the filter raises without
# output.
server {
    listen 18143;

    location /content_rputs_then_raise {
        mruby_content_handler_code '
          Nginx.rputs "partial"
          raise "raised after the rputs"
        ';
    }

    location /rewrite_rputs_then_raise {
        mruby_rewrite_handler_code '
          Nginx.rputs "partial"
          raise "raised after the rputs"
        ';
    }

    location /access_rputs_then_raise {
        mruby_access_handler_code '
          Nginx.rputs "partial"
          raise "raised after the rputs"
        ';
        mruby_content_handler_code 'Nginx.rputs "content"';
    }

    location /content_raise {
        mruby_content_handler_code 'raise "raised without output"';
    }

    location /set_rputs_then_raise {
        mruby_set_code $sync_exception_set '
          Nginx.rputs "partial"
          raise "raised after the rputs"
        ';
        mruby_content_handler_code 'Nginx.rputs "[#{Nginx::Var.new.sync_exception_set.inspect}]"';
    }

    location /set_raise {
        mruby_set_code $sync_exception_set 'raise "raised without output"';
        mruby_content_handler_code 'Nginx.rputs "[#{Nginx::Var.new.sync_exception_set.inspect}]"';
    }

    location /set_after_set_rputs_then_raise {
        set $sync_exception_set "earlier";
        mruby_set_code $sync_exception_set '
          Nginx.rputs "partial"
          raise "raised after the rputs"
        ';
        mruby_content_handler_code 'Nginx.rputs "[#{Nginx::Var.new.sync_exception_set.inspect}]"';
    }

    location /header_filter_rputs_then_raise {
        return 200 "origin";
        mruby_output_header_filter_code '
          Nginx.rputs "partial"
          raise "raised after the rputs"
        ';
    }

    location /content_then_header_filter_rputs_then_raise {
        mruby_content_handler_code 'Nginx.rputs "origin"';
        mruby_output_header_filter_code '
          Nginx.rputs "partial"
          raise "raised after the rputs"
        ';
    }

    location /content_then_header_filter_raise {
        mruby_content_handler_code 'Nginx.rputs "origin"';
        mruby_output_header_filter_code 'raise "raised without output"';
    }
}

server {
    listen 18143;
    server_name post-read.sync-exception.test;

    mruby_post_read_handler_code '
      Nginx.rputs "partial"
      raise "raised after the rputs"
    ';

    location / {
        mruby_content_handler_code 'Nginx.rputs "content"';
    }
}

server {
    listen 18143;
    server_name server-rewrite.sync-exception.test;

    mruby_server_rewrite_handler_code '
      Nginx.rputs "partial"
      raise "raised after the rputs"
    ';

    location / {
        mruby_content_handler_code 'Nginx.rputs "content"';
    }
}
