# What Nginx::Upstream.new and Nginx::Upstream#server= accept. Cases:
# test/t/cases/upstream_server_checks.rb. Port 18135. The upstream addresses
# are documentation addresses (192.0.2.0/24) that nginx only parses and
# never connects to.
#
# mrb_ups_check_ab comes before mrb_ups_check_a, so a lookup that compared
# only the length of the argument would find it for "mrb_ups_check_a".
upstream mrb_ups_check_ab {
    server 192.0.2.1:80;
}

upstream mrb_ups_check_a {
    server 192.0.2.2:80;
}

upstream mrb_ups_check_zone {
    zone mrb_ups_check_zone 64k;
    server 192.0.2.3:80;
}

server {
    listen 18135;

    # The upstream whose name is the argument, not one whose name starts
    # with it.
    location /lookup {
        mruby_content_handler_code '
          Nginx.rputs Nginx::Upstream.new("mrb_ups_check_a").server
        ';
    }

    # No upstream is named "mrb_ups_check".
    location /lookup_prefix {
        mruby_content_handler_code '
          begin
            Nginx::Upstream.new "mrb_ups_check"
            Nginx.rputs "found"
          rescue RuntimeError => e
            Nginx.rputs "RuntimeError"
          end
        ';
    }

    # An upstream with a zone: server= raises and leaves the server as it was.
    location /zone {
        mruby_content_handler_code '
          u = Nginx::Upstream.new "mrb_ups_check_zone"
          begin
            u.server = "192.0.2.4:80"
            Nginx.rputs "changed to #{u.server}"
          rescue RuntimeError => e
            Nginx.rputs "RuntimeError, #{u.server}"
          end
        ';
    }

    # An argument that is not a String.
    location /server_nil {
        mruby_content_handler_code '
          u = Nginx::Upstream.new "mrb_ups_check_a"
          begin
            u.server = nil
            Nginx.rputs "no error"
          rescue TypeError => e
            Nginx.rputs "TypeError, #{u.server}"
          end
        ';
    }

    # A String with a NUL byte: server= raises and leaves the server as it was.
    location /server_nul {
        mruby_content_handler_code '
          values = {
            "unix" => "unix:/tmp/x" + 0.chr + "ab",
            "ipv4" => "192.0.2.9" + 0.chr + "ab",
          }
          u = Nginx::Upstream.new "mrb_ups_check_a"
          begin
            u.server = values[Nginx::Request.new.args]
            Nginx.rputs "changed"
          rescue ArgumentError => e
            Nginx.rputs "ArgumentError, #{u.server}, #{e.message}"
          end
        ';
    }

    location /new_nil {
        mruby_content_handler_code '
          begin
            Nginx::Upstream.new nil
            Nginx.rputs "no error"
          rescue TypeError => e
            Nginx.rputs "TypeError"
          end
        ';
    }
}
