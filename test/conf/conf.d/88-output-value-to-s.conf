# The argument of Nginx.rputs, Nginx.echo, Nginx.redirect,
# Nginx::Filter#body= and Nginx::Filter#output when it is not a String:
# ngx_mruby converts it with to_s. Cases: test/t/cases/output_value_to_s.rb.
# Hook script: test/html/output_value_to_s.rb. Port 18191.
#
# The query of a request names the case: call (rputs, echo, redirect, body
# or output), value (string, to_s_string, no_to_s, to_s_raises or
# to_s_not_string) and, with rescue=no, a call whose exception the hook
# script does not rescue.
server {
    listen 18191;

    # Nginx.rputs and Nginx.echo in a content handler.
    location = /content {
        mruby_content_handler build/nginx/html/output_value_to_s.rb cache;
    }

    # Nginx.redirect in a rewrite handler. When the call raises and the
    # script rescues it, the script puts the exception in the response
    # header X-Raised and the content handler answers "no redirect".
    location = /redirect {
        mruby_rewrite_handler build/nginx/html/output_value_to_s.rb cache;
        mruby_content_handler_code 'Nginx.rputs "no redirect"';
    }

    # Nginx::Filter#body= and Nginx::Filter#output in a body filter of a
    # static file.
    location = /filter {
        alias html/output_filters_static.txt;
        mruby_output_body_filter build/nginx/html/output_value_to_s.rb cache;
    }
}
