# A location with an mruby header filter and an mruby body filter that makes
# the body longer. Cases: test/t/cases/header_and_body_filter.rb. Port 18150.
#
# The header must leave with the length of the body that the body filter
# produced: the Content-Length of each response is the length of its body,
# so a second request on the same connection gets its own response. The
# header filter sets a response header, which must reach the client too.
server {
    listen 18150;

    # A static file as the origin.
    location = /static {
        alias html/output_filters_static.txt;
        mruby_output_header_filter_code 'Nginx::Request.new.headers_out["X-Header-Filter"] = "ran"';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body + "(processed by body_filter)"
        ';
    }

    # An mruby content handler that writes with Nginx.rputs as the origin.
    location = /rputs {
        mruby_content_handler_code 'Nginx.rputs "rputs origin"';
        mruby_output_header_filter_code 'Nginx::Request.new.headers_out["X-Header-Filter"] = "ran"';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body + "(processed by body_filter)"
        ';
    }
}
