# Nginx.redirect with a local URI raises a RuntimeError in mruby_set
# handlers and in header and body filters (decision 1 and section 2.9 of
# docs/proposals/core-alpha1.md), as it does in log handlers: nginx would
# otherwise run the handlers of the target inside the Ruby call. The target
# has a content handler that waits, which a handler run inside the call
# could not keep. Cases: test/t/cases/redirect_nested.rb. Port 18126.
server {
    listen 18126;
    server_name localhost;

    location = /target {
        mruby_content_handler_code '
          Nginx::Async.sleep 10
          Nginx.rputs "target"
        ';
    }

    # An mruby_set handler without a rescue: the exception leaves the
    # variable empty, as any exception there does, and the content handler
    # of this location answers.
    location = /set {
        mruby_set_code $redirect_nested_value '
          Nginx.redirect "/target"
          "set"
        ';
        mruby_content_handler_code 'Nginx.rputs "value=#{Nginx::Var.new.redirect_nested_value}"';
    }

    # The filters rescue the exception and put it in a response header,
    # which both can still set: the body filter runs before nginx sends the
    # header, because the location has no mruby header filter.
    location = /header_filter {
        mruby_content_handler_code 'Nginx.rputs "body"';
        mruby_output_header_filter_code '
          begin
            Nginx.redirect "/target"
            msg = "no exception"
          rescue => e
            msg = "#{e.class}: #{e.message}"
          end
          Nginx::Request.new.headers_out["X-Redirect-Nested"] = msg
        ';
    }

    location = /body_filter {
        mruby_content_handler_code 'Nginx.rputs "body"';
        mruby_output_body_filter_code '
          begin
            Nginx.redirect "/target"
            msg = "no exception"
          rescue => e
            msg = "#{e.class}: #{e.message}"
          end
          Nginx::Request.new.headers_out["X-Redirect-Nested"] = msg
        ';
    }

    # A redirect with a URL only sets Location and the status, and keeps
    # working in a header filter.
    location = /header_filter_url {
        mruby_content_handler_code 'Nginx.rputs "body"';
        mruby_output_header_filter_code 'Nginx.redirect "http://example.com/redirected"';
    }
}
