# An mruby content handler and the mruby output filters in the same location
# (issue #206). Cases: test/t/cases/output_filters_with_content_handler.rb.
# Port 18138.
#
# When the code of the content handler ends, ngx_mruby sends what it wrote
# with Nginx.rputs: the header with ngx_http_send_header, which runs the
# header filter, and then the body with ngx_http_output_filter, which runs
# the body filter. The header filters count their runs in a response header.
# The body filters keep the length of the body; a body filter that makes the
# body of an Nginx.rputs origin longer is covered by
# test/t/cases/filter_connection.rb.
server {
    listen 18138;

    # A static file as the origin: the header filter without a content
    # handler.
    location = /output_filters_static.txt {
        mruby_output_header_filter_code '
          r = Nginx::Request.new
          runs = r.headers_out["X-Header-Filter-Runs"]
          r.headers_out["X-Header-Filter-Runs"] = (runs.nil? ? 1 : runs.to_i + 1).to_s
        ';
    }

    location /content_and_body_filter {
        mruby_content_handler_code 'Nginx.rputs "origin"';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    # The same static file with both filters, and a body filter that also
    # calls Nginx.rputs, which docs/class_and_method/README.md says cannot be
    # used there. ngx_mruby drops what the body filter wrote, so the response
    # is the file in upper case. The second location adds a log handler,
    # which runs after the response was sent and must not send anything.
    location = /static_body_filter_rputs {
        alias html/output_filters_static.txt;
        mruby_output_header_filter_code '
          r = Nginx::Request.new
          runs = r.headers_out["X-Header-Filter-Runs"]
          r.headers_out["X-Header-Filter-Runs"] = (runs.nil? ? 1 : runs.to_i + 1).to_s
        ';
        mruby_output_body_filter_code '
          Nginx.rputs "EXTRA"
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    location = /static_body_filter_rputs_log {
        alias html/output_filters_static.txt;
        mruby_output_header_filter_code '
          r = Nginx::Request.new
          runs = r.headers_out["X-Header-Filter-Runs"]
          r.headers_out["X-Header-Filter-Runs"] = (runs.nil? ? 1 : runs.to_i + 1).to_s
        ';
        mruby_output_body_filter_code '
          Nginx.rputs "EXTRA"
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
        mruby_log_handler_code '
          Nginx.errlogger Nginx::LOG_NOTICE, "log handler ran for #{Nginx::Request.new.uri}"
        ';
    }

    # An access handler that writes with Nginx.rputs and then answers 403
    # with Nginx.return, which marks the last buffer of its chain. nginx
    # sends its own 403 page through both filters, and the chain stays in
    # the module ctx. limit_rate is lower than the length of the page, so
    # nginx sends the page in more than one write: ngx_http_writer calls the
    # body filter again with no new data, and the filter must pass that call
    # on. send_timeout ends a response that stops early. The log handler
    # runs after the response and must not send the chain.
    location = /deny_rputs_slow {
        limit_rate 100;
        send_timeout 5s;
        server_tokens off;
        mruby_access_handler_code 'Nginx.rputs "denied"; Nginx.return Nginx::HTTP_FORBIDDEN';
        mruby_output_header_filter_code '
          r = Nginx::Request.new
          runs = r.headers_out["X-Header-Filter-Runs"]
          r.headers_out["X-Header-Filter-Runs"] = (runs.nil? ? 1 : runs.to_i + 1).to_s
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
        mruby_log_handler_code '
          Nginx.errlogger Nginx::LOG_NOTICE, "log handler ran for #{Nginx::Request.new.uri}"
        ';
    }

    location /content_and_header_filter {
        mruby_content_handler_code 'Nginx.rputs "origin"';
        mruby_output_header_filter_code '
          r = Nginx::Request.new
          runs = r.headers_out["X-Header-Filter-Runs"]
          r.headers_out["X-Header-Filter-Runs"] = (runs.nil? ? 1 : runs.to_i + 1).to_s
        ';
    }

    location /content_and_both_filters {
        mruby_content_handler_code 'Nginx.rputs "origin"';
        mruby_output_header_filter_code '
          r = Nginx::Request.new
          runs = r.headers_out["X-Header-Filter-Runs"]
          r.headers_out["X-Header-Filter-Runs"] = (runs.nil? ? 1 : runs.to_i + 1).to_s
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    # A rewrite handler that writes the response with Nginx.rputs sends it
    # the same way as a content handler.
    location /rewrite_and_header_filter {
        mruby_rewrite_handler_code 'Nginx.rputs "origin"';
        mruby_output_header_filter_code '
          r = Nginx::Request.new
          runs = r.headers_out["X-Header-Filter-Runs"]
          r.headers_out["X-Header-Filter-Runs"] = (runs.nil? ? 1 : runs.to_i + 1).to_s
        ';
    }
}
