# Nginx::Upstream#server= must keep the round-robin peer valid for later
# requests. The peer lives for the worker's life (the configuration pool) and
# is shared by every request that uses the upstream, so its name and address
# must not point into the request pool of the request that set them, which is
# freed when that request ends. /set sets the server to a different address
# than the one in the upstream block, and /get, a separate request, reads it
# back. Cases: test/t/cases/upstream_server.rb. Port 18139 (the addresses
# 127.0.0.1:18160 and 127.0.0.1:18161 are only parsed, never connected).
upstream mrb_dyn_upstream_uaf {
    server 127.0.0.1:18160;
}

server {
    listen 18139;

    location /set {
        mruby_content_handler_code '
          u = Nginx::Upstream.new "mrb_dyn_upstream_uaf"
          port = "18161"
          u.server = "127.0.0.1:" + port
          Nginx.rputs "set"
        ';
    }

    location /get {
        mruby_content_handler_code '
          u = Nginx::Upstream.new "mrb_dyn_upstream_uaf"
          Nginx.rputs u.server
        ';
    }
}
