# Nginx::Var assigns $args, a variable that has a set_handler, through the
# setter of Nginx::Var and through Nginx::Var#set, and reads it back. Before
# the fix, the setter passed a value struct straight from ngx_palloc to the
# set_handler, whose fields the set_handler then read uninitialised, so the
# assigned query string did not reach r->args. Case:
# test/t/cases/var_setter_init.rb. Hook script: test/html/var_setter_init.rb.
# Port 18104.
server {
    listen 18104;
    access_log off;

    location / {
        mruby_content_handler build/nginx/html/var_setter_init.rb;
    }
}
