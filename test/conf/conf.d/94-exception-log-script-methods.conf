# Exceptions whose class redefines #inspect or #backtrace, which ngx_mruby
# calls when it writes the exception to error.log. Cases:
# test/t/cases/exception_log_script_methods.rb. Port 18091. The stream
# sessions of the same cases are in
# test/conf/conf.d/stream/52-exception-log-script-methods.conf. The messages
# are computed (6 * 7), so that the lines of the exceptions differ from the
# source of the code, which nginx writes to error.log at the debug level when
# it starts.
server {
    listen 18091;
    server_name localhost;

    # #inspect raises: the line of the exception names its class.
    location /script_methods/inspect_raises {
        mruby_content_handler_code '
            class ScriptMethodsInspectRaises < RuntimeError
              def inspect
                raise ArgumentError, "script methods: inspect raised #{6 * 7}"
              end
            end
            raise ScriptMethodsInspectRaises, "script methods: inspect raises #{6 * 7}"
        ';
    }

    # #backtrace raises: in the debug build of test.sh, the backtrace is
    # logged as one that is not an Array, at the debug level, with no frame.
    location /script_methods/backtrace_raises {
        mruby_content_handler_code '
            class ScriptMethodsBacktraceRaises < RuntimeError
              def backtrace
                raise ArgumentError, "script methods: backtrace raised #{6 * 7}"
              end
            end
            raise ScriptMethodsBacktraceRaises, "script methods: backtrace raises #{6 * 7}"
        ';
    }

    # #inspect returns an Integer: the line of the exception names its class.
    location /script_methods/inspect_not_string {
        mruby_content_handler_code '
            class ScriptMethodsInspectNotString < RuntimeError
              def inspect
                6 * 7
              end
            end
            raise ScriptMethodsInspectNotString, "script methods: inspect not string #{6 * 7}"
        ';
    }

    # #inspect returns a String: the line of the exception has that String.
    location /script_methods/inspect_string {
        mruby_content_handler_code '
            class ScriptMethodsInspectString < RuntimeError
              def inspect
                "script methods: the inspect of the script #{6 * 7}"
              end
            end
            raise ScriptMethodsInspectString, "script methods: inspect string #{6 * 7}"
        ';
    }

    # #backtrace returns an Array with elements that are not Strings. In the
    # debug build of test.sh, ngx_mruby logs the Strings of the backtrace and
    # skips the other elements.
    location /script_methods/backtrace_types {
        mruby_content_handler_code '
            class ScriptMethodsBacktraceTypes < RuntimeError
              def backtrace
                ["script methods: first frame #{6 * 7}", 1, nil, :frame, [], "script methods: last frame #{6 * 7}"]
              end
            end
            raise ScriptMethodsBacktraceTypes, "script methods: backtrace types #{6 * 7}"
        ';
    }

    # #backtrace returns nil: ngx_mruby logs, at the debug level, that the
    # backtrace is not an Array, and no frame.
    location /script_methods/backtrace_not_array {
        mruby_content_handler_code '
            class ScriptMethodsBacktraceNotArray < RuntimeError
              def backtrace
                nil
              end
            end
            raise ScriptMethodsBacktraceNotArray, "script methods: backtrace not array #{6 * 7}"
        ';
    }

    # Nginx.redirect from an mruby_set handler makes the internal redirect
    # inside the Ruby call: the content handler of the target, which raises,
    # runs while the code of the mruby_set handler is still on the C stack
    # (mrb->jmp is set), and its exception is logged there.
    location /script_methods/set_redirect_inspect_raises {
        mruby_set_code $script_methods_redirected 'Nginx.redirect "/script_methods/inspect_raises"; "set"';
        mruby_content_handler_code 'Nginx.rputs "after the redirect"';
    }

    location /script_methods/set_redirect_backtrace_raises {
        mruby_set_code $script_methods_redirected 'Nginx.redirect "/script_methods/backtrace_raises"; "set"';
        mruby_content_handler_code 'Nginx.rputs "after the redirect"';
    }

    # The active connections of the worker, for the cases inside another
    # mruby call: a request that nginx does not finish keeps its connection.
    location /status {
        stub_status;
    }

    location /script_methods/hello {
        mruby_content_handler_code 'Nginx.rputs "hello"';
    }
}
