# Handlers that answer a POST without reading its body.
# Cases: test/t/cases/unread_request_body.rb. Port 18151.
#
# The body of each POST in the cases is itself a complete GET request for
# /leaf. A handler that answers without reading the body must leave nothing
# of it on the connection, so the next request that the client sends on the
# connection gets its own answer and /leaf is never answered.
server {
    listen 18151;

    # A content handler that writes with Nginx.rputs and does not read the body.
    location = /answer {
        mruby_content_handler_code 'Nginx.rputs "answer"';
    }

    # A rewrite handler that writes with Nginx.rputs and does not read the body.
    location = /rewrite_answer {
        mruby_rewrite_handler_code 'Nginx.rputs "rewrite answer"';
    }

    # The same after Nginx::Async.sleep: the answer is sent when nginx
    # resumes the handler from a timer.
    location = /rewrite_sleep_answer {
        mruby_rewrite_handler_code '
          Nginx::Async.sleep 10
          Nginx.rputs "slept answer"
        ';
    }

    # A content handler that reads the body: it must still see all of it.
    location = /read_body {
        mruby_enable_read_request_body on;
        mruby_content_handler_code 'Nginx.rputs "body=[#{Nginx::Request.new.body}]"';
    }

    location = /leaf {
        mruby_content_handler_code 'Nginx.rputs "leaf"';
    }

    location = /next {
        mruby_content_handler_code 'Nginx.rputs "next"';
    }
}
