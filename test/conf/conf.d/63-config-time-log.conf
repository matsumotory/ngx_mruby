# Directives whose code ngx_mruby compiles while nginx reads the
# configuration (issue #320): a handler file, inline handler code, and
# mruby_set_code, which also logs its target variable. The log level of those
# messages is checked in test/t/cases/config_time_log.rb, in the log of this
# nginx and in the log of an nginx -t that includes this file.
# Port 18140. Hook file: test/html/config_time_log.rb.

server {
    listen 18140;

    location /config_time_log/file {
        mruby_set_code $config_time_log_value '"set code ran"';
        mruby_content_handler build/nginx/html/config_time_log.rb;
    }

    location /config_time_log/inline {
        mruby_content_handler_code 'Nginx.rputs "inline handler ran"';
    }
}
