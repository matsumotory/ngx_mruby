# GC roots of async fibers when Nginx::Async::HTTP.sub_request raises.
# Cases: test/t/cases/async_subrequest_raise.rb. Port 18124.
#
# Every handler runs in a fiber that is registered with mrb_gc_register while
# it can be resumed. /inner runs as an in-memory subrequest of /outer, so its
# own sub_request fails in ngx_http_subrequest ("nested in-memory
# subrequest") and raises. The fiber of /inner must not stay in the GC root
# after that exception.
server {
    listen 18124;

    location /outer {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/inner"
          Nginx::Async::HTTP.last_response
          Nginx.rputs "outer done"
          Nginx.return Nginx::HTTP_OK
        ';
    }

    location /inner {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/leaf"
          Nginx.rputs "unreachable"
          Nginx.return Nginx::HTTP_OK
        ';
    }

    location /leaf {
        return 200 "leaf";
    }

    # Number of live Fiber objects after a full GC. A fiber that is still in
    # the GC root survives GC.start. The count includes the fiber of this
    # handler itself.
    location /fibers {
        mruby_content_handler_code '
          GC.start
          n = 0
          ObjectSpace.each_object(Fiber) { |f| n += 1 }
          Nginx.rputs n.to_s
        ';
    }
}
