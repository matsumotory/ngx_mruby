# The mruby log handlers run before access_log, and access_log writes the
# status that was sent. Cases: test/t/cases/log_before_access_log.rb.
# Port 18195. The access log of this server is
# logs/log_before_access_log.log, which the cases read.
#
# Each location declares $log_value with "set" in the rewrite phase, and its
# log handler assigns another value. access_log writes the value that the
# log handler assigned, and the status of the response, also after the log
# handler raised (an exception sets 500) or set a status itself.
log_format log_before_access_log '$request_uri $status $log_value';

server {
    listen 18195;
    access_log logs/log_before_access_log.log log_before_access_log;

    location = /assign {
        set $log_value "unset";
        mruby_content_handler_code 'Nginx.rputs "assign"';
        mruby_log_handler_code 'Nginx::Var.new.log_value = "from-ruby"';
    }

    # The file-based log handler runs before access_log as well.
    location = /assign_file {
        set $log_value "unset";
        mruby_content_handler_code 'Nginx.rputs "assign_file"';
        mruby_log_handler build/nginx/html/log_before_access_log.rb;
    }

    location = /raise {
        set $log_value "unset";
        mruby_content_handler_code 'Nginx.rputs "raise"';
        mruby_log_handler_code '
          Nginx::Var.new.log_value = "before-raise"
          raise "log handler before access_log raised"
        ';
    }

    location = /set_status {
        set $log_value "unset";
        mruby_content_handler_code 'Nginx.rputs "set_status"';
        mruby_log_handler_code '
          Nginx::Var.new.log_value = "set-status"
          Nginx.return Nginx::HTTP_SERVICE_UNAVAILABLE
        ';
    }

    # Nginx.redirect with a local URI raises in a log handler: the code after
    # it does not run, and no internal redirect to /assign is made.
    location = /redirect {
        set $log_value "unset";
        mruby_content_handler_code 'Nginx.rputs "redirect"';
        mruby_log_handler_code '
          Nginx::Var.new.log_value = "before-redirect"
          Nginx.redirect "/assign"
          Nginx::Var.new.log_value = "after-redirect"
        ';
    }

    # A status other than 200: nginx's return sends 404 with a body, and the
    # log handler raises.
    location = /raise_404 {
        set $log_value "unset";
        return 404 "missing";
        mruby_log_handler_code '
          Nginx::Var.new.log_value = "raised-404"
          raise "log handler before access_log raised after 404"
        ';
    }
}
