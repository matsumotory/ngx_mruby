# Calls the Dir class (the mruby core gem mruby-dir) from a handler, on
# test/html/gem_dir, which holds the files one.txt and two.txt. The body has
# one line per check, and a check that raises prints the exception class, so
# that a change of Dir shows as a changed line instead of a 500.
# Dir.children and Dir#each_child are aliases of Dir.entries and Dir#each in
# mruby 3.3.0 and list "." and ".."; their lines change when mruby changes
# that. That Dir.foreach closes the Dir it opened is not checked: the script
# cannot reach that Dir.
# Port 18127. The cases are in test/t/cases/gem_dir.rb.

server {
    listen 18127;

    location /gem_dir {
        mruby_content_handler_code '
            path = "__NGXDOCROOT__gem_dir"
            lines = []

            lines << [Dir.exist?(path), Dir.exist?(path + "/missing"), Dir.exist?(path + "/one.txt")].join(",")
            lines << Dir.entries(path).sort.join(",")

            d = Dir.open(path)
            names = []
            while name = d.read
              names << name
            end
            d.close
            lines << names.sort.join(",")

            lines << begin
              d.read
              "no error"
            rescue => e
              e.class.to_s
            end
            lines << begin
              d.close
              "no error"
            rescue => e
              e.class.to_s
            end

            lines << begin
              Dir.open(path) { |dir| dir.close; "block value" }
            rescue => e
              e.class.to_s
            end
            lines << begin
              Dir.open(path) { |dir| dir.select { |n| n.end_with?(".txt") }.sort.join(",") }
            rescue => e
              e.class.to_s
            end

            lines << begin
              Dir.children(path).sort.join(",")
            rescue => e
              e.class.to_s
            end
            lines << begin
              Dir.open(path) { |dir|
                children = []
                dir.each_child { |n| children << n }
                children.sort.join(",")
              }
            rescue => e
              e.class.to_s
            end
            lines << begin
              Dir.empty?(path).to_s
            rescue => e
              e.class.to_s
            end

            Nginx.rputs lines.join("\n")
        ';
    }
}
