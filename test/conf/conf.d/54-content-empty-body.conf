# How a content handler that writes no output answers (issues #200, #225).
# Cases: test/t/cases/content_empty_body.rb. Port 18136.
#
# On next (v3), a content handler on the main request that ends without
# output answers as nginx's own "return 200;" does: its status (200 when it
# set none, or the 2xx status it set) with Content-Length: 0 and an empty
# body, and nginx keeps the connection for the next request. This holds when
# the handler writes nothing or only an empty String or nil with
# Nginx.rputs, when it only sets response headers, when it returns
# Nginx::HTTP_OK or Nginx::HTTP_ACCEPTED, when it ends that way after
# Nginx::Async::HTTP.sub_request resumed it, for a HEAD request, and when the
# location has output filters. The 2.x line answers 500 there instead
# (docs/releases/v2.7.1.md).
#
# The other locations check what must not change: Nginx::HTTP_CREATED and
# Nginx::HTTP_NO_CONTENT (nginx answers them), a status below 200 (500), a
# handler with output, Nginx.redirect to a location whose rewrite handler is
# still sleeping (that location's body, later), a subrequest whose content
# handler writes nothing (it ends without a response body and the parent
# reads status 0, as before), and Nginx::HTTP_OK without output in a rewrite
# handler (500, as before).
server {
    listen 18136;

    location /rputs_empty {
        mruby_content_handler_code 'Nginx.rputs ""';
    }

    location /rputs_nil {
        mruby_content_handler_code 'Nginx.rputs nil';
    }

    location /headers_only {
        mruby_content_handler_code '
          Nginx::Request.new.headers_out["X-Empty-Body"] = "yes"
        ';
    }

    location /return_http_ok {
        mruby_content_handler_code 'Nginx.return Nginx::HTTP_OK';
    }

    location /return_accepted {
        mruby_content_handler_code 'Nginx.return Nginx::HTTP_ACCEPTED';
    }

    location /sub_request_then_nothing {
        mruby_content_handler_code 'Nginx::Async::HTTP.sub_request "/leaf"';
    }

    location /sub_request_then_return_ok {
        mruby_content_handler_code '
          Nginx::Async::HTTP.sub_request "/leaf"
          Nginx.return Nginx::HTTP_OK
        ';
    }

    location /leaf {
        return 200 "leaf";
    }

    # A header filter and a body filter in the location of the handler.
    location /empty_with_header_filter {
        mruby_content_handler_code 'Nginx.return Nginx::HTTP_OK';
        mruby_output_header_filter_code '
          Nginx::Request.new.headers_out["X-Header-Filter"] = "ran"
        ';
    }

    location /empty_with_body_filter {
        mruby_content_handler_code 'Nginx.return Nginx::HTTP_OK';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = "filtered:" + f.body
        ';
    }

    location /empty_with_body_filter_unchanged {
        mruby_content_handler_code 'Nginx.return Nginx::HTTP_OK';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body
        ';
    }

    location /return_created {
        mruby_content_handler_code 'Nginx.return Nginx::HTTP_CREATED';
    }

    location /return_204 {
        mruby_content_handler_code 'Nginx.return Nginx::HTTP_NO_CONTENT';
    }

    location /return_below_200 {
        mruby_content_handler_code 'Nginx.return 150';
    }

    location /with_output {
        mruby_content_handler_code 'Nginx.rputs "output"';
    }

    location /redirect_to_sleeper {
        mruby_content_handler_code 'Nginx.redirect "/sleeper"';
    }

    location /sleeper {
        mruby_rewrite_handler_code '
          Nginx::Async.sleep 10
          Nginx.rputs "slept"
        ';
    }

    location /sub_request_to_empty {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/rputs_empty"
          res = Nginx::Async::HTTP.last_response
          Nginx.rputs "status:#{res.status} body:#{res.body}"
        ';
    }

    location /rewrite_return_ok {
        mruby_rewrite_handler_code 'Nginx.return Nginx::HTTP_OK';
    }
}
