# How a content handler that writes no output answers (issue #225).
# Cases: test/t/cases/content_empty_body.rb. Port 18136.
#
# A content handler that ends without output must get a response. On the 2.x
# line the answer is the one that Nginx.return Nginx::HTTP_OK without output
# already gets: 500 with nginx's error page, and nginx closes the connection.
# This holds when the handler sets no status and writes nothing or only an
# empty String or nil with Nginx.rputs, when it sets a 2xx status that nginx
# does not answer by itself (Nginx::HTTP_ACCEPTED), and when the handler ends
# that way after Nginx::Async::HTTP.sub_request resumed it.
#
# The other locations check what must not change: Nginx::HTTP_OK without
# output (500), Nginx::HTTP_NO_CONTENT (204 without a body), a handler with
# output, Nginx.redirect to a location whose rewrite handler is still
# sleeping (that location's body, later), and a subrequest whose content
# handler writes nothing (it ends without a response body and the parent
# reads status 0, as before).
server {
    listen 18136;

    location /rputs_empty {
        mruby_content_handler_code 'Nginx.rputs ""';
    }

    location /rputs_nil {
        mruby_content_handler_code 'Nginx.rputs nil';
    }

    location /headers_only {
        mruby_content_handler_code '
          Nginx::Request.new.headers_out["X-Empty-Body"] = "yes"
        ';
    }

    location /return_accepted {
        mruby_content_handler_code 'Nginx.return Nginx::HTTP_ACCEPTED';
    }

    location /sub_request_then_nothing {
        mruby_content_handler_code 'Nginx::Async::HTTP.sub_request "/leaf"';
    }

    location /leaf {
        return 200 "leaf";
    }

    location /return_http_ok {
        mruby_content_handler_code 'Nginx.return Nginx::HTTP_OK';
    }

    location /return_204 {
        mruby_content_handler_code 'Nginx.return Nginx::HTTP_NO_CONTENT';
    }

    location /with_output {
        mruby_content_handler_code 'Nginx.rputs "output"';
    }

    location /redirect_to_sleeper {
        mruby_content_handler_code 'Nginx.redirect "/sleeper"';
    }

    location /sleeper {
        mruby_rewrite_handler_code '
          Nginx::Async.sleep 10
          Nginx.rputs "slept"
        ';
    }

    location /sub_request_to_empty {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/rputs_empty"
          res = Nginx::Async::HTTP.last_response
          Nginx.rputs "status:#{res.status} body:#{res.body}"
        ';
    }
}
