# A rewrite or access handler that returns Nginx::DECLINED after
# Nginx::Async.sleep.
# Cases: test/t/cases/async_rewrite_declined.rb. Port 18187.
#
# After the sleep, the request goes on to the next phase as for a rewrite
# handler that did not sleep. The access handler of each location sets no
# status, so the request must not answer with a status from the resumed
# rewrite handler: the content handler answers 200 with its body, and the
# static file is served with 200.
server {
    listen 18187;

    location /declined_then_content {
        mruby_rewrite_handler_code '
          Nginx::Async.sleep 100
          Nginx.return Nginx::DECLINED
        ';
        mruby_access_handler_code 'x = 1';
        mruby_content_handler_code 'Nginx.rputs "ok"';
    }

    location = /async_rewrite_declined.txt {
        mruby_rewrite_handler_code '
          Nginx::Async.sleep 100
          Nginx.return Nginx::DECLINED
        ';
        mruby_access_handler_code 'x = 1';
    }

    # an access handler that declines after its sleep, with a content
    # handler that sets no status and writes no output, and the same
    # location without the sleep: both must answer the same
    location /access_declined_then_nothing {
        mruby_access_handler_code '
          Nginx::Async.sleep 100
          Nginx.return Nginx::DECLINED
        ';
        mruby_content_handler_code 'x = 1';
    }

    location /access_declined_without_sleep_then_nothing {
        mruby_access_handler_code 'Nginx.return Nginx::DECLINED';
        mruby_content_handler_code 'x = 1';
    }
}
