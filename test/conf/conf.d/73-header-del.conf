# ngx_mrb_del_request_header deletes a request header. The cases exercise a
# name that is a prefix of a header (/prefix), emptying the full first part
# while a second part exists (/empty-first), and deleting from the middle of
# a full part before adding headers (/overflow). Case:
# test/t/cases/header_del.rb. Hook script: test/html/header_del.rb. Port 18105.
server {
    listen 18105;
    access_log off;

    location / {
        mruby_content_handler build/nginx/html/header_del.rb;
    }
}
