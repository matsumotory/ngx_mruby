# Nginx::Upstream objects that hold no upstream: one from allocate, one
# whose initialize raised, and one whose second initialize raised. Their
# methods raise ArgumentError, and the worker answers the next request.
# Cases: test/t/cases/upstream_uninitialized.rb. Port 18093. The upstream
# addresses are documentation addresses (192.0.2.0/24) that nginx only
# parses and never connects to.
upstream mrb_ups_uninit_a {
    server 192.0.2.31:80;
}

upstream mrb_ups_uninit_multi {
    server 192.0.2.32:80;
    server 192.0.2.33:80;
}

server {
    listen 18093;

    # The query is "OBJECT-METHOD": how the object is made, and the method
    # that is called on it. The handler does not rescue the exception of
    # the method, so ngx_mruby logs it and answers 500.
    location /call {
        mruby_content_handler_code '
          object, method = Nginx::Request.new.args.to_s.split("-", 2)
          u = Nginx::Upstream.allocate
          case object
          when "not_found"
            begin
              u.send :initialize, "mrb_ups_uninit_none"
            rescue RuntimeError
            end
          when "multiple"
            begin
              u.send :initialize, "mrb_ups_uninit_multi"
            rescue RuntimeError
            end
          when "reinit"
            u = Nginx::Upstream.new "mrb_ups_uninit_a"
            begin
              u.send :initialize, "mrb_ups_uninit_none"
            rescue RuntimeError
            end
          end
          case method
          when "server"
            Nginx.rputs "server #{u.server.inspect}"
          when "server_set"
            u.server = "192.0.2.34:80"
            Nginx.rputs "server= done"
          when "keepalive_cache"
            Nginx.rputs "keepalive_cache #{u.keepalive_cache}"
          when "keepalive_cache_set"
            u.keepalive_cache = 4
            Nginx.rputs "keepalive_cache= done"
          end
        ';
    }

    # An object whose initialize raised, then succeeded.
    location /recover {
        mruby_content_handler_code '
          u = Nginx::Upstream.allocate
          begin
            u.send :initialize, "mrb_ups_uninit_none"
          rescue RuntimeError
          end
          u.send :initialize, "mrb_ups_uninit_a"
          Nginx.rputs u.server
        ';
    }

    location /alive {
        mruby_content_handler_code 'Nginx.rputs "alive"';
    }
}
