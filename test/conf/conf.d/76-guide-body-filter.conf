# The sample of the guide "Change a response body"
# (docs/guides/body-filter.md): test/t/cases/guides.rb sends
# test/html/guide_body_filter.request and compares the response with
# test/html/guide_body_filter.response. Port 18167.
server {
    listen 18167;

    # A text file from disk, sent as an HTML page.
    location = /notes {
        alias html/guide_notes.txt;
        mruby_output_header_filter_code 'Nginx::Request.new.content_type = "text/html"';
        mruby_output_body_filter build/nginx/html/guide_body_filter.rb;
    }
}
