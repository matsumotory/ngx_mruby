# Nginx.redirect with a local URI takes effect when the handler ends (Q2 of
# docs/proposals/core-stabilization.md): one handler answers the request,
# the target's handlers can wait, and the output and the status that the
# calling handler sets after the call are not sent.
# Cases: test/t/cases/redirect_async.rb. Port 18186. The access log of this
# server is logs/redirect_async_access.log, which the cases read.
server {
    listen 18186;
    access_log logs/redirect_async_access.log;

    # A rewrite handler redirects and then writes output; the rewrite
    # handler of the target sleeps and then answers.
    location = /redirect_then_output {
        mruby_rewrite_handler_code '
          Nginx.redirect "/target_rewrite_sleep"
          Nginx.rputs "from the calling handler"
        ';
    }

    location = /target_rewrite_sleep {
        mruby_rewrite_handler_code '
          Nginx::Async.sleep 1
          Nginx.rputs "from the target after its sleep"
        ';
    }

    # A rewrite handler redirects to a content handler that sleeps.
    location = /redirect_to_sleeping_content {
        mruby_rewrite_handler_code 'Nginx.redirect "/target_content_sleep"';
    }

    location = /target_content_sleep {
        mruby_content_handler_code '
          Nginx::Async.sleep 1
          Nginx.rputs "slept"
        ';
    }

    # A content handler sleeps and then redirects.
    location = /sleep_then_redirect {
        mruby_content_handler_code '
          Nginx::Async.sleep 1
          Nginx.redirect "/target_plain"
        ';
    }

    # A rewrite handler redirects and then sets a status.
    location = /redirect_then_status {
        mruby_rewrite_handler_code '
          Nginx.redirect "/target_plain"
          Nginx.return Nginx::HTTP_SERVICE_UNAVAILABLE
        ';
    }

    location = /target_plain {
        mruby_content_handler_code 'Nginx.rputs "plain"';
    }
}
