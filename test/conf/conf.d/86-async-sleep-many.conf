# Repeated waits in one HTTP content handler.
# Case: test/t/cases/async_sleep_many.rb. Port 18188.
# Section 6 of docs/proposals/archive/core-stabilization.md.
server {
    listen 18188;
    # Keep the repeated-wait trace out of other cases' shared error.log.
    error_log logs/async_sleep_many.error.log debug;

    location /sleep_many {
        mruby_content_handler_code '
          completed = 0
          1000.times do
            Nginx::Async.sleep 1
            completed += 1
          end
          Nginx.rputs "slept:#{completed}"
        ';
    }

    location /stats {
        mruby_content_handler_code '
          stats = Nginx::Debug.stats
          Nginx.rputs "timers=#{stats[:timers]};gc_root_fibers=#{stats[:gc_root_fibers]}"
        ';
    }
}
