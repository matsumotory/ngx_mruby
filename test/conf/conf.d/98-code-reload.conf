# A handler file without cache is read and compiled again on each request,
# and the new proc replaces the previous one in the slot of the code in the
# GC root holder (section 2.6 of docs/proposals/core-alpha1.md). A request
# that waits keeps running the proc it started with while another request
# replaces it.
# Cases: test/t/cases/code_reload.rb. Port 18125.
# Hook script: test/html/code_reload_sleep.rb.
server {
    listen 18125;

    location /code_reload/sleep {
        mruby_content_handler build/nginx/html/code_reload_sleep.rb;
    }

    location /code_reload/stats {
        mruby_content_handler_code '
          Nginx::Debug.gc
          Nginx.rputs "gc_root=#{Nginx::Debug.stats[:gc_root]}"
        ';
    }
}
