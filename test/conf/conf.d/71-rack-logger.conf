# The methods of the logger in env["rack.logger"] (Kernel::Rack::Logger of
# mrbgems/rack-based-api). Port 18157. The cases are in
# test/t/cases/rack_logger.rb.
#
# Each method writes its message with Nginx.log at the level that its name
# maps to. The computed value tells the lines of the request apart from the
# dump of this code that nginx writes to error.log at the debug level when it
# starts.

server {
    listen 18157;

    location /rack_logger/levels {
        mruby_content_handler_code '
            app = Proc.new do |env|
              logger = env["rack.logger"]
              %w[fatal error warn info debug emerg alert crit notice].each do |name|
                logger.send(name, "rack logger case #{name} #{6 * 7}")
              end
              # Without a message, the method takes it from the block.
              logger.info { "rack logger case block #{6 * 7}" }
              [200, {"Content-Type" => "text/plain"}, ["logged"]]
            end
            run app
        ';
    }
}
