# The example of the home page of the site (docs/proposals/site.md, 3.3
# item 8): the site shows this server block, test/html/home_example.rb, the
# request in test/html/home_example.request and the response in
# test/html/home_example.response, which test/t/cases/home_example.rb
# compares on every run. Port 18160.
server {
    listen 18160;

    location /hello {
        mruby_content_handler build/nginx/html/home_example.rb;
    }
}
