# An mruby body filter that runs while an earlier handler's Nginx.rputs
# output is still in the module context of the request, when nginx needs
# more than one write to send the response.
# Cases: test/t/cases/body_filter_leftover_chain.rb. Port 18145.
#
# The rewrite handler writes one byte with Nginx.rputs and then declines, so
# the request goes on to the content phase and its output stays in the
# module context. The response comes from elsewhere (a static file or an
# upstream), and the mruby header filter, or the mruby body filter alone,
# holds its header back until the body filter has run. The body filter turns the body to upper case and
# keeps its length. When it has run, ngx_mruby drops the module context, so
# that a later handler does not send the leftover output after the response.
# nginx sends only a part of the response in the first write
# (sendfile_max_chunk bounds each write, limit_rate delays the rest with a
# timer), and calls the body filter again with no new data for the rest.
# The filter must pass these calls on, or the rest of the response is not
# sent until send_timeout ends the connection. send_timeout is short, so
# that a response that stops early ends within seconds.
server {
    listen 18145;
    send_timeout 3s;

    # A static file of 4000 bytes, in writes of at most 1024 bytes.
    location = /static_max_chunk {
        alias html/body_filter_leftover_chain.txt;
        sendfile off;
        sendfile_max_chunk 1k;
        mruby_rewrite_handler_code 'Nginx.rputs "x"; Nginx.return Nginx::DECLINED';
        mruby_output_header_filter_code '
          r = Nginx::Request.new
          runs = r.headers_out["X-Header-Filter-Runs"]
          r.headers_out["X-Header-Filter-Runs"] = (runs.nil? ? 1 : runs.to_i + 1).to_s
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    # The same file at 1000 bytes per second: it is longer than two seconds
    # of the rate, so the first write cannot send all of it even when the
    # clock passes a second boundary.
    location = /static_limit_rate {
        alias html/body_filter_leftover_chain.txt;
        limit_rate 1000;
        mruby_rewrite_handler_code 'Nginx.rputs "x"; Nginx.return Nginx::DECLINED';
        mruby_output_header_filter_code '
          r = Nginx::Request.new
          runs = r.headers_out["X-Header-Filter-Runs"]
          r.headers_out["X-Header-Filter-Runs"] = (runs.nil? ? 1 : runs.to_i + 1).to_s
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    # The file without mruby handlers, as the upstream of the locations below.
    # A proxied response does not stop at its first write even before the
    # fix: when the upstream response ends, nginx sends a last empty buffer
    # (ngx_http_upstream_finalize_request calls ngx_http_send_special), the
    # body filter runs once more on it and passes the later calls on. These
    # locations check that the response still arrives whole, with the
    # header filter run once.
    location = /origin {
        alias html/body_filter_leftover_chain.txt;
    }

    location = /proxy_max_chunk {
        proxy_pass http://127.0.0.1:18145/origin;
        sendfile_max_chunk 1k;
        mruby_rewrite_handler_code 'Nginx.rputs "x"; Nginx.return Nginx::DECLINED';
        mruby_output_header_filter_code '
          r = Nginx::Request.new
          runs = r.headers_out["X-Header-Filter-Runs"]
          r.headers_out["X-Header-Filter-Runs"] = (runs.nil? ? 1 : runs.to_i + 1).to_s
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    location = /proxy_unbuffered_max_chunk {
        proxy_pass http://127.0.0.1:18145/origin;
        proxy_buffering off;
        sendfile_max_chunk 1k;
        mruby_rewrite_handler_code 'Nginx.rputs "x"; Nginx.return Nginx::DECLINED';
        mruby_output_header_filter_code '
          r = Nginx::Request.new
          runs = r.headers_out["X-Header-Filter-Runs"]
          r.headers_out["X-Header-Filter-Runs"] = (runs.nil? ? 1 : runs.to_i + 1).to_s
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    # The same file in locations with the body filter and no header filter.
    # There ngx_mrb_finalize_rputs, which the body filter calls for the
    # leftover output, drops the module context.
    location = /static_body_filter_only_max_chunk {
        alias html/body_filter_leftover_chain.txt;
        sendfile off;
        sendfile_max_chunk 1k;
        mruby_rewrite_handler_code 'Nginx.rputs "x"; Nginx.return Nginx::DECLINED';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    location = /static_body_filter_only_limit_rate {
        alias html/body_filter_leftover_chain.txt;
        limit_rate 1000;
        mruby_rewrite_handler_code 'Nginx.rputs "x"; Nginx.return Nginx::DECLINED';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }
}
