# Exceptions whose class redefines #inspect or #backtrace so that they raise.
# Cases: test/t/cases/exception_log_raising_methods.rb. Port 18198. The
# stream session of the same cases is in
# test/conf/conf.d/stream/51-exception-log-raising-methods.conf. The messages
# are computed (6 * 7), as in test/conf/conf.d/91-exception-log.conf.
server {
    listen 18198;
    server_name localhost;

    # #inspect raises: the line of the exception names its class.
    location /exception_log/inspect_raises {
        mruby_content_handler_code '
            class ExceptionLogInspectRaises < RuntimeError
              def inspect
                raise ArgumentError, "exception log: inspect raised #{6 * 7}"
              end
            end
            raise ExceptionLogInspectRaises, "exception log: inspect raises #{6 * 7}"
        ';
    }

    # #backtrace raises: in the debug build of test.sh, the backtrace is
    # logged as one that is not an Array, at the debug level, with no frame.
    location /exception_log/backtrace_raises {
        mruby_content_handler_code '
            class ExceptionLogBacktraceRaises < RuntimeError
              def backtrace
                raise ArgumentError, "exception log: backtrace raised #{6 * 7}"
              end
            end
            raise ExceptionLogBacktraceRaises, "exception log: backtrace raises #{6 * 7}"
        ';
    }

    # Nginx.redirect from an mruby_set handler makes the internal redirect
    # inside the Ruby call: the content handler of the target, which raises,
    # runs while the code of the mruby_set handler is still on the C stack
    # (mrb->jmp is set), and its exception is logged there.
    location /exception_log/set_redirect_inspect_raises {
        mruby_set_code $exception_log_redirected 'Nginx.redirect "/exception_log/inspect_raises"; "set"';
        mruby_content_handler_code 'Nginx.rputs "after the redirect"';
    }

    location /exception_log/set_redirect_backtrace_raises {
        mruby_set_code $exception_log_redirected 'Nginx.redirect "/exception_log/backtrace_raises"; "set"';
        mruby_content_handler_code 'Nginx.rputs "after the redirect"';
    }

    # The active connections of the worker, for the cases inside another
    # mruby call: a request that nginx does not finish keeps its connection.
    location /status {
        stub_status;
    }

    location /exception_log/hello {
        mruby_content_handler_code 'Nginx.rputs "hello"';
    }
}
