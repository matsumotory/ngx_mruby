# A handler ends in the same way with or without a wait. Cases:
# test/t/cases/async_resume_result.rb. Ports 18176 (rewrite, access and
# content handlers), 18177 (a server rewrite handler) and 18178 (a post_read
# handler).
#
# Every handler runs build/nginx/html/async_resume_result.rb, which reads
# from the URI whether it waits and how it ends. None of these servers has
# another mruby handler, so no status that an earlier handler stored decides
# the end of a later one. A handler that goes on lets the request reach the
# static file async_resume_result.txt through try_files.
server {
    listen 18176;
    root __NGXDOCROOT__;

    location /rewrite/ {
        mruby_rewrite_handler build/nginx/html/async_resume_result.rb cache;
        try_files /async_resume_result.txt =404;
    }

    location /access_all/ {
        satisfy all;
        mruby_access_handler build/nginx/html/async_resume_result.rb cache;
        try_files /async_resume_result.txt =404;
    }

    # Under satisfy any, deny all refuses the request unless the mruby
    # access handler allows it.
    location /access_any/ {
        satisfy any;
        deny all;
        mruby_access_handler build/nginx/html/async_resume_result.rb cache;
        try_files /async_resume_result.txt =404;
    }

    # Under satisfy any, a 403 of the mruby access handler lets nginx try
    # the next access handler, which allows the request.
    location /access_any_allow/ {
        satisfy any;
        allow all;
        mruby_access_handler build/nginx/html/async_resume_result.rb cache;
        try_files /async_resume_result.txt =404;
    }

    # auth_request, an access handler of nginx, runs after the mruby access
    # handler when that one goes on.
    location /access_auth/ {
        mruby_access_handler build/nginx/html/async_resume_result.rb cache;
        auth_request /auth_allow;
        try_files /async_resume_result.txt =404;
    }

    # The access handler sends the request to /redirect_target with
    # Nginx.redirect, whose content handler answers without output.
    location = /access_redirect {
        mruby_access_handler_code 'Nginx.redirect "/redirect_target"';
    }

    location = /redirect_target {
        mruby_content_handler_code 'Nginx::Request.new';
    }

    location = /auth_allow {
        return 204;
    }

    location /content/ {
        mruby_content_handler build/nginx/html/async_resume_result.rb cache;
    }

    location = /leaf {
        mruby_content_handler_code 'Nginx.rputs "leaf"';
    }

    location /plain/ {
        try_files /async_resume_result.txt =404;
    }
}

server {
    listen 18177;
    root __NGXDOCROOT__;
    mruby_server_rewrite_handler build/nginx/html/async_resume_result.rb cache;

    location / {
        try_files /async_resume_result.txt =404;
    }
}

server {
    listen 18178;
    root __NGXDOCROOT__;
    mruby_post_read_handler build/nginx/html/async_resume_result.rb cache;

    location / {
        try_files /async_resume_result.txt =404;
    }
}
