# File versions of the phase handler directives and mruby_cache.
# Cases: test/t/cases/directives.rb. Ports 58114 and 58115.
# Hook files: test/html/directives_*.rb, copied to build/nginx/html/.

server {
    listen 58114;

    # Both directives apply to every location of this server. The server
    # rewrite hook returns DECLINED, so the locations below still run.
    mruby_post_read_handler build/nginx/html/directives_post_read.rb;
    mruby_server_rewrite_handler build/nginx/html/directives_server_rewrite.rb;

    # post_read, server_rewrite, rewrite and access hooks all extend the
    # X-G3-Trace request header, and the content handler echoes it.
    location /g3/chain {
        mruby_rewrite_handler build/nginx/html/directives_rewrite.rb;
        mruby_access_handler build/nginx/html/directives_access.rb;
        mruby_content_handler_code 'Nginx.rputs Nginx::Request.new.headers_in["X-G3-Trace"].to_s';
    }

    # A file hook and an inline hook in the same access phase.
    location /g3/access_order {
        mruby_access_handler build/nginx/html/directives_access.rb;
        mruby_access_handler_code '
            r = Nginx::Request.new
            r.headers_in["X-G3-Trace"] = "#{r.headers_in["X-G3-Trace"]},access_inline"
        ';
        mruby_content_handler_code 'Nginx.rputs Nginx::Request.new.headers_in["X-G3-Trace"].to_s';
    }

    # A file hook and an inline hook in the same log phase. The inline hook
    # appends to the value that the file hook stores.
    location /g3/log {
        mruby_log_handler build/nginx/html/directives_log.rb;
        mruby_log_handler_code '
            u = Userdata.new
            u.g3_log = "#{u.g3_log}|inline"
        ';
        mruby_content_handler_code 'Nginx.rputs "log target"';
    }

    location /g3/log_read {
        mruby_content_handler_code 'Nginx.rputs Userdata.new.g3_log.to_s';
    }

    # The same hook file under three cache settings.
    location /g3/cache/on {
        mruby_cache on;
        mruby_rewrite_handler build/nginx/html/directives_cache.rb;
    }

    location /g3/cache/arg {
        mruby_rewrite_handler build/nginx/html/directives_cache.rb cache;
    }

    location /g3/cache/off {
        mruby_rewrite_handler build/nginx/html/directives_cache.rb;
    }

    # Order in which mruby_init and mruby_init_worker ran, recorded by
    # build/nginx/html/directives_init.rb and directives_init_worker.rb.
    location /g3/init {
        mruby_content_handler_code 'Nginx.rputs $g3_init_order.join(",")';
    }
}

server {
    listen 58115;

    # mruby_cache at server level, inherited by the location.
    mruby_cache on;

    location /g3/srv_cache {
        mruby_rewrite_handler build/nginx/html/directives_cache.rb;
    }

    # mruby_server_rewrite_handler is accepted inside a location, but the
    # server rewrite phase reads the server level configuration.
    location /g3/server_rewrite_in_location {
        mruby_server_rewrite_handler build/nginx/html/directives_server_rewrite.rb;
        mruby_content_handler_code 'Nginx.rputs "trace=" + Nginx::Request.new.headers_in["X-G3-Trace"].to_s';
    }
}
