# Nginx::Async::HTTP.sub_request returns the response, a content handler
# waits for a subrequest, and a handler that waits for a subrequest runs its
# code once. Cases: test/t/cases/async_subrequest_return.rb. Ports 18183
# (rewrite, access and content handlers) and 18184 (a post_read handler).
#
# build/nginx/html/async_subrequest_once.rb counts the runs of the code for
# each request ($request_id) and the subrequests that reach /once_leaf, and
# stops with 500 after three runs. The content handlers of /once_access/
# and of port 18184 report the counts and drop them.
server {
    listen 18183;
    # Naming $request_id in a directive makes it an indexed variable, whose
    # value stays the same for the request; without it, nginx makes a new
    # value each time Nginx::Var reads it.
    set $async_once_id $request_id;

    location = /leaf {
        mruby_content_handler_code 'Nginx.rputs "leaf"';
    }

    location = /return {
        mruby_rewrite_handler_code '
          res = Nginx::Async::HTTP.sub_request "/leaf"
          last = Nginx::Async::HTTP.last_response
          same = res.status == last.status && res.body == last.body && res.headers == last.headers
          Nginx.rputs "#{res.class}:#{res.status}:#{res.body}:#{same}"
        ';
    }

    location = /content_sub_request {
        mruby_content_handler_code '
          res = Nginx::Async::HTTP.sub_request "/leaf"
          Nginx.rputs "got:#{res.status}:#{res.body}"
        ';
    }

    location = /content_sleep_then_sub_request {
        mruby_content_handler_code '
          Nginx::Async.sleep 1
          res = Nginx::Async::HTTP.sub_request "/leaf"
          Nginx.rputs "got:#{res.status}:#{res.body}"
        ';
    }

    location = /content_sub_request_then_sleep {
        mruby_content_handler_code '
          res = Nginx::Async::HTTP.sub_request "/leaf"
          Nginx::Async.sleep 1
          Nginx.rputs "got:#{res.status}:#{res.body}"
        ';
    }

    location /once_access/ {
        mruby_access_handler build/nginx/html/async_subrequest_once.rb cache;
        mruby_content_handler build/nginx/html/async_subrequest_once_report.rb cache;
    }

    location = /once_leaf {
        mruby_content_handler build/nginx/html/async_subrequest_once_leaf.rb cache;
    }

    location = /plain {
        mruby_content_handler_code 'Nginx.rputs "plain"';
    }
}

server {
    listen 18184;
    set $async_once_id $request_id;
    mruby_post_read_handler build/nginx/html/async_subrequest_once.rb cache;

    location = /once_leaf {
        mruby_content_handler build/nginx/html/async_subrequest_once_leaf.rb cache;
    }

    location / {
        mruby_content_handler build/nginx/html/async_subrequest_once_report.rb cache;
    }
}
