# Nginx::Async::HTTP.sub_request after a handler of the same request has
# waited in Nginx::Async.sleep.
# Cases: test/t/cases/async_sub_request_after_sleep.rb. Port 18190.
#
# The timer of the sleep resumes the fiber outside nginx's request handler,
# so a subrequest that the request posts from there, in the resumed fiber or
# in a later phase handler, must still be started. Each location answers
# with the body of the subrequest in X-Leaf and with "content" from its
# content handler. /rewrite_declined_access_sub_request is the same as the
# location after it without the sleep.
server {
    listen 18190;

    # a rewrite handler that declines after its sleep, and an access handler
    # that calls sub_request and declines
    location /rewrite_sleep_declined_access_sub_request {
        mruby_rewrite_handler_code '
          Nginx::Async.sleep 100
          Nginx.return Nginx::DECLINED
        ';
        mruby_access_handler_code '
          Nginx::Async::HTTP.sub_request "/leaf"
          Nginx::Headers_out.new["X-Leaf"] = Nginx::Async::HTTP.last_response.body
          Nginx.return Nginx::DECLINED
        ';
        mruby_content_handler_code 'Nginx.rputs "content"';
    }

    location /rewrite_declined_access_sub_request {
        mruby_rewrite_handler_code 'Nginx.return Nginx::DECLINED';
        mruby_access_handler_code '
          Nginx::Async::HTTP.sub_request "/leaf"
          Nginx::Headers_out.new["X-Leaf"] = Nginx::Async::HTTP.last_response.body
          Nginx.return Nginx::DECLINED
        ';
        mruby_content_handler_code 'Nginx.rputs "content"';
    }

    # the sleep and sub_request in the same rewrite handler
    location /rewrite_sleep_then_sub_request {
        mruby_rewrite_handler_code '
          Nginx::Async.sleep 100
          Nginx::Async::HTTP.sub_request "/leaf"
          Nginx::Headers_out.new["X-Leaf"] = Nginx::Async::HTTP.last_response.body
          Nginx.return Nginx::DECLINED
        ';
        mruby_content_handler_code 'Nginx.rputs "content"';
    }

    location /leaf {
        return 200 "leaf";
    }
}
