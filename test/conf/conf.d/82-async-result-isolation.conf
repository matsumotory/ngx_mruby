# The result of a handler is the handler's own, not one that an earlier
# handler of the request stored. Cases: test/t/cases/async_result_isolation.rb.
# Port 18179.
#
# The server rewrite handler stores Nginx::DECLINED for every request. The
# later handlers run build/nginx/html/async_resume_result.rb, which reads
# from the URI whether it waits and how it ends (see that file). A handler
# that goes on lets the request reach the static file
# async_resume_result.txt through try_files.
server {
    listen 18179;
    root __NGXDOCROOT__;
    mruby_server_rewrite_handler_code 'Nginx.return Nginx::DECLINED';

    location /rewrite/ {
        mruby_rewrite_handler build/nginx/html/async_resume_result.rb cache;
        try_files /async_resume_result.txt =404;
    }

    location /access_all/ {
        satisfy all;
        mruby_access_handler build/nginx/html/async_resume_result.rb cache;
        try_files /async_resume_result.txt =404;
    }

    location /access_any/ {
        satisfy any;
        deny all;
        mruby_access_handler build/nginx/html/async_resume_result.rb cache;
        try_files /async_resume_result.txt =404;
    }

    location /content/ {
        mruby_content_handler build/nginx/html/async_resume_result.rb cache;
    }

    location = /leaf {
        mruby_content_handler_code 'Nginx.rputs "leaf"';
    }
}
