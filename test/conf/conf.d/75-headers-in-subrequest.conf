# A subrequest shares the request's header list with its main request
# (ngx_http_subrequest copies r->headers_in into the subrequest, so the parts
# after the embedded first part are shared). A script that deletes a header in
# one request and adds one in the other must change only that request's own
# list, and must not lose a header that the other request appended. Cases:
# test/t/cases/headers_in_subrequest.rb. Ports 18106 (the handlers) and 18109
# (the upstream, which answers with the headers it received through $http_*).
# The default header list holds 20 entries per part, so a request with 40
# headers has a second, shared part; the header that the script deletes is
# placed at position 21 (the first of that part) in the cases that exercise a
# change to a shared part before the fix.

server {
    listen 18106;
    access_log off;

    # (a) auth_request path: the subrequest (access phase) deletes a header,
    # then the main request's content handler adds one. No proxy; this checks
    # that the request still completes when the main request adds after the
    # subrequest's delete.
    location = /auth_main {
        auth_request /auth_check;
        mruby_content_handler_code '
          Nginx::Request.new.headers_in["X-Main-Add"] = "main"
          Nginx.rputs "main ok"
        ';
    }
    location = /auth_check {
        internal;
        mruby_content_handler_code '
          Nginx::Request.new.headers_in.delete "X-Strip"
          Nginx.rputs "auth ok"
        ';
    }

    # (a) async sub_request + proxy_pass: the subrequest deletes a header, the
    # main request adds one, then the request goes to the upstream, which
    # reports the headers it received. Order: delete (subrequest), then add.
    location = /p_del_add {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/sub_del"
          Nginx::Request.new.headers_in["X-Main-Add"] = "main"
          Nginx.return Nginx::DECLINED
        ';
        proxy_pass http://127.0.0.1:18109;
    }

    # (b) subrequest adds, then the main request adds.
    location = /p_subadd_mainadd {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/sub_add"
          Nginx::Request.new.headers_in["X-Main-Add"] = "main"
          Nginx.return Nginx::DECLINED
        ';
        proxy_pass http://127.0.0.1:18109;
    }

    # (c) the main request adds, then the subrequest adds.
    location = /p_mainadd_subadd {
        mruby_rewrite_handler_code '
          Nginx::Request.new.headers_in["X-Main-Add"] = "main"
          Nginx::Async::HTTP.sub_request "/sub_add"
          Nginx.return Nginx::DECLINED
        ';
        proxy_pass http://127.0.0.1:18109;
    }

    # (d) the main request deletes, then the subrequest adds.
    location = /p_maindel_subadd {
        mruby_rewrite_handler_code '
          Nginx::Request.new.headers_in.delete "X-Strip"
          Nginx::Async::HTTP.sub_request "/sub_add"
          Nginx.return Nginx::DECLINED
        ';
        proxy_pass http://127.0.0.1:18109;
    }

    # (e) the subrequest empties a whole shared part (deletes X-H21..X-H40, the
    # second part), then the main request adds and goes to the upstream. The
    # subrequest's deletes do not reach the main request (it changes only its own
    # copies of the parts), so the upstream gets X-H01..X-H40 and the added
    # header. Before the fix the emptied part stayed on the main request's chain
    # and was forwarded, so the main request lost those headers.
    location = /p_emptypart {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/sub_del_part"
          Nginx::Request.new.headers_in["X-Main-Add"] = "main"
          Nginx.return Nginx::DECLINED
        ';
        proxy_pass http://127.0.0.1:18109;
    }

    # (e2) the subrequest empties the whole shared second part (deletes
    # X-H21..X-H40), then the main request goes to the upstream without changing
    # its own headers, so it never gives itself its own copies of the parts.
    # Before the fix the emptied part stayed on the main request's chain and was
    # forwarded in place of its headers, so the main request forwarded only
    # X-H01..X-H20 and lost X-H21..X-H40 (h22= h40=). The lost headers are the
    # reliable signal this case asserts. With the fix the subrequest empties only
    # its own copy, so the main request forwards all of X-H01..X-H40.
    location = /p_emptyread {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/sub_del_part"
          Nginx.return Nginx::DECLINED
        ';
        proxy_pass http://127.0.0.1:18109;
    }

    # (g) a request of 20 headers or fewer (the embedded part only): the main
    # request adds, then an async subrequest adds. The embedded part is each
    # request's own struct, but its array is shared, and a struct-only un-share
    # keeps that array shared; both adds use ngx_list_push into the same slot.
    location = /p_doubleadd {
        mruby_rewrite_handler_code '
          Nginx::Request.new.headers_in["X-Main-Add"] = "main"
          Nginx::Async::HTTP.sub_request "/sub_add"
          Nginx.return Nginx::DECLINED
        ';
        proxy_pass http://127.0.0.1:18109;
    }

    # (f) the same as (a), but with a request of 20 headers or fewer, so the
    # list has only the embedded part (never shared through part->next).
    location = /p_small {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/sub_del"
          Nginx::Request.new.headers_in["X-Main-Add"] = "main"
          Nginx.return Nginx::DECLINED
        ';
        proxy_pass http://127.0.0.1:18109;
    }

    # Subrequest handlers (internal): they change the shared header list.
    location = /sub_del {
        internal;
        mruby_content_handler_code '
          Nginx::Request.new.headers_in.delete "X-Strip"
          Nginx.rputs "sub del"
        ';
    }
    location = /sub_add {
        internal;
        mruby_content_handler_code '
          Nginx::Request.new.headers_in["X-Sub-Add"] = "sub"
          Nginx.rputs "sub add"
        ';
    }
    location = /sub_del_part {
        internal;
        mruby_content_handler_code '
          h = Nginx::Request.new.headers_in
          (21..40).each { |i| h.delete("X-H%02d" % i) }
          Nginx.rputs "sub del part"
        ';
    }
}

server {
    listen 18109;
    access_log off;

    location / {
        return 200 "main=$http_x_main_add sub=$http_x_sub_add strip=$http_x_strip h01=$http_x_h01 h22=$http_x_h22 h40=$http_x_h40\n";
    }
}
