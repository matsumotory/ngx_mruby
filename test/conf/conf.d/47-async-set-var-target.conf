# The variable of mruby_set_code and a later async handler of the same
# request. Cases: test/t/cases/async_set_var_target.rb. Port 18123.
#
# When the fiber of an mruby_set handler resumes after Nginx::Async.sleep,
# its return value is assigned to the variable of that mruby_set directive.
# The access handler below is not an mruby_set handler: when its fiber
# resumes after the sleep, its last expression ("clobbered") must not be
# assigned to $async_set_var_value.
server {
    listen 18123;

    location /set_then_async_access {
        mruby_set_code $async_set_var_value '"original"';
        mruby_access_handler_code '
          Nginx::Async.sleep 100
          Nginx.return Nginx::DECLINED
          "clobbered"
        ';
        mruby_content_handler_code 'Nginx.rputs Nginx::Var.new.async_set_var_value';
    }
}
