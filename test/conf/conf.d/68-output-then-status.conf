# How a content handler answers when it writes output and then sets a status
# below 300 other than 200, 201 and 204 with Nginx.return, Nginx.send_header
# or Nginx.status_code=. Cases: test/t/cases/output_then_status.rb. Hook
# script: test/html/output_then_status.rb, which writes the output and sets
# the status that the path of the request names. Port 18154.
#
# The handler must get a response: its output with the status it set, as
# nginx's own "return 202 text" sends it, and with Nginx.return 0, which sets
# no status, its output with 200, as for output without a status.
#
# The other paths check what must not change: Nginx::HTTP_OK after output
# (200 with the output), Nginx::HTTP_CREATED and a status from 300 up after
# output (nginx's own response for that status, without the output), a
# status set before the first output (200 with the output), and a
# subrequest whose content handler writes output and sets 202 (the
# subrequest ends without a response body, and the parent reads status 0).
server {
    listen 18154;

    location / {
        mruby_content_handler build/nginx/html/output_then_status.rb;
    }

    location = /sub_request_to_accepted {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/accepted"
          res = Nginx::Async::HTTP.last_response
          Nginx.rputs "status:#{res.status} body:#{res.body}"
        ';
    }
}
