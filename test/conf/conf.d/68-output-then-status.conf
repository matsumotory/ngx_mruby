# How a content handler answers when it writes output and then sets a
# status with Nginx.return, Nginx.send_header or Nginx.status_code=. Cases:
# test/t/cases/output_then_status.rb. Hook script:
# test/html/output_then_status.rb, which writes the output and sets the
# status that the path of the request names. Port 18154.
#
# The handler sends its output with the status it set, for every status
# from 200 up (202, 203 and 206 as nginx's own "return 202 text" sends
# them, without its Content-Type, and 201 and 404 as well), and with
# Nginx.return 0, which sets no status, with 200, as for output without a
# status. A status below 200 after output answers 500. The same holds after
# Nginx::Async::HTTP.sub_request resumed the handler, and in a subrequest
# whose content handler writes output and sets 202: the parent reads the
# status and the output. A status set before the first output still gives
# 200 with the output. test/conf/conf.d/89-body-with-status.conf has the
# other handlers and error_page.
server {
    listen 18154;

    location / {
        mruby_content_handler build/nginx/html/output_then_status.rb;
    }

    # The same after Nginx::Async::HTTP.sub_request resumed the handler.
    location = /sub_request_then_accepted {
        mruby_content_handler_code '
          Nginx::Async::HTTP.sub_request "/ok"
          Nginx.rputs "after sub_request"
          Nginx.return Nginx::HTTP_ACCEPTED
        ';
    }

    location = /sub_request_to_accepted {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/accepted"
          res = Nginx::Async::HTTP.last_response
          Nginx.rputs "status:#{res.status} body:#{res.body}"
        ';
    }
}
