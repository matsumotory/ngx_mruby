# The lines that ngx_mruby writes to error.log when the code of a request
# or of an SSL handshake raises. Cases: test/t/cases/exception_log.rb.
# Ports 18192 and 18193. The messages are computed (6 * 7), so that the
# line of the exception differs from the source of the code, which nginx
# writes to error.log at the debug level when it starts.

server {
    listen 18192;
    server_name localhost;

    location /exception_log/request {
        mruby_content_handler_code 'raise "exception log: http request #{6 * 7}"';
    }

    # An exception whose class redefines #backtrace with elements that are
    # not Strings. In the debug build of test.sh, ngx_mruby logs the Strings
    # of the backtrace and skips the other elements.
    location /exception_log/backtrace_types {
        mruby_content_handler_code '
            class ExceptionLogBacktraceTypes < RuntimeError
              def backtrace
                ["exception log: first frame #{6 * 7}", 1, nil, :frame, [], "exception log: last frame #{6 * 7}"]
              end
            end
            raise ExceptionLogBacktraceTypes, "exception log: backtrace types #{6 * 7}"
        ';
    }
}

server {
    listen 18193 ssl;
    server_name localhost;
    ssl_protocols       TLSv1.2;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_certificate     __NGXDOCROOT__/dummy.crt;
    ssl_certificate_key __NGXDOCROOT__/dummy.key;

    # The handshake fails, so no request reaches the location.
    mruby_ssl_handshake_handler_code 'raise "exception log: ssl handshake #{6 * 7}"';

    location / {
        mruby_content_handler_code 'Nginx.rputs "not reached"';
    }
}
