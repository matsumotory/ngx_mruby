# Nginx.module_version, Nginx.nginx_version, Nginx.server_version,
# Nginx::Request#content_type and content_type=, #method=, #scheme and
# #document_root, and Nginx::SSL.log. Port 18155 serves plain HTTP and port
# 18156 HTTPS. The cases are in test/t/cases/module_and_request.rb.

server {
    listen 18155;
    server_name localhost;
    root __NGXDOCROOT__;

    location /module/versions {
        mruby_content_handler_code '
            Nginx.rputs [Nginx.module_version, Nginx.nginx_version, Nginx.server_version].join("|")
        ';
    }

    # The getter before and after the setter. The header filter of nginx
    # writes the Content-Type header from r->headers_out.content_type, the
    # field that both methods use.
    location /request/content_type {
        mruby_content_handler_code '
            r = Nginx::Request.new
            before = r.content_type
            r.content_type = "text/x-ngx-mruby-test"
            Nginx.rputs [before, r.content_type].inspect
        ';
    }

    # method= in the rewrite phase. The content handler of the same location
    # reads the getter and $request_method, which nginx takes from the method
    # name of the request.
    location /request/method_set {
        mruby_rewrite_handler_code '
            Nginx::Request.new.method = "POST"
            Nginx.return Nginx::DECLINED
        ';
        mruby_content_handler_code '
            r = Nginx::Request.new
            Nginx.rputs [r.method, r.var.request_method].join("|")
        ';
    }

    location /request/scheme {
        mruby_content_handler_code '
            r = Nginx::Request.new
            Nginx.rputs [r.scheme, r.var.scheme].join("|")
        ';
    }

    # document_root follows the root of the location. nginx does not check
    # that the directory exists for $document_root.
    location /request/document_root {
        root __NGXDOCROOT__request_document_root;
        mruby_content_handler_code '
            r = Nginx::Request.new
            Nginx.rputs [r.document_root, Nginx::Server.new.document_root, r.var.document_root].join("|")
        ';
    }
}

server {
    listen 18156 ssl;
    server_name localhost;
    ssl_protocols       TLSv1.2;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_certificate     __NGXDOCROOT__/dummy.crt;
    ssl_certificate_key __NGXDOCROOT__/dummy.key;

    # Nginx::SSL.log is the other name of Nginx::SSL.errlogger. The computed
    # value tells the line of the handshake apart from the dump of this code
    # that nginx writes to error.log at the debug level when it starts.
    mruby_ssl_handshake_handler_code '
        ssl = Nginx::SSL.new
        Nginx::SSL.log Nginx::LOG_NOTICE, "Nginx::SSL.log in handshake: servername=#{ssl.servername} #{6 * 7}"
    ';

    location /request/scheme {
        mruby_content_handler_code '
            r = Nginx::Request.new
            Nginx.rputs [r.scheme, r.var.scheme].join("|")
        ';
    }
}
