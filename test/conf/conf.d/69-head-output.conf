# A HEAD request to a content handler that writes output with Nginx.rputs
# must get the headers only: the status and the Content-Length the body would
# have had, without the body. nginx sets r->header_only for a HEAD request,
# and its own content handlers send no body for it after the header. Cases:
# test/t/cases/head_output.rb. Port 18137.
server {
    listen 18137;

    location /head_output {
        mruby_content_handler_code 'Nginx.rputs "ok"';
    }
}
