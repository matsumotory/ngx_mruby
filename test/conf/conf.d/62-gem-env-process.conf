# Calls ENV, Process, Signal and the Kernel methods that iij/mruby-process
# used to replace, from a handler, after the default build moved ENV and
# Process to the core gems mruby-env and mruby-process of mruby 4.1 and left
# out mruby-vedis and mruby-localmemcache. The body has one line per check,
# and a check that raises prints the exception class, so that a change shows
# as a changed line instead of a 500.
# Process.pid == $$ holds only because the test nginx runs with
# master_process off: $$ is set once while nginx reads the configuration,
# so in a worker under a master it is the pid of the master.
# /gem_env_process/exit calls Kernel#exit: with iij/mruby-process, exit(3)
# ended the nginx process; with mruby-exit it raises SystemExit, and the
# handler answers 500.
# Port 18118. The cases are in test/t/cases/gem_env_process.rb.

server {
    listen 18118;

    location /gem_env_process {
        mruby_content_handler_code '
            def check
              yield.to_s
            rescue Exception => e
              e.class.to_s
            end

            lines = []
            lines << check { ENV["NGX_MRUBY_GEM_ENV_PROCESS"] = "v"; ENV["NGX_MRUBY_GEM_ENV_PROCESS"] }
            lines << check { ENV.to_h["NGX_MRUBY_GEM_ENV_PROCESS"] }
            lines << check { ENV.select { |k, _| k == "NGX_MRUBY_GEM_ENV_PROCESS" }.size }
            lines << check { ENV.delete("NGX_MRUBY_GEM_ENV_PROCESS") }
            lines << check { ENV.key?("NGX_MRUBY_GEM_ENV_PROCESS") }
            lines << check { ENV.to_hash }
            lines << check { ENV["A=B"] = "v" }
            lines << check { Process.pid == $$ && Process.pid > 0 }
            lines << check { Process.clock_gettime(Process::CLOCK_MONOTONIC).class }
            lines << check { Process.respond_to?(:fork) }
            lines << check { respond_to?(:fork, true) }
            lines << check { respond_to?(:system, true) }
            lines << check { Signal.list["TERM"] == 15 }
            lines << check { Kernel.instance_method(:sleep).owner == Kernel && Kernel.instance_method(:sleep).arity }
            lines << check { sleep }
            lines << check { usleep(1) >= 0 }
            lines << check { [Object.const_defined?(:Vedis), Object.const_defined?(:Cache)].join(",") }
            lines << check { Process.pid }

            Nginx.rputs lines.join("\n")
        ';
    }

    location /gem_env_process/exit {
        mruby_content_handler_code '
            exit 3
            Nginx.rputs "not reached"
        ';
    }
}
