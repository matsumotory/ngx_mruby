# Nginx.redirect to a location whose mruby handler or filter raises. Cases:
# test/t/cases/redirect_to_raising_handler.rb. Port 18134.
#
# Nginx.redirect "/path" runs the phases of /path inside the Ruby call, so the
# handler of the redirect target runs while the fiber of the handler that
# called Nginx.redirect still runs. An exception in the redirect target must
# end the request the way it does without the redirect, and nginx must close
# the connection of the request: stub_status must not count it afterwards.
server {
    listen 18134;

    location /redirect_to_raising_content {
        mruby_rewrite_handler_code 'Nginx.redirect "/raising_content"';
    }

    location /sleep_then_redirect_to_raising_content {
        mruby_rewrite_handler_code '
          Nginx::Async.sleep 10
          Nginx.redirect "/raising_content"
        ';
    }

    location /redirect_to_raising_rewrite {
        mruby_rewrite_handler_code 'Nginx.redirect "/raising_rewrite"';
    }

    location /redirect_to_raising_filter {
        mruby_rewrite_handler_code 'Nginx.redirect "/raising_filter"';
    }

    location /raising_content {
        mruby_content_handler_code 'raise "raised in the content handler of the redirect target"';
    }

    location /raising_rewrite {
        mruby_rewrite_handler_code 'raise "raised in the rewrite handler of the redirect target"';
        mruby_content_handler_code 'Nginx.rputs "not reached"';
    }

    location /raising_filter {
        mruby_content_handler_code 'Nginx.rputs "body"';
        mruby_output_header_filter_code 'raise "raised in the header filter of the redirect target"';
    }

    location /status {
        stub_status;
    }
}
