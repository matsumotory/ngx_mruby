# A location with mruby_add_handler on and mruby_cache on. mruby_add_handler
# builds a fresh mruby code from the request path on every request, so that
# code has to be compiled on every request; mruby_cache must not skip
# compiling it. Before the fix, a cached run left the per-request code
# uncompiled and nginx terminated the worker on a request to a script file
# under this location (test/t/cases/add_handler_cache.rb).
server {
    listen 18117;
    server_name localhost;
    root html;

    location / {
        mruby_add_handler on;
        mruby_cache on;
    }
}
