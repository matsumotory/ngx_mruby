# A `return` inside a block or a `for` body at the top level of handler code
# (issue #502). Cases: test/t/cases/return_in_block.rb. Port 18117.
# Hook file: test/html/return_in_block.rb, copied to build/nginx/html/.
#
# Such a `return` ends the handler code, as a `return` at the top level of the
# code does. It does so since the bundled mruby is 4.0.0 (#561): with mruby
# 3.3.0, the bundled mruby of 2.x, it raised LocalJumpError ("unexpected
# return") and the handler answered 500, because handler code runs in the
# first frame of its fiber, which mruby 3.3.0 refuses as the target of such a
# `return`. docs/proposals/archive/handler-code-frame.md, section 1.3, has the
# details.
#
# Each handler sets a response header after the `return`, so that the
# response also shows that the code after it did not run. /top is the
# `return` at the top level of the code, which answered 302 on 2.x as well.
# The locations share the prefix /return_in_block/, by which the case finds
# their lines in error.log.
server {
    listen 18117;

    # the first location of #502: a rewrite handler with the `return` in a block
    location /return_in_block/block {
        mruby_rewrite_handler_code '
          [0].each do |_|
            r = Nginx::Request.new
            r.headers_out["Location"] = "http://example.com/block"
            Nginx.return Nginx::HTTP_MOVED_TEMPORARILY
            return
          end
          Nginx::Request.new.headers_out["X-After-Return"] = "reached"
        ';
    }

    # the second location of #502: the `return` in the body of `for`
    location /return_in_block/for {
        mruby_rewrite_handler_code '
          for _ in [0]
            r = Nginx::Request.new
            r.headers_out["Location"] = "http://example.com/for"
            Nginx.return Nginx::HTTP_MOVED_TEMPORARILY
            return
          end
          Nginx::Request.new.headers_out["X-After-Return"] = "reached"
        ';
    }

    # the same as /return_in_block/block from a handler file, compiled again on
    # each request (no cache)
    location /return_in_block/file {
        mruby_rewrite_handler build/nginx/html/return_in_block.rb;
    }

    # the `return` at the top level of the code
    location /return_in_block/top {
        mruby_rewrite_handler_code '
          r = Nginx::Request.new
          r.headers_out["Location"] = "http://example.com/top"
          Nginx.return Nginx::HTTP_MOVED_TEMPORARILY
          return
          Nginx::Request.new.headers_out["X-After-Return"] = "reached"
        ';
    }

    # a content handler: the output before the `return` is the response body
    location /return_in_block/content {
        mruby_content_handler_code '
          Nginx.rputs "before the block"
          [0].each { return }
          Nginx.rputs ", after the block"
        ';
    }

    # mruby_set: the value of a `return` in a block becomes the variable
    location /return_in_block/set {
        mruby_set_code $return_in_block_value '
          [0].each { return "from the block" }
          "after the block"
        ';
        mruby_content_handler_code 'Nginx.rputs Nginx::Var.new.return_in_block_value';
    }
}
