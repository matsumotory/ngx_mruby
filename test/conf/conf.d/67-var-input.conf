# Nginx::Var with input that it has to reject or must not change: a method
# name that names no variable, a setter called without its value, and
# Nginx::Var#set with a name that the caller still holds. Cases:
# test/t/cases/var_input.rb. Hook script: test/html/var_input.rb, which runs
# the call that the path of the request names. Port 18153.
server {
    listen 18153;

    # Each request starts with this value. The hook script prints the value
    # after its call, so that a case sees whether the call changed it.
    set $var_input_target "initial";

    # A name longer than the 27 bytes that mruby keeps inside a String
    # object on a 64-bit build: Symbol#to_s of such a Symbol shares the bytes
    # of the name that the mrb_state of the worker keeps for the Symbol.
    set $var_input_target_set_by_a_symbol "initial";

    location / {
        mruby_content_handler build/nginx/html/var_input.rb;
    }

    # nginx cannot resolve a root that does not exist, so
    # ngx_http_get_variable returns NULL for $realpath_root here, and
    # Nginx::Var logs the name of the variable in its error line.
    location = /realpath_root {
        root html/var_input_no_such_directory;
        mruby_content_handler build/nginx/html/var_input.rb;
    }
}
