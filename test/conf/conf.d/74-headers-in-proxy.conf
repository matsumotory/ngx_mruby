# Headers that Nginx::Headers_in#[]= adds to a request that proxy_pass then
# sends on. Cases: test/t/cases/headers_in_proxy.rb. Ports 18099 (the
# handlers) and 18100 (the upstream, which answers with the headers it
# received).
#
# nginx's proxy module looks every header of the request up, by the
# header's hash and lowcase_key, in the table of the headers that it sets
# itself (proxy_set_header and its own ones). With a bucket size this large,
# the table has a single bucket, so each header whose name has the length
# of a name in the table is compared byte by byte: X-Added-Header and
# X-Set-By-Proxy have the length of Content-Length.
server {
    listen 18099;
    access_log off;

    proxy_headers_hash_bucket_size 1024;
    proxy_set_header X-Set-By-Proxy proxy;

    location = /add {
        mruby_rewrite_handler_code '
          h = Nginx::Request.new.headers_in
          h["X-Added-Header"] = "script"
          h["X-Set-By-Proxy"] = "script"
        ';
        proxy_pass http://127.0.0.1:18100;
    }

    # The request has one header, X-Only. Deleting it empties the list of
    # the request's headers, and the headers added next take the places
    # that the request's own headers had.
    location = /delete_then_add {
        mruby_rewrite_handler_code '
          h = Nginx::Request.new.headers_in
          h.delete "X-Only"
          h["X-Added-Header"] = "script"
          h["X-Set-By-Proxy"] = "script"
        ';
        proxy_pass http://127.0.0.1:18100;
    }
}

server {
    listen 18100;
    access_log off;

    location / {
        return 200 "set_by_proxy=$http_x_set_by_proxy added=$http_x_added_header only=$http_x_only\n";
    }
}
