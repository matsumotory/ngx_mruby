# Request headers that Nginx::Headers_in#[]= adds or replaces before
# proxy_pass, and what the upstream receives. Cases:
# test/t/cases/headers_in_proxy.rb. Ports 18099 (the handlers) and 18100
# (the upstream, which answers with the headers it received). The rewrite
# handlers return Nginx::DECLINED, so that the request goes on to
# proxy_pass. On the 2.x line every header that a script adds reaches the
# upstream: also X-Set-By-Proxy, which proxy_set_header sets as well, and
# Keep-Alive and Host, which the proxy module sets itself.
server {
    listen 18099;
    access_log off;

    proxy_headers_hash_bucket_size 1024;
    proxy_set_header X-Set-By-Proxy proxy;

    location = /add {
        mruby_rewrite_handler_code '
          h = Nginx::Request.new.headers_in
          h["X-Added-Header"] = "script"
          h["X-Set-By-Proxy"] = "script"
          h["Keep-Alive"] = "script"
          h["X-A"] = "script"
          Nginx.return Nginx::DECLINED
        ';
        proxy_pass http://127.0.0.1:18100;
    }

    # The same after the script deleted the only header of the request.
    location = /delete_then_add {
        mruby_rewrite_handler_code '
          h = Nginx::Request.new.headers_in
          h.delete "X-Only"
          h["X-Added-Header"] = "script"
          h["X-Set-By-Proxy"] = "script"
          h["Keep-Alive"] = "script"
          h["X-A"] = "script"
          Nginx.return Nginx::DECLINED
        ';
        proxy_pass http://127.0.0.1:18100;
    }

    # X-Set-By-Proxy, which the client sent, replaced by the script. The
    # cases send it before another header, as the last header, and as the
    # only header of the request.
    location = /replace {
        mruby_rewrite_handler_code '
          Nginx::Request.new.headers_in["X-Set-By-Proxy"] = "script"
          Nginx.return Nginx::DECLINED
        ';
        proxy_pass http://127.0.0.1:18100;
    }

    # Host replaced by the script: the proxy module sends its own Host as
    # well, and the upstream answers 400 to the two Host lines.
    location = /replace_host {
        mruby_rewrite_handler_code '
          Nginx::Request.new.headers_in["Host"] = "script-host"
          Nginx.return Nginx::DECLINED
        ';
        proxy_pass http://127.0.0.1:18100/host;
    }

    # The way to send the value of the script alone: a variable, given to
    # proxy_set_header, without Headers_in#[]=. A location with
    # proxy_set_header of its own does not inherit those of the server.
    location = /variable {
        mruby_set_code $headers_in_proxy_value '"script"';
        mruby_set_code $headers_in_proxy_host '"script-host"';
        proxy_set_header X-Set-By-Proxy $headers_in_proxy_value;
        proxy_set_header Host $headers_in_proxy_host;
        proxy_pass http://127.0.0.1:18100/host;
    }
}

server {
    listen 18100;
    access_log off;

    location / {
        return 200 "set_by_proxy=$http_x_set_by_proxy added=$http_x_added_header keep_alive=$http_keep_alive x_a=$http_x_a only=$http_x_only\n";
    }
    location = /host {
        return 200 "host=$http_host set_by_proxy=$http_x_set_by_proxy\n";
    }
}
