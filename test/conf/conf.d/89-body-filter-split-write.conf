# An mruby body filter on a response that a handler wrote with Nginx.rputs,
# when nginx needs more than one write to send it.
# Cases: test/t/cases/body_filter_split_write.rb. Port 18141.
#
# The handler's output goes through the body filter, which turns it to upper
# case and keeps its length. nginx's write filter sends only a part of the
# response in the first write in two ways here: limit_rate, which delays the
# rest with a timer, and sendfile_max_chunk, which bounds each write and
# posts the next one at once. Each time, ngx_http_writer calls the body
# filter again with no new data, and the filter must pass that call on, or
# the rest of the response is not sent until send_timeout ends the
# connection. send_timeout is short, so that a response that stops early
# ends within seconds.
server {
    listen 18141;
    send_timeout 3s;

    # A content handler, with 2500 bytes at 1000 bytes per second: the
    # response is longer than two seconds of the rate, so the first write
    # cannot send all of it even when the clock passes a second boundary.
    location = /content_limit_rate {
        limit_rate 1000;
        mruby_content_handler_code 'Nginx.rputs "a" * 2500';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    # The same with writes of at most 1024 bytes.
    location = /content_max_chunk {
        sendfile_max_chunk 1k;
        mruby_content_handler_code 'Nginx.rputs "a" * 4000';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    # A header filter as well: it counts its runs in a response header.
    location = /content_both_filters_max_chunk {
        sendfile_max_chunk 1k;
        mruby_content_handler_code 'Nginx.rputs "a" * 4000';
        mruby_output_header_filter_code '
          r = Nginx::Request.new
          runs = r.headers_out["X-Header-Filter-Runs"]
          r.headers_out["X-Header-Filter-Runs"] = (runs.nil? ? 1 : runs.to_i + 1).to_s
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    # A rewrite handler that writes the response with Nginx.rputs sends it
    # the same way as a content handler.
    location = /rewrite_max_chunk {
        sendfile_max_chunk 1k;
        mruby_rewrite_handler_code 'Nginx.rputs "a" * 4000';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }
}
