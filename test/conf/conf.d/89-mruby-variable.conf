# mruby_variable declares variables that scripts assign with Nginx::Var.
# Cases: test/t/cases/mruby_variable.rb. Port 18171. The access log of this
# server is logs/mruby_variable.log, which the cases read.
#
# $mruby_variable_key has no value of its own: it reads as the empty string
# until a script assigns it. $mruby_variable_default reads as its value,
# which names a variable, until a script assigns it. The server rewrite
# handler assigns $mruby_variable_key for the URIs that begin with
# /assigned, and no "set" runs after it to overwrite the value, as a
# server-level "set" would.
mruby_variable $mruby_variable_key;
mruby_variable $mruby_variable_default "default-$request_method";

log_format mruby_variable '$request_uri [$mruby_variable_key] [$mruby_variable_default]';

server {
    listen 18171;
    access_log logs/mruby_variable.log mruby_variable;

    mruby_server_rewrite_handler_code '
      if Nginx::Request.new.uri.start_with?("/assigned")
        Nginx::Var.new.mruby_variable_key = "from-ruby"
      end
    ';

    # add_header reads the variables after the content handler.
    add_header X-Mruby-Variable-Key "[$mruby_variable_key]" always;
    add_header X-Mruby-Variable-Default "[$mruby_variable_default]" always;

    location = /assigned {
        mruby_content_handler_code '
          v = Nginx::Var.new
          Nginx.rputs "[#{v.mruby_variable_key}] [#{v.mruby_variable_default}]"
        ';
    }

    # nginx's return reads the value that the server rewrite handler assigned.
    location = /assigned_return {
        return 200 "[$mruby_variable_key] [$mruby_variable_default]";
    }

    # No script assigns the variables: both read as their declared values.
    location = /default {
        mruby_content_handler_code '
          v = Nginx::Var.new
          Nginx.rputs "[#{v.mruby_variable_key}] [#{v.mruby_variable_default}]"
        ';
    }

    # "set" assigns the same variables, and a content handler assigns them
    # again; each assignment replaces the value before it.
    location = /assigned_set {
        set $mruby_variable_key "from-set";
        mruby_content_handler_code '
          v = Nginx::Var.new
          before = v.mruby_variable_key
          v.mruby_variable_default = "from-content"
          Nginx.rputs "[#{before}] [#{v.mruby_variable_default}]"
        ';
    }
}
