# The status code of Nginx.redirect (its second argument) when it is not an
# Integer. Cases: test/t/cases/argument_types.rb, which also checks the
# :address of add_listener with nginx -t. Port 18200.
#
# The query of a request names the case: to (url, a redirect with a 3xx
# status, or internal, an internal redirect) and code (absent for no second
# argument; 301, string, float or nil for the second argument; three for
# 301 and a third argument) and, with
# rescue=no, a call whose exception the script does not rescue.
server {
    listen 18200;

    # Nginx.redirect in a rewrite handler. When the call raises, the script
    # puts the exception in the response header X-Raised and declines, and
    # the content handler answers "no redirect".
    location = /redirect {
        mruby_rewrite_handler_code '
          r = Nginx::Request.new
          url = r.var.arg_to == "internal" ? "/argument_types_internal" : "http://example.com/redirected"
          args = [url]
          case r.var.arg_code
          when nil
          when "301" then args << 301
          when "string" then args << "301"
          when "float" then args << 301.0
          when "nil" then args << nil
          when "three" then args << 301 << "third"
          else raise "no code for #{r.var.arg_code}"
          end
          begin
            Nginx.redirect(*args)
          rescue => e
            raise e if r.var.arg_rescue == "no"
            r.headers_out["X-Raised"] = "raised: #{e.class}: #{e.message}"
            Nginx.return Nginx::DECLINED
          end
        ';
        mruby_content_handler_code 'Nginx.rputs "no redirect"';
    }

    # The target of the internal redirect.
    location = /argument_types_internal {
        mruby_content_handler_code 'Nginx.rputs "internal"';
    }
}
