# Assignments to nginx variables through Nginx::Var#<name>= (the accessor
# that method_missing serves), Nginx::Var#set and the end of an mruby_set
# handler. Cases: test/t/cases/var_assign.rb. Hook script:
# test/html/var_assign.rb. Port 18107.
#
# $var_assign_declared is declared with mruby_variable. $var_assign_mapped
# is a variable of map that nothing in the configuration refers to, so
# nginx keeps no value of it in the request. $uri is a variable that nginx
# does not let scripts change, and $args one that has a set_handler.
mruby_variable $var_assign_declared;

map $request_method $var_assign_mapped {
    default "mapped";
}

server {
    listen 18107;
    access_log off;

    # Each request starts with this value.
    set $var_assign_plain "initial";

    # /<call>/<name>[/rescue]: the hook script assigns the variable <name>
    # with <call>, and rescues the exception when the path ends in /rescue.
    location / {
        mruby_content_handler build/nginx/html/var_assign.rb;
    }

    # The end of an mruby_set handler assigns the value of the code: without
    # a wait through ngx_devel_kit, and after Nginx::Async.sleep through the
    # assignment of Nginx::Var. The value is an Integer, as in the hook
    # script.
    location = /mruby_set/plain {
        mruby_set_code $var_assign_plain '42';
        mruby_content_handler_code 'Nginx.rputs "read=#{Nginx::Var.new.var_assign_plain.inspect}"';
    }

    location = /mruby_set_sleep/plain {
        mruby_set_code $var_assign_plain 'Nginx::Async.sleep 10; 42';
        mruby_content_handler_code 'Nginx.rputs "read=#{Nginx::Var.new.var_assign_plain.inspect}"';
    }

    # A log handler that assigns a variable that nginx does not know: the
    # response is sent already, and error.log gets the exception.
    location = /log/no_such {
        mruby_content_handler_code 'Nginx.rputs "sent"';
        mruby_log_handler_code 'Nginx::Var.new.var_assign_no_such_in_log = "x"';
    }
}
