# What a stream session does after Nginx::Stream::Async.sleep, by the result
# of its code. Cases: test/t/cases/stream_async_sleep_result.rb. Ports
# 12374-12377.
#
# nginx's checker of the access phase finalizes the session with the result
# of a handler that does not wait (an exception gives NGX_ABORT); after the
# sleep, the same result must end the session the same way. The session after
# one whose code raised must run its own code.
server {
    listen 127.0.0.1:12374;
    mruby_stream_code '
      Nginx::Stream::Async.sleep 100
      raise "raised after the sleep in a stream handler"
    ';
    return "not reached";
}

server {
    listen 127.0.0.1:12375;
    mruby_stream_code '
      Nginx::Stream::Async.sleep 100
      Nginx::Stream::Connection.stream_status = Nginx::Stream::ABORT
    ';
    return "not reached";
}

server {
    listen 127.0.0.1:12376;
    mruby_stream_code '
      Nginx::Stream::Async.sleep 100
      Nginx::Stream::Connection.stream_status = Nginx::Stream::OK
    ';
    return "after the sleep";
}

server {
    listen 127.0.0.1:12377;
    mruby_stream_code '
      Nginx::Stream.log Nginx::Stream::LOG_INFO, "the session after the raise ran its code"
    ';
    return "next";
}
