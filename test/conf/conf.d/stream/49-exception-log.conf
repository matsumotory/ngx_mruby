# The lines that ngx_mruby writes to error.log when the code of a stream
# session raises. Cases: test/t/cases/exception_log.rb. Port 12380. The
# code raises in a method that another method calls, so that the backtrace
# of the exception has more than one frame in the file.
server {
    listen 127.0.0.1:12380;
    mruby_stream __NGXDOCROOT__/exception_log_stream.rb;
}
