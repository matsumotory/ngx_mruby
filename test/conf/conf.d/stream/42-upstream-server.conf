# Nginx::Stream::Connection#upstream_server= must keep the round-robin peer
# valid for later connections. The peer lives for the worker's life and is
# shared by every connection that uses the upstream, so its name and address
# must not point into the Ruby string (which the mruby GC may free or move) or
# the connection pool of the connection that set them. A connection to 12365
# sets the server to a different address than the one in the upstream block,
# and a later connection to 12366 reads it back and logs it. Cases:
# test/t/cases/stream_upstream_server.rb. Ports 12365 and 12366 (the addresses
# 127.0.0.1:12367 and 127.0.0.1:12368 are only parsed, never connected).
# test.sh includes this file inside stream {} in test/conf/nginx.stream.conf.
upstream mrb_dyn_stream_uaf {
    server 127.0.0.1:12367;
}

server {
    listen 127.0.0.1:12365;
    mruby_stream_code '
      c = Nginx::Stream::Connection.new "mrb_dyn_stream_uaf"
      port = "12368"
      c.upstream_server = "127.0.0.1:" + port
      Nginx::Stream.errlogger Nginx::Stream::LOG_NOTICE, "stream upstream server test: set end"
    ';
    return "set";
}

server {
    listen 127.0.0.1:12366;
    mruby_stream_code '
      c = Nginx::Stream::Connection.new "mrb_dyn_stream_uaf"
      Nginx::Stream.errlogger Nginx::Stream::LOG_NOTICE, "stream upstream server test: GOTSERVER=#{c.upstream_server} end"
    ';
    return "get";
}
