# Nginx::Stream::Connection objects that hold no upstream: one from
# allocate, one whose initialize raised, one whose second initialize raised,
# and copies made with dup and clone. #upstream_server and #upstream_server=
# raise ArgumentError on them, the original of a copy keeps its upstream,
# and the worker answers the next session. Cases:
# test/t/cases/upstream_uninitialized.rb. Port 12397. The upstream addresses
# are documentation addresses (192.0.2.0/24) that nginx only parses and never
# connects to. Each check logs its result at once, so the results before a
# check that fails stay in error.log.
upstream mrb_stream_uninit_a {
    server 192.0.2.41:80;
}

upstream mrb_stream_uninit_multi {
    server 192.0.2.42:80;
    server 192.0.2.43:80;
}

server {
    listen 127.0.0.1:12397;
    mruby_stream_code '
      log = lambda { |s| Nginx::Stream.errlogger Nginx::Stream::LOG_NOTICE, "stream upstream uninitialized: #{s} end" }
      failed_init = lambda do |c, name|
        begin
          c.send :initialize, name
        rescue RuntimeError
        end
        c
      end

      objects = {
        "allocate" => lambda { Nginx::Stream::Connection.allocate },
        "not_found" => lambda { failed_init.call Nginx::Stream::Connection.allocate, "mrb_stream_uninit_none" },
        "multiple" => lambda { failed_init.call Nginx::Stream::Connection.allocate, "mrb_stream_uninit_multi" },
        "reinit" => lambda { failed_init.call Nginx::Stream::Connection.new("mrb_stream_uninit_a"), "mrb_stream_uninit_none" },
      }
      calls = {
        "upstream_server" => lambda { |c| c.upstream_server },
        "upstream_server_set" => lambda { |c| c.upstream_server = "192.0.2.44:80" },
      }

      # Copies made with dup and clone of an object that new returned, before
      # the other objects. mruby copies the instance variables of the object
      # and not its data, so the copy holds no upstream. After the methods of
      # its copies, the original logs its server.
      original = Nginx::Stream::Connection.new "mrb_stream_uninit_a"
      copies = {
        "dup" => lambda { original.dup },
        "clone" => lambda { original.clone },
      }
      copies.each do |copy, make|
        calls.each do |method, call|
          begin
            call.call make.call
            log.call "#{copy}-#{method}=no error"
          rescue => e
            log.call "#{copy}-#{method}=#{e.class}, #{e.message}"
          end
        end
        log.call "#{copy}-original=#{original.upstream_server}"
      end

      objects.each do |object, make|
        calls.each do |method, call|
          begin
            call.call make.call
            log.call "#{object}-#{method}=no error"
          rescue => e
            log.call "#{object}-#{method}=#{e.class}, #{e.message}"
          end
        end
      end

      c = failed_init.call Nginx::Stream::Connection.allocate, "mrb_stream_uninit_none"
      c.send :initialize, "mrb_stream_uninit_a"
      log.call "recover=#{c.upstream_server}"
    ';
    return "checked";
}
