# Stream sessions that raise an exception whose class redefines #inspect.
# Cases: test/t/cases/exception_log_script_methods.rb. Ports 12389 (#inspect
# raises) and 12383 (#inspect does not return a String).
server {
    listen 127.0.0.1:12389;
    mruby_stream_code '
        class ScriptMethodsStreamInspectRaises < RuntimeError
          def inspect
            raise ArgumentError, "script methods: stream inspect raised #{6 * 7}"
          end
        end
        raise ScriptMethodsStreamInspectRaises, "script methods: stream inspect raises #{6 * 7}"
    ';
}

server {
    listen 127.0.0.1:12383;
    mruby_stream_code '
        class ScriptMethodsStreamInspectNotString < RuntimeError
          def inspect
            6 * 7
          end
        end
        raise ScriptMethodsStreamInspectNotString, "script methods: stream inspect not string #{6 * 7}"
    ';
}
