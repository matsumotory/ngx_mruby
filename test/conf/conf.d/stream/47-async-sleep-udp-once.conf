# A UDP stream session runs its code once: datagrams that arrive while the
# code waits in Nginx::Stream::Async.sleep do not start it again (Q4 of
# docs/proposals/core-stabilization.md). The code logs a line when it
# starts and when it resumes; test/t/cases/_udp_once.rb sends ten datagrams
# from one source during the sleep and reads the reply.
# Case: test/t/cases/stream_async_sleep_udp_once.rb. Port 12392.
server {
    listen 127.0.0.1:12392 udp;
    mruby_stream_code '
      Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "udp once: the code started"
      Nginx::Stream::Async.sleep 800
      Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "udp once: the code resumed"
    ';
    return "udp-once-ok";
}
