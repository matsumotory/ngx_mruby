# Datagrams received while a UDP session waits do not start its code again.
# Case: test/t/cases/stream_async_sleep_udp_once.rb. Port 12392.
server {
    listen 127.0.0.1:12392 udp;
    mruby_stream_code '
      Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "udp once: started"
      Nginx::Stream::Async.sleep 800
      Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "udp once: resumed"
    ';
    return "udp-once-ok";
}
