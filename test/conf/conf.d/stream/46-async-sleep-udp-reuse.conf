# A second UDP datagram of the same stream session re-runs the handler while a
# previous fiber is still suspended in Nginx::Stream::Async.sleep, so the
# session starts a second fiber. That second fiber must be kept from the GC
# while it sleeps. The test build runs the GC on every allocation
# (-DMRB_GC_STRESS), so a fiber that is not a GC root is collected during the
# sleep and its resume raises a FiberError; the session is then aborted and the
# UDP client gets no reply. The regression test sends two datagrams to 12390,
# allocates in the shared stream mrb_state through 12391 during the sleep, and
# reads the reply. Case: test/t/cases/stream_async_sleep_udp_reuse.rb. Ports
# 12390 (the udp sleep server) and 12391 (the server whose code allocates).
server {
    listen 127.0.0.1:12390 udp;
    mruby_stream_code '
      Nginx::Stream::Async.sleep 800
      Nginx::Stream.errlogger Nginx::Stream::LOG_NOTICE, "udp reuse: resumed after the sleep"
    ';
    return "udp-reuse-ok";
}

server {
    listen 127.0.0.1:12391;
    mruby_stream_code '
      s = ""
      500.times { |i| s = ("x" * 32) + i.to_s }
    ';
    return "alloc";
}
