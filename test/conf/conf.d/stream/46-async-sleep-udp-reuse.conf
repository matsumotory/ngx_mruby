# Send another datagram while the UDP session waits and allocate in the
# shared stream VM through the TCP server. The waiting code must resume.
# Case: test/t/cases/stream_async_sleep_udp_reuse.rb. Ports 12390 and 12391.
server {
    listen 127.0.0.1:12390 udp;
    mruby_stream_code '
      Nginx::Stream::Async.sleep 800
      Nginx::Stream.errlogger Nginx::Stream::LOG_NOTICE, "udp reuse: resumed after the sleep"
    ';
    return "udp-reuse-ok";
}

server {
    listen 127.0.0.1:12391;
    mruby_stream_code '
      s = ""
      500.times { |i| s = ("x" * 32) + i.to_s }
    ';
    return "alloc";
}
