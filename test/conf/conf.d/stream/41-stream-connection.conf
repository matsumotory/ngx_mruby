# The instance methods of Nginx::Stream::Connection that read the addresses
# and ports of the session, the class method local_addr, the getter
# upstream_server, Nginx::Stream.errlogger and Nginx::Stream.module_name.
# Port 12363. The cases are in test/t/cases/stream_connection.rb.
# test.sh includes this file inside stream {} in test/conf/nginx.stream.conf.

# Nginx::Stream::Connection.new picks the first upstream whose name starts
# with the given name, so this name does not share a prefix with the other
# upstreams of the stream configuration. No session is proxied to it: the
# server below answers with the return directive.
upstream stream_connection_cases {
    server 127.0.0.1:12358;
}

# The session code writes what each method returned to error.log with
# Nginx::Stream.errlogger, and the return directive answers with the values
# of nginx's own variables for the same session, so that the case compares
# the two.
server {
    listen 127.0.0.1:12363;
    mruby_stream_code '
      k = Nginx::Stream::Connection
      c = k.new "stream_connection_cases"
      values = [
        "remote_ip=#{c.remote_ip}", "remote_addr=#{c.remote_addr}", "remote_port=#{c.remote_port}",
        "local_ip=#{c.local_ip}", "local_addr=#{c.local_addr}",
        "local_port=#{c.local_port}", "local_ip_port=#{c.local_ip_port}",
        "class_remote_ip=#{k.remote_ip}", "class_remote_addr=#{k.remote_addr}", "class_remote_port=#{k.remote_port}",
        "class_local_ip=#{k.local_ip}", "class_local_addr=#{k.local_addr}",
        "class_local_port=#{k.local_port}", "class_local_ip_port=#{k.local_ip_port}",
        "upstream_server=#{c.upstream_server}",
        "module_name=#{Nginx::Stream.module_name}",
      ]
      Nginx::Stream.errlogger Nginx::Stream::LOG_NOTICE, "stream connection case: #{values.join(" ")} end"
    ';
    return "$remote_addr $remote_port $server_addr $server_port";
}
