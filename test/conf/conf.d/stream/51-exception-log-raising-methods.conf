# A stream session that raises an exception whose class redefines #inspect
# so that it raises. Cases: test/t/cases/exception_log_raising_methods.rb.
# Port 12382.
server {
    listen 127.0.0.1:12382;
    mruby_stream_code '
        class ExceptionLogStreamInspectRaises < RuntimeError
          def inspect
            raise ArgumentError, "exception log: stream inspect raised #{6 * 7}"
          end
        end
        raise ExceptionLogStreamInspectRaises, "exception log: stream inspect raises #{6 * 7}"
    ';
}
