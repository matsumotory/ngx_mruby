# What Nginx::Stream::Connection.new and #upstream_server= accept. Cases:
# test/t/cases/stream_upstream_server_checks.rb. Port 12378. The upstream
# addresses are documentation addresses (192.0.2.0/24) that nginx only
# parses and never connects to. Each check logs its result at once, so the
# results before a check that fails stay in error.log.
#
# mrb_stream_check_ab comes before mrb_stream_check_a, so a lookup that
# compared only the length of the argument would find it for
# "mrb_stream_check_a".
upstream mrb_stream_check_ab {
    server 192.0.2.11:80;
}

upstream mrb_stream_check_a {
    server 192.0.2.12:80;
}

upstream mrb_stream_check_zone {
    zone mrb_stream_check_zone 64k;
    server 192.0.2.13:80;
}

# Only the check of the accepted forms changes this one.
upstream mrb_stream_check_set {
    server 192.0.2.15:80;
}

server {
    listen 127.0.0.1:12378;
    mruby_stream_code '
      log = lambda { |s| Nginx::Stream.errlogger Nginx::Stream::LOG_NOTICE, "stream upstream checks: #{s} end" }

      log.call "lookup=#{Nginx::Stream::Connection.new("mrb_stream_check_a").upstream_server}"

      begin
        Nginx::Stream::Connection.new "mrb_stream_check"
        log.call "lookup_prefix=found"
      rescue RuntimeError
        log.call "lookup_prefix=RuntimeError"
      end

      z = Nginx::Stream::Connection.new "mrb_stream_check_zone"
      begin
        z.upstream_server = "192.0.2.14:80"
        log.call "zone=changed to #{z.upstream_server}"
      rescue RuntimeError
        log.call "zone=RuntimeError, #{z.upstream_server}"
      end

      c = Nginx::Stream::Connection.new "mrb_stream_check_a"
      begin
        c.upstream_server = nil
        log.call "server_nil=no error"
      rescue TypeError
        log.call "server_nil=TypeError, #{c.upstream_server}"
      end

      # A String that cannot be a server: ArgumentError, and the server stays.
      # "localhost" is a name that the system resolver answers, so a setter
      # that resolves names would change the server instead of raising.
      {
        "empty" => "",
        "long" => "a" * 256,
        "port" => "192.0.2.16:notaport",
        "nohost" => ":80",
        "ipv6" => "[2001:db8::zz]:80",
        "unix" => "unix:",
        "host" => "nonexistent.invalid:80",
        "localhost" => "localhost:80",
        "short" => "127.1:80",
        "nul_unix" => "unix:/tmp/x" + 0.chr + "ab",
        "nul_ipv4" => "192.0.2.19" + 0.chr + "ab",
      }.each do |name, value|
        begin
          c.upstream_server = value
          log.call "server_#{name}=changed to #{c.upstream_server}"
        rescue ArgumentError => e
          log.call "server_#{name}=ArgumentError, #{c.upstream_server}, #{e.message}"
        end
      end

      # The forms of a String that upstream_server= accepts.
      f = Nginx::Stream::Connection.new "mrb_stream_check_set"
      ["192.0.2.17:8080", "192.0.2.18", "[2001:db8::2]:8080", "unix:/tmp/mrb_stream_check.sock"].each_with_index do |value, i|
        f.upstream_server = value
        log.call "server_form#{i}=#{f.upstream_server}"
      end

      begin
        Nginx::Stream::Connection.new nil
        log.call "new_nil=no error"
      rescue TypeError
        log.call "new_nil=TypeError"
      end
    ';
    return "checked";
}
