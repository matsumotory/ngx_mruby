# Stream servers for test/t/cases/stream.rb. Ports 12353 to 12356.
# test.sh includes this file inside stream {} in test/conf/nginx.stream.conf.
# The servers that answer with the stream return directive let the test read
# a fixed text when the mruby code lets the session continue, and read an
# empty, closed connection when the code sets Nginx::Stream::ABORT.

upstream g4_backend {
    server 127.0.0.1:58080;
}

# Port 12353: the file versions of mruby_stream_init and
# mruby_stream_init_worker. The trace is built in this order: the
# mruby_stream_server_context_code of the server on port 12356 while nginx
# reads the configuration, then test/html/stream_init.rb in the master, then
# test/html/stream_init_worker.rb in each worker. The inline *_code versions
# would add init_code and init_worker_code, but they do not run because the
# file directives come later. This characterizes v2 behaviour; see
# docs/proposals/v3-plan.md.
server {
    listen 127.0.0.1:12353;
    mruby_stream_code '
      trace = Userdata.new.g4_stream_trace
      Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "g4 stream trace=#{trace.inspect}"
      if trace != "server_context_code,init_file,init_worker_file"
        Nginx::Stream::Connection.stream_status = Nginx::Stream::ABORT
      end
    ';
    return "g4 trace server_context_code,init_file,init_worker_file";
}

# Port 12354: a listener with proxy_protocol. The code reads the address from
# the PROXY header with the class and the instance methods, and lets the
# session continue only for the two addresses that the test sends. remote_addr
# stays the address of the TCP peer, because this server has no
# set_real_ip_from. The return text shows nginx's own $proxy_protocol_addr.
server {
    listen 127.0.0.1:12354 proxy_protocol;
    mruby_stream_code '
      k = Nginx::Stream::Connection
      c = k.new "g4_backend"
      Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "g4 proxy_protocol_addr=#{k.proxy_protocol_addr} proxy_protocol_ip=#{k.proxy_protocol_ip} remote_addr=#{k.remote_addr}"
      ok = ["192.0.2.10", "2001:db8::1"].include?(k.proxy_protocol_addr) &&
        k.proxy_protocol_ip == k.proxy_protocol_addr &&
        c.proxy_protocol_addr == k.proxy_protocol_addr &&
        c.proxy_protocol_ip == k.proxy_protocol_addr &&
        k.remote_addr == "127.0.0.1" &&
        c.remote_addr == "127.0.0.1" &&
        k.remote_ip == "127.0.0.1"
      k.stream_status = Nginx::Stream::ABORT unless ok
    ';
    return "g4 proxy_protocol ok $proxy_protocol_addr";
}

# Port 12355: the same shape as the server on port 12347, which no test
# connects to. The code sets Nginx::Stream::ABORT for every client from
# 127.0.0.1, so nginx closes the connection before it connects to g4_backend.
server {
    listen 127.0.0.1:12355;
    mruby_stream_code '
      if Nginx::Stream::Connection.remote_ip == "127.0.0.1"
        current_status = Nginx::Stream::Connection.stream_status
        Nginx::Stream::Connection.stream_status = Nginx::Stream::ABORT
        Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "g4 current status=#{(current_status == Nginx::Stream::DECLINED) ? "NGX_DECLINED" : current_status} but deny from #{Nginx::Stream::Connection.remote_ip} return NGX_ABORT"
      end
    ';
    proxy_pass g4_backend;
}

# Port 12356: this server has no listen directive. Its
# mruby_stream_server_context_code adds the listener while nginx reads the
# configuration, and also starts the trace that the server on port 12353
# checks. The session code uses the instance methods stream_status and
# stream_status=. It sets ABORT, reads it back with the instance and the class
# method, and then sets OK. OK in the access phase moves the session to the
# next phase, so the return directive answers.
server {
    mruby_stream_server_context_code '
      Userdata.new.g4_stream_trace = "server_context_code"
      Nginx::Stream.add_listener({address: "127.0.0.1:12356"})
    ';
    mruby_stream_code '
      c = Nginx::Stream::Connection.new "g4_backend"
      before = c.stream_status
      c.stream_status = Nginx::Stream::ABORT
      after_set = c.stream_status
      class_view = Nginx::Stream::Connection.stream_status
      Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "g4 stream_status before=#{before} after_set=#{after_set} class_view=#{class_view}"
      if before == Nginx::Stream::DECLINED && after_set == Nginx::Stream::ABORT && class_view == Nginx::Stream::ABORT
        c.stream_status = Nginx::Stream::OK
      end
    ';
    return "g4 instance stream_status ok";
}
