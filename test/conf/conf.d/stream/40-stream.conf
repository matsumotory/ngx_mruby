# Stream servers for test/t/cases/stream.rb. Ports 12353 to 12356 and 12358.
# test.sh includes this file inside stream {} in test/conf/nginx.stream.conf.
# Port 12357 stays free for the second nginx that
# test/t/cases/_second_instance.rb starts.
# Most servers answer with the stream return directive, so the test reads a
# fixed text when the mruby code lets the session continue, and reads an
# empty, closed connection when the code sets Nginx::Stream::ABORT.

# Nginx::Stream::Connection.new picks the first upstream whose name starts
# with the given name, so this name does not share a prefix with the
# upstreams in test/conf/nginx.stream.conf.
upstream stream_cases_backend {
    server 127.0.0.1:12358;
}

# Port 12358: the backend of the upstream above. It writes a fixed text as
# soon as a client connects and then closes the connection, so a session
# that nginx proxies here gets bytes even when the client sends nothing.
server {
    listen 127.0.0.1:12358;
    return "backend answered";
}

# Ports 12353 and 12354: listeners with proxy_protocol. The test sends a PROXY
# header with an IPv6 source to port 12353 and one with an IPv4 source to port
# 12354. The code expects exactly one source address on each port, reads it
# with the class and the instance methods, and lets the session continue only
# when every value matches. remote_addr stays the address of the TCP peer,
# because this server has no set_real_ip_from. The return text shows nginx's
# own $proxy_protocol_addr.
#
# characterizes v2 behaviour; see docs/proposals/v3-plan.md on the next branch
# proxy_protocol_ip and proxy_protocol_addr are two names for the same C
# function, ngx_stream_mrb_proxy_protocol_addr, for the class methods and for
# the instance methods. Because of that, the checks of proxy_protocol_ip below
# pass in v2 whenever the checks of proxy_protocol_addr pass. They pin that
# both names keep returning the same value.
server {
    listen 127.0.0.1:12353 proxy_protocol;
    listen 127.0.0.1:12354 proxy_protocol;
    mruby_stream_code '
      k = Nginx::Stream::Connection
      c = k.new "stream_cases_backend"
      expected = {12353 => "2001:db8::1", 12354 => "192.0.2.10"}[k.local_port]
      Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "stream case local_port=#{k.local_port} proxy_protocol_addr=#{k.proxy_protocol_addr} proxy_protocol_ip=#{k.proxy_protocol_ip} remote_addr=#{k.remote_addr}"
      ok = k.proxy_protocol_addr == expected &&
        k.proxy_protocol_ip == expected &&
        c.proxy_protocol_addr == expected &&
        c.proxy_protocol_ip == expected &&
        k.remote_addr == "127.0.0.1" &&
        c.remote_addr == "127.0.0.1" &&
        k.remote_ip == "127.0.0.1"
      k.stream_status = Nginx::Stream::ABORT unless ok
    ';
    return "proxy_protocol ok $proxy_protocol_addr";
}

# Port 12355: the same mruby code as the server on port 12347 in
# test/conf/nginx.stream.conf. No test connects to port 12347, and it proxies
# to an HTTP server that waits for a request, so a client that sends nothing
# could not tell ABORT from a backend that waits. This copy proxies to the
# backend on port 12358, which answers at once, so a session that is not
# aborted ends with "backend answered" right away. The code sets
# Nginx::Stream::ABORT for every client from 127.0.0.1, and nginx closes the
# connection before it connects to the backend.
server {
    listen 127.0.0.1:12355;
    mruby_stream_code '
      if Nginx::Stream::Connection.remote_ip == "127.0.0.1"
        current_status = Nginx::Stream::Connection.stream_status
        Nginx::Stream::Connection.stream_status = Nginx::Stream::ABORT
        Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "stream case current status=#{(current_status == Nginx::Stream::DECLINED) ? "NGX_DECLINED" : current_status} but deny from #{Nginx::Stream::Connection.remote_ip} return NGX_ABORT"
      end
    ';
    proxy_pass stream_cases_backend;
}

# Port 12356: this server has no listen directive. Its
# mruby_stream_server_context_code adds the listener while nginx reads the
# configuration. The session code uses the instance methods stream_status and
# stream_status=. It sets ABORT, reads it back with the instance and the class
# method, and then sets OK. OK in the access phase moves the session to the
# next phase, so the return directive answers.
server {
    mruby_stream_server_context_code '
      Nginx::Stream.add_listener({address: "127.0.0.1:12356"})
    ';
    mruby_stream_code '
      c = Nginx::Stream::Connection.new "stream_cases_backend"
      before = c.stream_status
      c.stream_status = Nginx::Stream::ABORT
      after_set = c.stream_status
      class_view = Nginx::Stream::Connection.stream_status
      Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "stream case stream_status before=#{before} after_set=#{after_set} class_view=#{class_view}"
      if before == Nginx::Stream::DECLINED && after_set == Nginx::Stream::ABORT && class_view == Nginx::Stream::ABORT
        c.stream_status = Nginx::Stream::OK
      end
    ';
    return "instance stream_status ok";
}
