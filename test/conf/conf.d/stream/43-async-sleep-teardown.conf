# Guard for the Nginx::Stream::Async.sleep teardown path. A stream session that
# is still suspended in Async.sleep when its connection pool is destroyed (a
# worker shutting down or a configuration reload, or a connection timeout) must
# not leave the sleep timer armed on the freed pool, or the timer fires later
# and reads freed memory (use-after-free; src/stream/ngx_stream_mruby_async.c).
# This fragment exercises the path: a client connects to 12368, whose session
# code sleeps 3000 ms, and resets the connection during the sleep. nginx defers
# a client reset on a suspended stream session until the handler resumes, so
# this does not by itself free the pool while the timer is armed; the case is a
# guard that the Async.sleep teardown stays healthy, not a red/green reproducer
# of the use-after-free (which needs the pool to be freed while the timer is
# armed, as a worker shutdown or reload does, and the standard harness does not
# drive that). 12369 is a plain return server used as a liveness check. Case:
# test/t/cases/stream_async_sleep_teardown.rb. Ports 12368 and 12369. test.sh
# includes this file inside stream {} in test/conf/nginx.stream.conf.
server {
    listen 127.0.0.1:12368;
    mruby_stream_code '
      Nginx::Stream::Async.sleep 3000
      Nginx::Stream.errlogger Nginx::Stream::LOG_NOTICE, "stream async sleep teardown: resumed after the sleep"
    ';
    return "slept";
}

server {
    listen 127.0.0.1:12369;
    return "alive";
}
