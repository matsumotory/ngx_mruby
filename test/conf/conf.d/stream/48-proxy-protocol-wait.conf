# The PROXY protocol header of a stream session whose code waits in
# Nginx::Stream::Async.sleep. Case: test/t/cases/stream_proxy_protocol_wait.rb.
# Port 12384. test.sh includes this file inside stream {} in
# test/conf/nginx.stream.conf.
#
# The code reads proxy_protocol_addr, sleeps 1000 ms and reads it
# again, and the session goes on only when both reads give the same address.
# The client sends more bytes during the sleep. The return text shows nginx's
# $proxy_protocol_addr and $proxy_protocol_port after the code.
server {
    listen 127.0.0.1:12384 proxy_protocol;
    mruby_stream_code '
      k = Nginx::Stream::Connection
      before = k.proxy_protocol_addr
      Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "proxy_protocol wait: before the sleep #{before}"
      Nginx::Stream::Async.sleep 1000
      after = k.proxy_protocol_addr
      Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "proxy_protocol wait: after the sleep #{after}"
      k.stream_status = Nginx::Stream::ABORT unless after == before
    ';
    return "pp $proxy_protocol_addr:$proxy_protocol_port";
}
