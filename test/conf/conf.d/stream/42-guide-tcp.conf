# The sample of the guide "Allow TCP connections in Ruby"
# (docs/guides/tcp.md): test/t/cases/guides.rb connects to port 12364,
# sends test/html/guide_tcp.request and compares what comes back with
# test/html/guide_tcp.response. nginx proxies the connection to the HTTP
# server of test/conf/conf.d/77-guide-tcp-backend.conf (port 18168).
# test.sh includes this file inside stream {} in test/conf/nginx.stream.conf.
upstream guide_tcp_backend {
    server 127.0.0.1:18168;
}

server {
    listen 127.0.0.1:12364;
    mruby_stream build/nginx/html/guide_tcp.rb;
    proxy_pass guide_tcp_backend;
}
