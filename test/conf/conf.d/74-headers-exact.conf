# Nginx::Headers_in and Nginx::Headers_out: which headers [], []= and delete
# find, the headers of the response that nginx keeps in fields of its own
# (Content-Type, Location, Date and Server), the types of a name and of a
# value, and the headers that []= adds to a request that nginx's proxy module
# then passes on. Section 2.2 of docs/proposals/core-alpha1.md has the design.
# Cases: test/t/cases/headers_exact.rb. Hook script: test/html/headers_exact.rb.
# Ports 18095 (the handlers), 18097 (proxy_pass after Headers_in#[]=) and
# 18098 (the upstream of 18097, which answers with the headers it received).
server {
    listen 18095;

    location / {
        mruby_content_handler build/nginx/html/headers_exact.rb;
    }

    # A static file, whose Content-Type nginx sets from its extension before
    # the header filter runs.
    location = /static_content_type {
        alias html/output_filters_static.txt;
        mruby_output_header_filter_code '
          h = Nginx::Request.new.headers_out
          h["X-Before"] = h["Content-Type"].inspect
          h["Content-Type"] = "application/x-headers-exact"
        ';
    }

    # A Content-Type with a charset parameter, under gzip_types text/plain:
    # nginx's filters test the type before the parameter, as for a
    # Content-Type from an upstream, so gzip compresses the response.
    location = /content_type_charset_gzip {
        gzip on;
        gzip_http_version 1.0;
        gzip_types text/plain;
        gzip_min_length 1;
        mruby_content_handler_code '
          Nginx::Request.new.headers_out["Content-Type"] = "text/plain; charset=utf-8"
          Nginx.rputs "headers-exact " * 20
        ';
    }

    # A name that is neither a String nor a Symbol: the handler raises and
    # the request answers 500.
    location = /name_type_raises {
        mruby_content_handler_code '
          Nginx::Request.new.headers_out[1] = "headers-exact-name-type"
          Nginx.rputs "not reached"
        ';
    }
}

# headers_in[]= adds a header to the request, and proxy_pass sends the
# request on. nginx's proxy module looks every header of the request up in
# the table of the headers that it sets itself (proxy_set_header and its own
# ones) by the header's hash and lowcase_key.
server {
    listen 18097;

    proxy_headers_hash_bucket_size 1024;
    proxy_set_header X-Set-By-Proxy proxy;

    location = /add {
        mruby_rewrite_handler_code '
          h = Nginx::Request.new.headers_in
          h["X-Added-Header"] = "script"
          h["X-Set-By-Proxy"] = "script"
        ';
        proxy_pass http://127.0.0.1:18098;
    }

    # The request has one header, X-Only. Deleting it empties the list of
    # the request's headers, and the headers added next take the places
    # that the request's own headers had.
    location = /delete_then_add {
        mruby_rewrite_handler_code '
          h = Nginx::Request.new.headers_in
          h.delete "X-Only"
          h["X-Added-Header"] = "script"
          h["X-Set-By-Proxy"] = "script"
        ';
        proxy_pass http://127.0.0.1:18098;
    }
}

server {
    listen 18098;

    location / {
        return 200 "set_by_proxy=$http_x_set_by_proxy added=$http_x_added_header only=$http_x_only\n";
    }
}
