# Output filters given above a location run in the locations below it, and
# a filter of a location replaces the one of the same kind above it
# (section 2.4 of docs/proposals/core-alpha1.md).
# Cases: test/t/cases/filter_inherit.rb. Port 18108.
#
# The server gives a header filter. /plain, /static, /outer, /outer/inner
# and the if block of /if give no header filter, so each runs the one of the
# server; /outer and /if give a body filter, which /outer/inner and the if
# block run as well. /own gives a header filter of its own, which runs
# instead of the one of the server. A request that matches no location runs
# the filter of the server, which 2.x did too.
server {
    listen 18108;

    mruby_output_header_filter_code 'Nginx::Request.new.headers_out["X-Server-Filter"] = "ran"';

    location = /plain {
        mruby_content_handler_code 'Nginx.rputs "plain"';
    }

    location = /static {
        alias html/output_filters_static.txt;
    }

    location = /own {
        mruby_content_handler_code 'Nginx.rputs "own"';
        mruby_output_header_filter_code 'Nginx::Request.new.headers_out["X-Location-Filter"] = "ran"';
    }

    location /outer {
        mruby_content_handler_code 'Nginx.rputs "outer"';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';

        location = /outer/inner {
            mruby_content_handler_code 'Nginx.rputs "inner"';
        }
    }

    location = /if {
        mruby_content_handler_code 'Nginx.rputs "if"';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';

        if ($arg_in) {
            set $filter_inherit_in_if 1;
        }
    }
}
