# How a request ends when a handler resumed by Nginx::Async.sleep or
# Nginx::Async::HTTP.sub_request raises or calls Nginx.return with a status
# after Nginx.redirect, and when Nginx::Async::HTTP.sub_request requests a
# location whose own handler sleeps.
# Cases: test/t/cases/async_exception_state.rb. Port 18130.
#
# The rewrite handlers of /raise_after_sleep and /raise_after_sub_request
# raise after the resume, so those requests must get 500. All servers of the
# http block share one mrb_state: the next request, to /plain, must run its
# own handler and get 200 with its body, not 500 for the exception of the
# earlier request.
#
# /rputs_then_raise_after_sleep calls Nginx.rputs after the resume and then
# raises, so the request must get 500 without the output of Nginx.rputs.
# /redirect_then_raise_after_sleep redirects to /plain after the resume, so
# /plain sends its 200 while the fiber still runs, and then raises: the
# request must end with that 200 and nginx must close the connection.
# /redirect_then_return_after_sleep does the same, but calls Nginx.return 503
# instead of raising. The 503 cannot be sent after that 200 either, and the
# connection must be closed in the same way.
#
# /sub_request_to_sleeper sends a subrequest to /sleeper, whose rewrite
# handler calls Nginx::Async.sleep and then Nginx.rputs. The timer handler of
# the sleep finalizes the subrequest, and the finalization posts the parent
# request. The request must get 200 with the status and body of the
# subrequest.
server {
    listen 18130;

    location /raise_after_sleep {
        mruby_rewrite_handler_code '
          Nginx::Async.sleep 10
          raise "raised after the sleep"
        ';
    }

    location /raise_after_sub_request {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/leaf"
          raise "raised after the sub_request"
        ';
    }

    location /rputs_then_raise_after_sleep {
        mruby_rewrite_handler_code '
          Nginx::Async.sleep 10
          Nginx.rputs "partial"
          raise "raised after the rputs"
        ';
    }

    location /redirect_then_raise_after_sleep {
        mruby_rewrite_handler_code '
          Nginx::Async.sleep 10
          Nginx.redirect "/plain"
          raise "raised after the redirect"
        ';
    }

    location /redirect_then_return_after_sleep {
        mruby_rewrite_handler_code '
          Nginx::Async.sleep 10
          Nginx.redirect "/plain"
          Nginx.return 503
        ';
    }

    location /sub_request_to_sleeper {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/sleeper"
          res = Nginx::Async::HTTP.last_response
          Nginx.rputs "got:#{res.status}:#{res.body}"
        ';
    }

    location /sleeper {
        mruby_rewrite_handler_code '
          Nginx::Async.sleep 10
          Nginx.rputs "slept"
        ';
    }

    location /leaf {
        return 200 "leaf";
    }

    location /plain {
        mruby_content_handler_code 'Nginx.rputs "plain"';
    }
}
