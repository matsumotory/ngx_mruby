# The value of an mruby_set handler and of Nginx::Var when it is not a
# String: ngx_mruby converts it with to_s. Cases:
# test/t/cases/var_value_to_s.rb. Hook scripts: test/html/var_value_to_s_set.rb
# and test/html/var_value_to_s_var.rb. Port 18159.
#
# The path of a request names the case, and the hook scripts make the value
# that the path names: a String, an Integer, a BasicObject (which has no
# to_s), an object whose to_s raises, or an object whose to_s returns an
# Integer.
server {
    listen 18159;

    # /set/<wait>/<value>: the mruby_set handler returns the value, or calls
    # the setter of Nginx::Var or Nginx::Var#set with it. With <wait> sleep,
    # it calls Nginx::Async.sleep first. The content handler shows the
    # variable with inspect. After the sleep, a handler that ends normally
    # ends the request here without a response, so the cases with sleep use
    # only values that cannot be converted.
    location /set/ {
        mruby_set $var_value_to_s build/nginx/html/var_value_to_s_set.rb cache;
        mruby_content_handler_code 'Nginx.rputs "[#{Nginx::Var.new.var_value_to_s.inspect}]"';
    }

    # /var/<call>/<value>: the content handler calls the setter of Nginx::Var
    # or Nginx::Var#set with the value, or Nginx::Var#set with the value as
    # the name, and answers what the call returned or raised.
    location /var/ {
        set $var_value_to_s "initial";
        mruby_content_handler build/nginx/html/var_value_to_s_var.rb cache;
    }
}
