# Tests for Nginx::Request accessors and setters, Nginx.send_header,
# Nginx::Server#realpath_root, Nginx.configure, Nginx.remove_global_variable,
# Nginx::TRUE and Nginx::FALSE, and Nginx::Headers_in#user_agent.
# Port 58111. The cases are in test/t/cases/request_api.rb.

server {
    listen 58111 default_server;
    server_name localhost;
    root __NGXDOCROOT__;
    # The default changed between nginx versions; fix it so the request line
    # that the backend echoes does not depend on the nginx version.
    proxy_http_version 1.1;

    # A rewrite handler that neither writes a body nor returns
    # Nginx::DECLINED makes the rewrite phase end the request. The other
    # rewrite handlers in this file end with Nginx.return Nginx::DECLINED.
    location /request_api/rewrite_no_return {
        mruby_rewrite_handler_code 'Nginx::Request.new.uri = "/request_api/never_used"';
        mruby_content_handler_code 'Nginx.rputs "content ran"';
    }

    # Getters: the request line, the raw and the decoded URI, the protocol.
    location /request_api/getters/ {
        mruby_content_handler_code '
            r = Nginx::Request.new
            Nginx.rputs [r.request_line, r.unparsed_uri, r.uri, r.args, r.protocol].join("|")
        ';
    }

    # uri= in the rewrite phase. The content handler of the same location
    # runs, and $uri follows the new value while $request_uri does not.
    location /request_api/uri_set {
        mruby_rewrite_handler_code 'Nginx::Request.new.uri = "/request_api/uri_changed"; Nginx.return Nginx::DECLINED';
        mruby_content_handler_code '
            r = Nginx::Request.new
            Nginx.rputs [r.uri, r.var.uri, r.unparsed_uri, r.var.request_uri].join("|")
        ';
    }

    # uri= with nil leaves the URI as it was.
    location /request_api/uri_nil {
        mruby_content_handler_code '
            r = Nginx::Request.new
            r.uri = nil
            Nginx.rputs r.uri
        ';
    }

    # uri= changes $request_filename, which Nginx::Request#filename reads.
    location /request_api/filename_after_uri {
        mruby_rewrite_handler_code 'Nginx::Request.new.uri = "/request_api/other.txt"; Nginx.return Nginx::DECLINED';
        mruby_content_handler_code '
            r = Nginx::Request.new
            Nginx.rputs [r.filename, Nginx::Server.new.document_root].join("|")
        ';
    }

    location /request_api/filename {
        mruby_content_handler_code '
            r = Nginx::Request.new
            Nginx.rputs [r.filename, Nginx::Server.new.document_root].join("|")
        ';
    }

    # proxy_pass with a URI part builds the upstream path from r->uri, so
    # uri= set in the rewrite phase reaches the upstream.
    location /request_api/proxy_uri/ {
        mruby_rewrite_handler_code 'Nginx::Request.new.uri = "/request_api/proxy_uri/rewritten"; Nginx.return Nginx::DECLINED';
        proxy_set_header Host request-api-backend;
        proxy_pass http://127.0.0.1:58111/echo/;
    }

    # proxy_pass without a URI part sends r->unparsed_uri, so uri= does not
    # reach the upstream.
    location /request_api/proxy_uri_raw/ {
        mruby_rewrite_handler_code 'Nginx::Request.new.uri = "/ignored/by/proxy"; Nginx.return Nginx::DECLINED';
        proxy_set_header Host request-api-backend;
        proxy_pass http://127.0.0.1:58111;
    }

    # unparsed_uri= changes what proxy_pass without a URI part sends.
    location /request_api/proxy_unparsed/ {
        mruby_rewrite_handler_code 'Nginx::Request.new.unparsed_uri = "/from/unparsed?y=2"; Nginx.return Nginx::DECLINED';
        proxy_set_header Host request-api-backend;
        proxy_pass http://127.0.0.1:58111;
    }

    # unparsed_uri= is visible to the getter and to $request_uri.
    location /request_api/unparsed_set {
        mruby_content_handler_code '
            r = Nginx::Request.new
            r.unparsed_uri = "/replaced?z=9"
            Nginx.rputs [r.unparsed_uri, r.var.request_uri, r.uri].join("|")
        ';
    }

    # args= in the rewrite phase: $args, $arg_name and the upstream query.
    location /request_api/args_set {
        mruby_rewrite_handler_code 'Nginx::Request.new.args = "k=v&n=2"; Nginx.return Nginx::DECLINED';
        mruby_content_handler_code '
            r = Nginx::Request.new
            Nginx.rputs [r.args, r.var.args, r.var.arg_k, r.var.arg_n, r.var.arg_old.inspect].join("|")
        ';
    }

    location /request_api/proxy_args/ {
        mruby_rewrite_handler_code 'Nginx::Request.new.args = "k=v"; Nginx.return Nginx::DECLINED';
        proxy_set_header Host request-api-backend;
        proxy_pass http://127.0.0.1:58111/echo/;
    }

    # request_line= and protocol= change $request and $server_protocol.
    location /request_api/request_line_set {
        mruby_content_handler_code '
            r = Nginx::Request.new
            before = r.request_line
            r.request_line = "BREW /pot HTCPCP/1.0"
            Nginx.rputs [before, r.request_line, r.var.request].join("|")
        ';
    }

    location /request_api/protocol_set {
        mruby_content_handler_code '
            r = Nginx::Request.new
            before = r.protocol
            r.protocol = "HTTP/9.9"
            Nginx.rputs [before, r.protocol, r.var.server_protocol].join("|")
        ';
    }

    # Nginx::Request#user reads $remote_user.
    location /request_api/user {
        mruby_content_handler_code 'Nginx.rputs "user=" + Nginx::Request.new.user.inspect';
    }

    # Nginx::Headers_in#user_agent.
    location /request_api/ua {
        mruby_content_handler_code 'Nginx.rputs "ua=" + Nginx::Request.new.headers_in.user_agent.inspect';
    }

    # Nginx.send_header and its aliases Nginx.return and Nginx.status_code=.
    location /request_api/send_header/body_200 {
        mruby_content_handler_code '
            Nginx.rputs "body-ok"
            Nginx.send_header Nginx::HTTP_OK
        ';
    }

    location /request_api/send_header/empty_200 {
        mruby_content_handler_code 'Nginx.send_header Nginx::HTTP_OK';
    }

    location /request_api/send_header/empty_404 {
        mruby_content_handler_code 'Nginx.send_header Nginx::HTTP_NOT_FOUND';
    }

    location /request_api/send_header/body_404 {
        mruby_content_handler_code '
            Nginx.rputs "custom-body"
            Nginx.send_header Nginx::HTTP_NOT_FOUND
        ';
    }

    location /request_api/send_header/body_201 {
        mruby_content_handler_code '
            Nginx.rputs "created-body"
            Nginx.send_header 201
        ';
    }

    location /request_api/send_header/return_403 {
        mruby_content_handler_code 'Nginx.return Nginx::HTTP_FORBIDDEN';
    }

    location /request_api/send_header/status_code_body {
        mruby_content_handler_code '
            Nginx.rputs "status-body"
            Nginx.status_code = 200
        ';
    }

    # Nginx::Server#realpath_root resolves ".." in the root; document_root
    # and Nginx::Server#path are shown next to it.
    location /request_api/realpath {
        root __NGXDOCROOT__image/..;
        mruby_content_handler_code '
            s = Nginx::Server.new
            Nginx.rputs [s.document_root, s.realpath_root, s.path].join("|")
        ';
    }

    location /request_api/configure {
        mruby_content_handler_code 'Nginx.rputs Nginx.configure';
    }

    # Nginx.remove_global_variable. The hook file is
    # test/html/request_api_remove_gv.rb.
    location /request_api/gv/remove {
        mruby_content_handler build/nginx/html/request_api_remove_gv.rb;
    }

    # Global variables persist between requests in the single worker that
    # test/conf/nginx.conf starts, until they are removed.
    location /request_api/gv/set {
        mruby_content_handler_code '$request_api_persist = "kept"; Nginx.rputs "set"';
    }

    location /request_api/gv/get {
        mruby_content_handler_code 'Nginx.rputs $request_api_persist.inspect';
    }

    location /request_api/gv/drop {
        mruby_content_handler_code 'Nginx.rputs Nginx.remove_global_variable(:$request_api_persist).include?(:$request_api_persist).to_s';
    }

    # Nginx::TRUE and Nginx::FALSE are the strings "1" and "0", so they work
    # as the value of a variable tested by the rewrite module's if.
    location /request_api/flag/values {
        mruby_content_handler_code 'Nginx.rputs [Nginx::TRUE.inspect, Nginx::FALSE.inspect, Nginx::TRUE.class.to_s].join("|")';
    }

    location /request_api/flag/true {
        mruby_set_code $request_api_flag 'Nginx::TRUE';
        if ($request_api_flag) {
            return 200 "flag-on";
        }
        return 200 "flag-off";
    }

    location /request_api/flag/false {
        mruby_set_code $request_api_flag 'Nginx::FALSE';
        if ($request_api_flag) {
            return 200 "flag-on";
        }
        return 200 "flag-off";
    }
}

# Upstream for the proxy cases above. It answers with the request line it
# received, selected by the Host header request-api-backend on the same port.
server {
    listen 58111;
    server_name request-api-backend;

    location / {
        mruby_content_handler_code 'Nginx.rputs Nginx::Request.new.request_line';
    }
}
