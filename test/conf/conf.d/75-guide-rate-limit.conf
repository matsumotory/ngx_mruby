# The sample of the guide "Limit the rate per API key"
# (docs/guides/rate-limit.md): test/t/cases/guides.rb sends
# test/html/guide_rate_limit.request twice, expects 200 to the first, and
# compares the second response with test/html/guide_rate_limit.response.
# Port 18166.
limit_req_zone $api_key zone=api_keys:1m rate=1r/m;

server {
    listen 18166;

    location /api/ {
        mruby_set $api_key build/nginx/html/guide_rate_limit.rb;
        limit_req zone=api_keys;
        limit_req_status 429;
        error_page 429 @limited;
        mruby_content_handler_code 'Nginx.rputs "accepted\n"';
    }

    location @limited {
        default_type application/json;
        return 429 '{"error":"rate_limited"}\n';
    }
}
