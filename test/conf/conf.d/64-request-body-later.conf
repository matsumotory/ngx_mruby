# Handlers that read the request body with mruby_enable_read_request_body,
# for each kind of handler that can answer the request.
# Cases: test/t/cases/request_body_later.rb. Ports 18144 and 18147.
#
# Each request below gets "body=" and the request body. The access and
# post-read handlers keep the body in Userdata and the content handler of
# the location writes it, because those two handlers do not answer the
# request themselves. Post-read and server rewrite handlers are set for a
# whole server, so they get servers of their own on the same port, selected
# with the Host header.
server {
    listen 18144;
    server_name localhost;

    location /rewrite {
        mruby_enable_read_request_body on;
        mruby_rewrite_handler_code 'Nginx.rputs "body=#{Nginx::Request.new.body}"';
    }

    location /access {
        mruby_enable_read_request_body on;
        mruby_access_handler_code 'Userdata.new.request_body_later = Nginx::Request.new.body';
        mruby_content_handler_code 'Nginx.rputs "body=#{Userdata.new.request_body_later}"';
    }

    location /content {
        mruby_enable_read_request_body on;
        mruby_content_handler_code 'Nginx.rputs "body=#{Nginx::Request.new.body}"';
    }
}

server {
    listen 18144;
    server_name post-read.request-body-later.test;
    mruby_enable_read_request_body on;
    mruby_post_read_handler_code 'Userdata.new.request_body_later = Nginx::Request.new.body';

    location / {
        mruby_content_handler_code 'Nginx.rputs "body=#{Userdata.new.request_body_later}"';
    }
}

server {
    listen 18144;
    server_name server-rewrite.request-body-later.test;
    mruby_enable_read_request_body on;
    mruby_server_rewrite_handler_code 'Nginx.rputs "body=#{Nginx::Request.new.body}"';

    location / {
        return 200 "not reached\n";
    }
}

# Port 18147: a rewrite or an access handler reads the body, and then the
# auth_request module of nginx, an access phase handler that runs after the
# mruby access handler, makes a subrequest and waits for it. When the
# subrequest ends, nginx resumes the main request through its write event
# handler. The content handler writes "body=" and the body that the first
# handler kept in Userdata.
server {
    listen 18147;
    server_name localhost;

    location = /auth_ok {
        internal;
        return 204;
    }

    location /rewrite {
        mruby_enable_read_request_body on;
        mruby_rewrite_handler_code '
            Userdata.new.request_body_auth_request = Nginx::Request.new.body
            Nginx.return Nginx::DECLINED
        ';
        auth_request /auth_ok;
        mruby_content_handler_code 'Nginx.rputs "body=#{Userdata.new.request_body_auth_request}"';
    }

    location /access {
        mruby_enable_read_request_body on;
        mruby_access_handler_code 'Userdata.new.request_body_auth_request = Nginx::Request.new.body';
        auth_request /auth_ok;
        mruby_content_handler_code 'Nginx.rputs "body=#{Userdata.new.request_body_auth_request}"';
    }
}
