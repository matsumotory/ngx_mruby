# Handlers that read the request body with mruby_enable_read_request_body,
# for each kind of handler that can answer the request.
# Cases: test/t/cases/request_body_later.rb. Ports 18144, 18147, 18148,
# 18149 and 18152.
#
# Each request below gets "body=" and the request body. The access and
# post-read handlers keep the body in Userdata and the content handler of
# the location writes it, because those two handlers do not answer the
# request themselves. Post-read and server rewrite handlers are set for a
# whole server, so they get servers of their own on the same port, selected
# with the Host header.
server {
    listen 18144;
    server_name localhost;

    location /rewrite {
        mruby_enable_read_request_body on;
        mruby_rewrite_handler_code 'Nginx.rputs "body=#{Nginx::Request.new.body}"';
    }

    location /access {
        mruby_enable_read_request_body on;
        mruby_access_handler_code 'Userdata.new.request_body_later = Nginx::Request.new.body';
        mruby_content_handler_code 'Nginx.rputs "body=#{Userdata.new.request_body_later}"';
    }

    location /content {
        mruby_enable_read_request_body on;
        mruby_content_handler_code 'Nginx.rputs "body=#{Nginx::Request.new.body}"';
    }

    # The second request on a keep-alive connection.
    location = /plain {
        return 200 "plain";
    }

    # client_body_timeout ends a request whose body stops arriving.
    location /rewrite_timeout {
        client_body_timeout 2s;
        mruby_enable_read_request_body on;
        mruby_rewrite_handler_code 'Nginx.rputs "body=#{Nginx::Request.new.body}"';
    }

    location /content_timeout {
        client_body_timeout 2s;
        mruby_enable_read_request_body on;
        mruby_content_handler_code 'Nginx.rputs "body=#{Nginx::Request.new.body}"';
    }

    # The handler raises after it got the body that arrived late.
    location /rewrite_raise {
        mruby_enable_read_request_body on;
        mruby_rewrite_handler_code 'raise "raised after #{Nginx::Request.new.body.size} bytes"';
    }

    location /content_raise {
        mruby_enable_read_request_body on;
        mruby_content_handler_code 'raise "raised after #{Nginx::Request.new.body.size} bytes"';
    }
}

server {
    listen 18144;
    server_name post-read.request-body-later.test;
    mruby_enable_read_request_body on;
    mruby_post_read_handler_code 'Userdata.new.request_body_later = Nginx::Request.new.body';

    location / {
        mruby_content_handler_code 'Nginx.rputs "body=#{Userdata.new.request_body_later}"';
    }
}

server {
    listen 18144;
    server_name server-rewrite.request-body-later.test;
    mruby_enable_read_request_body on;
    mruby_server_rewrite_handler_code 'Nginx.rputs "body=#{Nginx::Request.new.body}"';

    location / {
        return 200 "not reached\n";
    }
}

# Port 18147: a rewrite or an access handler reads the body, and then the
# auth_request module of nginx, an access phase handler that runs after the
# mruby access handler, makes a subrequest and waits for it. When the
# subrequest ends, nginx resumes the main request through its write event
# handler. The content handler writes "body=" and the body that the first
# handler kept in Userdata.
server {
    listen 18147;
    server_name localhost;

    location = /auth_ok {
        internal;
        return 204;
    }

    location /rewrite {
        mruby_enable_read_request_body on;
        mruby_rewrite_handler_code '
            Userdata.new.request_body_auth_request = Nginx::Request.new.body
            Nginx.return Nginx::DECLINED
        ';
        auth_request /auth_ok;
        mruby_content_handler_code 'Nginx.rputs "body=#{Userdata.new.request_body_auth_request}"';
    }

    location /access {
        mruby_enable_read_request_body on;
        mruby_access_handler_code 'Userdata.new.request_body_auth_request = Nginx::Request.new.body';
        auth_request /auth_ok;
        mruby_content_handler_code 'Nginx.rputs "body=#{Userdata.new.request_body_auth_request}"';
    }
}

# Port 18148: an mruby_set handler reads the request body. NDK runs it inside
# the rewrite phase and goes on with the next directive when it returns, so
# it cannot wait for the rest of a body. In /content the content handler of
# the location, and in /proxy and /proxy_return proxy_pass to port 18149,
# read the whole body afterwards; the upstream location of /proxy_return
# answers without reading the body. The content handler logs a notice line
# each time its code runs, so that the case can count the runs; the text of
# that line is built at run time, because error.log also holds the code of
# inline handlers.
server {
    listen 18148;
    server_name localhost;

    location /content {
        mruby_enable_read_request_body on;
        mruby_set_code $request_body_set 'Nginx::Request.new.body.to_s';
        mruby_content_handler_code '
            Nginx.log Nginx::LOG_NOTICE, ["request", "body", "set", "content", "code", "ran"].join("-")
            Nginx.rputs "var=[#{Nginx::Var.new.request_body_set}] body=[#{Nginx::Request.new.body}]"
        ';
    }

    location /proxy {
        mruby_enable_read_request_body on;
        mruby_set_code $request_body_set 'Nginx::Request.new.body.to_s';
        proxy_set_header X-Request-Body-Set $request_body_set;
        proxy_pass http://127.0.0.1:18149;
    }

    location /proxy_return {
        mruby_enable_read_request_body on;
        mruby_set_code $request_body_set 'Nginx::Request.new.body.to_s';
        proxy_pass http://127.0.0.1:18149;
    }
}

# Port 18149: the upstream server of /proxy and /proxy_return above. For
# /proxy it writes the value of the variable that /proxy sent in a header
# (nginx leaves an empty header out) and the body that it received.
server {
    listen 18149;
    server_name localhost;

    location = /proxy_return {
        return 200 "plain";
    }

    location / {
        mruby_enable_read_request_body on;
        mruby_content_handler_code '
            r = Nginx::Request.new
            Nginx.rputs "var=[#{r.headers_in["X-Request-Body-Set"]}] body=[#{r.body}]"
        ';
    }
}

# Port 18152: a rewrite handler waits for the rest of the body, and the read
# ends without it: client_body_timeout expires (/log_handler), or nginx
# rejects a malformed chunked body with 400 and sends its error page
# (/header_filter, /body_filter). An mruby log handler, header filter or body
# filter of the location runs after that. These kinds cannot wait, and the
# body that the rewrite handler waits for is not complete, so they run
# without it, and the code of the rewrite handler does not run, because
# nginx ends the request. Nginx::Request#body returns the part of the body
# that nginx had read before it ended the read: the log handler logs it with
# inspect in a notice line, and the header filter writes it with inspect into
# the header X-Request-Body. The rewrite handler logs a notice line each time
# its code runs. The text of both notice lines is built at run time as on
# port 18148.
server {
    listen 18152;
    server_name localhost;

    location /log_handler {
        client_body_timeout 2s;
        mruby_enable_read_request_body on;
        mruby_rewrite_handler_code '
            Nginx.log Nginx::LOG_NOTICE, ["request", "body", "pending", "code", "ran"].join("-")
            Nginx.rputs "body=#{Nginx::Request.new.body}"
        ';
        mruby_log_handler_code '
            Nginx.log Nginx::LOG_NOTICE, ["request", "body", "pending", "logged"].join("-") + " " + Nginx::Request.new.body.inspect
        ';
    }

    location /header_filter {
        mruby_enable_read_request_body on;
        mruby_rewrite_handler_code '
            Nginx.log Nginx::LOG_NOTICE, ["request", "body", "pending", "code", "ran"].join("-")
            Nginx.rputs "body=#{Nginx::Request.new.body}"
        ';
        mruby_output_header_filter_code '
            r = Nginx::Request.new
            r.headers_out["X-Header-Filter"] = "ran"
            r.headers_out["X-Request-Body"] = r.body.inspect
        ';
    }

    location /body_filter {
        mruby_enable_read_request_body on;
        mruby_rewrite_handler_code '
            Nginx.log Nginx::LOG_NOTICE, ["request", "body", "pending", "code", "ran"].join("-")
            Nginx.rputs "body=#{Nginx::Request.new.body}"
        ';
        mruby_output_body_filter_code 'Nginx::Filter.new.body';
    }
}
