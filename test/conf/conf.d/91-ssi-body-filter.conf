# An mruby content handler or body filter in a location that an SSI page
# includes, so that the handler runs in a subrequest.
# Cases: test/t/cases/ssi_body_filter.rb. Port 18146.
#
# Each page under /ssi/ is "before ", the SSI include of a location under
# /inc/, and " after". The included location answers "middle", from a static
# file or from an mruby content handler. Its mruby body filter, when it
# has one, changes that body: to upper case, or, in /inc/static_longer, to
# a longer body. /inc/content_raw has no body filter, so the output of the
# content handler reaches the response as it was written. Some of the
# included locations also have an mruby header filter, which holds the
# header of the subrequest back until the body filter has run.
#
# nginx ends the body of a subrequest with a buffer marked last_in_chain;
# only the main request ends its body with last_buf. A subrequest that
# marks its last buffer with last_buf, through mruby's own finalization,
# ends the HTTP/1.1 chunked response of the main request mid-stream and
# holds the main response on static file reads until send_timeout.
# send_timeout is short, so that a response that stops early ends within
# seconds.
server {
    listen 18146;
    send_timeout 3s;
    default_type text/html;

    location = /ssi/static {
        ssi on;
        return 200 'before <!--# include virtual="/inc/static" --> after';
    }

    location = /ssi/static_header {
        ssi on;
        return 200 'before <!--# include virtual="/inc/static_header" --> after';
    }

    location = /ssi/static_longer {
        ssi on;
        return 200 'before <!--# include virtual="/inc/static_longer" --> after';
    }

    location = /ssi/content {
        ssi on;
        return 200 'before <!--# include virtual="/inc/content" --> after';
    }

    location = /ssi/content_header {
        ssi on;
        return 200 'before <!--# include virtual="/inc/content_header" --> after';
    }

    location = /ssi/content_raw {
        ssi on;
        return 200 'before <!--# include virtual="/inc/content_raw" --> after';
    }

    # The same included location twice in one page.
    location = /ssi/static_twice {
        ssi on;
        return 200 'before <!--# include virtual="/inc/static" --> and <!--# include virtual="/inc/static" --> after';
    }

    location = /inc/static {
        alias html/ssi_body_filter_part.txt;
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    location = /inc/static_header {
        alias html/ssi_body_filter_part.txt;
        mruby_output_header_filter_code '
          Nginx::Request.new.headers_out["X-Header-Filter"] = "1"
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    location = /inc/static_longer {
        alias html/ssi_body_filter_part.txt;
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = "[" + f.body.upcase + "]"
        ';
    }

    location = /inc/content {
        mruby_content_handler_code 'Nginx.rputs "middle"';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    location = /inc/content_header {
        mruby_content_handler_code 'Nginx.rputs "middle"';
        mruby_output_header_filter_code '
          Nginx::Request.new.headers_out["X-Header-Filter"] = "1"
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    # An mruby content handler with no body filter: the output of Nginx.rputs
    # reaches the parent response as written, so a terminator set on it by
    # the subrequest's finalization would split the parent chunked body.
    location = /inc/content_raw {
        mruby_content_handler_code 'Nginx.rputs "middle"';
    }
}
