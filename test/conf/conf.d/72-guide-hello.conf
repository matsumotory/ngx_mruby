# The sample of the use case "Hello world" (docs/use_case/README.md):
# test/t/cases/guides.rb sends test/html/guide_hello.request and compares
# the response with test/html/guide_hello.response. Port 18161.
server {
    listen 18161;

    location /hello {
        mruby_content_handler build/nginx/html/guide_hello.rb;
    }
}
