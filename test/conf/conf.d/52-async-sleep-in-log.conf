# Nginx::Async in a log handler. Cases: test/t/cases/async_sleep_in_log.rb.
# Port 18129.
#
# nginx runs the log handlers from ngx_http_free_request, after the cleanups
# of the request have run and right before it destroys the request pool, so
# nothing can resume the fiber of a log handler. Nginx::Async.sleep and
# Nginx::Async::HTTP.sub_request raise a RuntimeError there, and neither a
# timer nor a subrequest may touch the request after it ended. A log handler
# that suspends its fiber with Fiber.yield ends with an error line, and its
# fiber is dropped before the request pool is destroyed.
server {
    listen 18129;

    location /log_sleep {
        mruby_content_handler_code 'Nginx.rputs "ok"';
        mruby_log_handler_code 'Nginx::Async.sleep 100';
    }

    location /log_sub_request {
        mruby_content_handler_code 'Nginx.rputs "ok"';
        mruby_log_handler_code 'Nginx::Async::HTTP.sub_request "/leaf"';
    }

    location /log_yield {
        mruby_content_handler_code 'Nginx.rputs "ok"';
        mruby_log_handler_code 'Fiber.yield';
    }

    location /leaf {
        return 200 "leaf";
    }

    # Keeps nginx serving a request for longer than the sleep of the log
    # handler above, so that a timer left behind by /log_sleep would expire
    # while this request is in progress.
    location /wait {
        mruby_rewrite_handler_code '
          Nginx::Async.sleep 300
          Nginx.rputs "waited"
          Nginx.return Nginx::HTTP_OK
        ';
    }
}
