# The sample of the guide "Route requests to a backend"
# (docs/guides/routing.md): test/t/cases/guides.rb sends
# test/html/guide_routing.request and compares the response with
# test/html/guide_routing.response. Port 18163, with the two backends on
# 18164 and 18165.
server {
    listen 18163;

    location / {
        mruby_set $backend build/nginx/html/guide_routing.rb;
        proxy_pass http://$backend;
    }
}

server {
    listen 18164;
    default_type text/plain;
    return 200 "backend a on port 18164\n";
}

server {
    listen 18165;
    default_type text/plain;
    return 200 "backend b on port 18165\n";
}
