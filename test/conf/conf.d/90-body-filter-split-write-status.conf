# An mruby body filter on a response that a handler wrote with Nginx.rputs
# and sent with a status that the handler set before or after the output,
# when nginx needs more than one write to send it.
# Cases: test/t/cases/body_filter_split_write_status.rb. Port 18142.
#
# A handler that sets a status from 200 up before or after its output sends
# the output with that status (test/conf/conf.d/89-body-with-status.conf),
# in the same way as output without a status. The body filter turns the
# output to upper case and keeps its length. limit_rate and
# sendfile_max_chunk make nginx's write filter send only a part of the
# response in the first write; ngx_http_writer then calls the body filter
# again with no new data, and the filter must pass that call on, or the
# rest of the response is not sent until send_timeout ends the connection.
# send_timeout is short, so that a response that stops early ends within
# seconds.
server {
    listen 18142;
    send_timeout 3s;

    # 201 after the output, with writes of at most 1024 bytes.
    location = /created_after_max_chunk {
        sendfile_max_chunk 1k;
        mruby_content_handler_code '
          Nginx.rputs "a" * 4000
          Nginx.return Nginx::HTTP_CREATED
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    # 201 after the output, with 2500 bytes at 1000 bytes per second: the
    # response is longer than two seconds of the rate, so the first write
    # cannot send all of it even when the clock passes a second boundary.
    location = /created_after_limit_rate {
        limit_rate 1000;
        mruby_content_handler_code '
          Nginx.rputs "a" * 2500
          Nginx.return Nginx::HTTP_CREATED
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    # 403 after the output. nginx does not answer the status with its own
    # page: the output goes out with it.
    location = /forbidden_after_max_chunk {
        sendfile_max_chunk 1k;
        mruby_content_handler_code '
          Nginx.rputs "a" * 4000
          Nginx.return Nginx::HTTP_FORBIDDEN
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    # The same with a header filter as well: it counts its runs in a
    # response header.
    location = /forbidden_after_both_filters_max_chunk {
        sendfile_max_chunk 1k;
        mruby_content_handler_code '
          Nginx.rputs "a" * 4000
          Nginx.return Nginx::HTTP_FORBIDDEN
        ';
        mruby_output_header_filter_code '
          r = Nginx::Request.new
          runs = r.headers_out["X-Header-Filter-Runs"]
          r.headers_out["X-Header-Filter-Runs"] = (runs.nil? ? 1 : runs.to_i + 1).to_s
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    # 403 before the output, set with Nginx.status_code=.
    location = /forbidden_before_max_chunk {
        sendfile_max_chunk 1k;
        mruby_content_handler_code '
          Nginx.status_code = Nginx::HTTP_FORBIDDEN
          Nginx.rputs "a" * 4000
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }

    # A rewrite handler sends its output with the status after it in the
    # same way as a content handler.
    location = /rewrite_forbidden_after_max_chunk {
        sendfile_max_chunk 1k;
        mruby_rewrite_handler_code '
          Nginx.rputs "a" * 4000
          Nginx.return Nginx::HTTP_FORBIDDEN
        ';
        mruby_output_body_filter_code '
          f = Nginx::Filter.new
          f.body = f.body.upcase
        ';
    }
}
