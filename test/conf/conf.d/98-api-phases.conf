# Where the methods of the Ruby API work: each handler kind calls methods
# of the rows of the table in section 2.1 of docs/proposals/core-alpha1.md.
# Cases: test/t/cases/api_phases.rb. Port 18119.
#
# Each call runs in api_phases_try, which writes one line at the error level
# to error.log: "api_phases KIND NAME: ok" when the call returned, and
# "api_phases KIND NAME: CLASS: MESSAGE" when it raised, so that one request
# checks several methods. The locations whose name ends with _raise call one
# method without a rescue, to check how the handler ends.
server {
    listen 18119;

    set $api_phases_var "unset";

    # A log handler: the response is sent, so the methods that change the
    # request, the head of the response or the output raise.
    location = /log {
        mruby_content_handler_code 'Nginx.rputs "log"';
        mruby_log_handler_code '
          def api_phases_try(kind, name)
            yield
            Nginx.log Nginx::LOG_ERR, "api_phases #{kind} #{name}: ok"
          rescue => e
            Nginx.log Nginx::LOG_ERR, "api_phases #{kind} #{name}: #{e.class}: #{e.message}"
          end
          r = Nginx::Request.new
          api_phases_try("log", "uri") { r.uri }
          api_phases_try("log", "var=") { Nginx::Var.new.api_phases_var = "log" }
          api_phases_try("log", "uri=") { r.uri = "/changed" }
          api_phases_try("log", "args=") { r.args = "a=1" }
          api_phases_try("log", "headers_in[]=") { r.headers_in["X-Api-Phases"] = "1" }
          api_phases_try("log", "headers_in.delete") { r.headers_in.delete "Host" }
          api_phases_try("log", "headers_out[]=") { r.headers_out["X-Api-Phases"] = "1" }
          api_phases_try("log", "headers_out.delete") { r.headers_out.delete "X-Api-Phases" }
          api_phases_try("log", "status_code=") { Nginx.status_code = 503 }
          api_phases_try("log", "return") { Nginx.return 503 }
          api_phases_try("log", "content_type=") { r.content_type = "text/x-api-phases" }
          api_phases_try("log", "rputs") { Nginx.rputs "x" }
          api_phases_try("log", "echo") { Nginx.echo "x" }
          api_phases_try("log", "Filter#body") { Nginx::Filter.new.body }
        ';
    }

    location = /log_raise {
        mruby_content_handler_code 'Nginx.rputs "log"';
        mruby_log_handler_code '
          Nginx::Request.new.headers_out["X-Api-Phases"] = "log"
          Nginx::Var.new.api_phases_var = "after"
        ';
    }

    # A header filter: it changes the head of the response, and nothing else.
    location = /header_filter {
        mruby_content_handler_code 'Nginx.rputs "origin"';
        mruby_output_header_filter_code '
          def api_phases_try(kind, name)
            yield
            Nginx.log Nginx::LOG_ERR, "api_phases #{kind} #{name}: ok"
          rescue => e
            Nginx.log Nginx::LOG_ERR, "api_phases #{kind} #{name}: #{e.class}: #{e.message}"
          end
          r = Nginx::Request.new
          api_phases_try("header_filter", "uri") { r.uri }
          api_phases_try("header_filter", "uri=") { r.uri = "/changed" }
          api_phases_try("header_filter", "headers_in[]=") { r.headers_in["X-Api-Phases"] = "1" }
          api_phases_try("header_filter", "headers_out[]=") { r.headers_out["X-Api-Phases"] = "header_filter" }
          api_phases_try("header_filter", "rputs") { Nginx.rputs "x" }
          api_phases_try("header_filter", "Filter#body") { Nginx::Filter.new.body }
        ';
    }

    location = /header_filter_raise {
        mruby_content_handler_code 'Nginx.rputs "origin"';
        mruby_output_header_filter_code 'Nginx.rputs "x"';
    }

    # A body filter: it changes the head of the response, which nginx sends
    # after the filter, and the body.
    location = /body_filter {
        mruby_content_handler_code 'Nginx.rputs "origin"';
        mruby_output_body_filter_code '
          def api_phases_try(kind, name)
            yield
            Nginx.log Nginx::LOG_ERR, "api_phases #{kind} #{name}: ok"
          rescue => e
            Nginx.log Nginx::LOG_ERR, "api_phases #{kind} #{name}: #{e.class}: #{e.message}"
          end
          r = Nginx::Request.new
          f = Nginx::Filter.new
          api_phases_try("body_filter", "uri") { r.uri }
          api_phases_try("body_filter", "method=") { r.method = "PUT" }
          api_phases_try("body_filter", "headers_in.delete") { r.headers_in.delete "Host" }
          api_phases_try("body_filter", "headers_out[]=") { r.headers_out["X-Api-Phases"] = "body_filter" }
          api_phases_try("body_filter", "Filter#body") { f.body }
          api_phases_try("body_filter", "Filter#body=") { f.body = "filtered:#{f.body}" }
        ';
    }

    # An mruby_set handler: it changes the request, and has no output.
    location = /set {
        mruby_set_code $api_phases_var '
          def api_phases_try(kind, name)
            yield
            Nginx.log Nginx::LOG_ERR, "api_phases #{kind} #{name}: ok"
          rescue => e
            Nginx.log Nginx::LOG_ERR, "api_phases #{kind} #{name}: #{e.class}: #{e.message}"
          end
          r = Nginx::Request.new
          api_phases_try("set", "headers_in[]=") { r.headers_in["X-Api-Phases"] = "set" }
          api_phases_try("set", "headers_out[]=") { r.headers_out["X-Api-Phases"] = "set" }
          api_phases_try("set", "rputs") { Nginx.rputs "x" }
          api_phases_try("set", "echo") { Nginx.echo "x" }
          api_phases_try("set", "Filter#output") { Nginx::Filter.new.output "x" }
          "set:#{r.headers_in["X-Api-Phases"]}"
        ';
        mruby_content_handler_code 'Nginx.rputs Nginx::Var.new.api_phases_var';
    }

    # A post_action location runs after nginx has sent the response of the
    # request, with r->header_sent set: the head of the response cannot change
    # any more, and the methods of the response head raise.
    location = /post_action {
        mruby_content_handler_code 'Nginx.rputs "post_action"';
        post_action /post_action_target;
    }

    location = /post_action_target {
        mruby_content_handler_code '
          def api_phases_try(kind, name)
            yield
            Nginx.log Nginx::LOG_ERR, "api_phases #{kind} #{name}: ok"
          rescue => e
            Nginx.log Nginx::LOG_ERR, "api_phases #{kind} #{name}: #{e.class}: #{e.message}"
          end
          r = Nginx::Request.new
          api_phases_try("post_action", "uri") { r.uri }
          api_phases_try("post_action", "headers_out[]=") { r.headers_out["X-Api-Phases"] = "post_action" }
          api_phases_try("post_action", "return") { Nginx.return 503 }
        ';
    }

    # A content handler: every row works but the body of a body filter.
    location = /content {
        mruby_content_handler_code '
          def api_phases_try(kind, name)
            yield
            Nginx.log Nginx::LOG_ERR, "api_phases #{kind} #{name}: ok"
          rescue => e
            Nginx.log Nginx::LOG_ERR, "api_phases #{kind} #{name}: #{e.class}: #{e.message}"
          end
          r = Nginx::Request.new
          api_phases_try("content", "args=") { r.args = "a=1" }
          api_phases_try("content", "headers_out[]=") { r.headers_out["X-Api-Phases"] = "content" }
          api_phases_try("content", "content_type=") { r.content_type = "text/x-api-phases" }
          api_phases_try("content", "Filter#body") { Nginx::Filter.new.body }
          api_phases_try("content", "rputs") { Nginx.rputs "content:#{r.args}" }
        ';
    }
}
