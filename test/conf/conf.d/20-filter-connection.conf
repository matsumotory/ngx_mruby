# Nginx::Filter#output, Nginx::Upstream#keepalive_cache= and
# Nginx::Connection. Port 18112 serves plain HTTP. Port 18113 listens with
# proxy_protocol and is driven by test/t/cases/_filter_connection_client.rb.
# Nginx::Upstream.new picks the first upstream whose name starts with the
# given name, so the upstream names here start with keepalive_cache_, which
# no upstream in another file shares.

upstream keepalive_cache_configured {
    server 127.0.0.1:18112;
    mruby_upstream_keepalive 4;
}

upstream keepalive_cache_plain {
    server 127.0.0.1:18112;
}

upstream keepalive_cache_set {
    server 127.0.0.1:18112;
    mruby_upstream_keepalive 3;
}

upstream keepalive_cache_invalid {
    server 127.0.0.1:18112;
    mruby_upstream_keepalive 5;
}

upstream keepalive_cache_persist {
    server 127.0.0.1:18112;
    mruby_upstream_keepalive 2;
}

upstream keepalive_cache_proxy {
    server 127.0.0.1:18112;
    mruby_upstream_keepalive 2;
}

upstream keepalive_cache_prefix_target {
    server 127.0.0.1:18112;
    mruby_upstream_keepalive 7;
}

server {
    listen 18112;

    # Origin for the proxied filter and upstream tests.
    location /backend {
        mruby_content_handler_code 'Nginx.rputs "backend body"';
    }

    # Filter#output returns the byte length it stored, and a second call
    # replaces the body stored by the first call.
    location /filter/output_return {
        return 200 "origin";
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            n = f.output "hello"
            f.output "#{f.body}|#{n}"
        ';
    }

    # The origin is an mruby content handler in the same location. The new
    # body here is longer than the origin body.
    location /filter/output_rputs_origin {
        mruby_content_handler_code 'Nginx.rputs "origin"';
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            f.output "[#{f.body}] and more"
        ';
    }

    location /filter/output_from_body {
        return 200 "origin";
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            f.output f.body.reverse + "!"
        ';
    }

    location /filter/output_non_string {
        return 200 "origin";
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            f.output 12345
        ';
    }

    location /filter/output_empty {
        return 200 "origin";
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            f.output ""
        ';
    }

    location /filter/output_multibyte {
        return 200 "origin";
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            n = f.output "\xE3\x81\x82\xE3\x81\x84\xE3\x81\x86"
            f.output "#{f.body}|#{n}"
        ';
    }

    location /filter/output_grow {
        return 200 "a";
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            f.output f.body * 10000
        ';
    }

    location /filter/output_file {
        return 200 "origin";
        mruby_output_body_filter build/nginx/html/filter_connection_output.rb;
    }

    location /filter/output_proxy {
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            f.output "proxied: #{f.body}"
        ';
        proxy_pass http://127.0.0.1:18112/backend;
    }

    # Filter#body read outside a body filter returns an empty string.
    location /filter/body_in_content {
        mruby_content_handler_code '
            Nginx.rputs Nginx::Filter.new.body.inspect
        ';
    }

    # Nginx::Upstream#keepalive_cache and keepalive_cache=
    location /upstream/configured {
        mruby_content_handler_code '
            u = Nginx::Upstream.new "keepalive_cache_configured"
            Nginx.rputs "#{u.keepalive_cache}|#{u.server}"
        ';
    }

    location /upstream/no_directive {
        mruby_content_handler_code '
            u = Nginx::Upstream.new "keepalive_cache_plain"
            Nginx.rputs u.keepalive_cache.to_s
        ';
    }

    location /upstream/set {
        mruby_content_handler_code '
            u = Nginx::Upstream.new "keepalive_cache_set"
            before = u.keepalive_cache
            ret = u.send(:keepalive_cache=, 9)
            min = u.send(:keepalive_cache=, 2)
            Nginx.rputs "#{before}|#{ret}|#{min}|#{u.keepalive_cache}"
        ';
    }

    location /upstream/set_invalid {
        mruby_content_handler_code '
            u = Nginx::Upstream.new "keepalive_cache_invalid"
            out = []
            [1, 0, -3].each do |v|
              begin
                u.keepalive_cache = v
                out << "accepted #{v}"
              rescue => e
                out << "#{e.class}: #{e.message}"
              end
            end
            out << u.keepalive_cache.to_s
            Nginx.rputs out.join("|")
        ';
    }

    location /upstream/persist_set {
        mruby_content_handler_code '
            u = Nginx::Upstream.new "keepalive_cache_persist"
            u.keepalive_cache = 6
            Nginx.rputs u.keepalive_cache.to_s
        ';
    }

    location /upstream/persist_get {
        mruby_content_handler_code '
            Nginx.rputs Nginx::Upstream.new("keepalive_cache_persist").keepalive_cache.to_s
        ';
    }

    location /upstream/set_then_proxy {
        mruby_rewrite_handler_code '
            u = Nginx::Upstream.new "keepalive_cache_proxy"
            u.keepalive_cache = 5
            Nginx::Request.new.headers_out["X-Keepalive-Cache"] = u.keepalive_cache.to_s
            Nginx.return Nginx::DECLINED
        ';
        proxy_pass http://keepalive_cache_proxy/backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /upstream/name_match {
        mruby_content_handler_code '
            a = Nginx::Upstream.new("keepalive_cache_prefix").keepalive_cache
            b = Nginx::Upstream.new("KEEPALIVE_CACHE_CONFIGURED").keepalive_cache
            Nginx.rputs "#{a}|#{b}"
        ';
    }

    location /upstream/unknown {
        mruby_content_handler_code '
            begin
              Nginx::Upstream.new "keepalive_cache_nothing"
              Nginx.rputs "no error"
            rescue => e
              Nginx.rputs "#{e.class}: #{e.message}"
            end
        ';
    }

    # keepalive_cache= changes the upstream configuration of the worker until
    # nginx restarts. This location puts back the values from the upstream
    # blocks above that the cases change, so that the cases pass again when
    # they run a second time against the same nginx.
    location /upstream/restore {
        mruby_content_handler_code '
            out = [["keepalive_cache_set", 3], ["keepalive_cache_persist", 2], ["keepalive_cache_proxy", 2]].map do |name, v|
              u = Nginx::Upstream.new name
              u.keepalive_cache = v
              u.keepalive_cache
            end
            Nginx.rputs out.join("|")
        ';
    }

    # Nginx::Connection over plain HTTP
    location /connection/info {
        mruby_content_handler_code '
            c = Nginx::Connection.new
            Nginx.rputs [c.remote_ip, c.local_ip, c.local_port, c.local_port.class, c.remote_port.class].join("|")
        ';
    }

    location /connection/remote_port {
        mruby_content_handler_code 'Nginx.rputs Nginx::Connection.new.remote_port';
    }
}

server {
    listen 18113 proxy_protocol;

    location /proxy_protocol {
        mruby_content_handler_code '
            c = Nginx::Connection.new
            v = Nginx::Var.new
            Nginx.rputs [
              c.remote_ip, c.local_ip, c.local_port,
              v.proxy_protocol_addr.inspect, v.proxy_protocol_port.inspect,
              v.proxy_protocol_server_addr.inspect, v.proxy_protocol_server_port.inspect
            ].join("|")
        ';
    }
}
