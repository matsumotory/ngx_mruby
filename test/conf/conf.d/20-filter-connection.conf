# Group G2: Nginx::Filter#output, Nginx::Upstream#keepalive_cache= and
# Nginx::Connection. Port 58112 serves plain HTTP. Port 58113 listens with
# proxy_protocol and is driven by test/t/cases/_filter_connection_client.rb.
# The upstream names start with g2fc_ so that the prefix match in
# Nginx::Upstream.new does not hit upstreams from other files.

upstream g2fc_keepalive {
    server 127.0.0.1:58112;
    mruby_upstream_keepalive 4;
}

upstream g2fc_plain {
    server 127.0.0.1:58112;
}

upstream g2fc_set {
    server 127.0.0.1:58112;
    mruby_upstream_keepalive 3;
}

upstream g2fc_invalid {
    server 127.0.0.1:58112;
    mruby_upstream_keepalive 5;
}

upstream g2fc_persist {
    server 127.0.0.1:58112;
    mruby_upstream_keepalive 2;
}

upstream g2fc_proxy {
    server 127.0.0.1:58112;
    mruby_upstream_keepalive 2;
}

upstream g2fc_prefix_target {
    server 127.0.0.1:58112;
    mruby_upstream_keepalive 7;
}

server {
    listen 58112;

    # Origin for the proxied filter and upstream tests.
    location /g2fc/backend {
        mruby_content_handler_code 'Nginx.rputs "backend body"';
    }

    # Filter#output returns the byte length it stored, and a second call
    # replaces the body stored by the first call.
    location /g2fc/filter/output_return {
        return 200 "origin";
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            n = f.output "hello"
            f.output "#{f.body}|#{n}"
        ';
    }

    # The origin is an mruby content handler in the same location. The new
    # body here is longer than the origin body.
    location /g2fc/filter/output_rputs_origin {
        mruby_content_handler_code 'Nginx.rputs "origin"';
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            f.output "[#{f.body}] and more"
        ';
    }

    location /g2fc/filter/output_from_body {
        return 200 "origin";
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            f.output f.body.reverse + "!"
        ';
    }

    location /g2fc/filter/output_non_string {
        return 200 "origin";
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            f.output 12345
        ';
    }

    location /g2fc/filter/output_empty {
        return 200 "origin";
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            f.output ""
        ';
    }

    location /g2fc/filter/output_multibyte {
        return 200 "origin";
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            n = f.output "\xE3\x81\x82\xE3\x81\x84\xE3\x81\x86"
            f.output "#{f.body}|#{n}"
        ';
    }

    location /g2fc/filter/output_grow {
        return 200 "a";
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            f.output f.body * 10000
        ';
    }

    location /g2fc/filter/output_file {
        return 200 "origin";
        mruby_output_body_filter build/nginx/html/filter_connection_output.rb;
    }

    location /g2fc/filter/output_proxy {
        mruby_output_body_filter_code '
            f = Nginx::Filter.new
            f.output "proxied: #{f.body}"
        ';
        proxy_pass http://127.0.0.1:58112/g2fc/backend;
    }

    # Filter#body read outside a body filter returns an empty string.
    location /g2fc/filter/body_in_content {
        mruby_content_handler_code '
            Nginx.rputs Nginx::Filter.new.body.inspect
        ';
    }

    # Nginx::Upstream#keepalive_cache and keepalive_cache=
    location /g2fc/upstream/configured {
        mruby_content_handler_code '
            u = Nginx::Upstream.new "g2fc_keepalive"
            Nginx.rputs "#{u.keepalive_cache}|#{u.server}"
        ';
    }

    location /g2fc/upstream/no_directive {
        mruby_content_handler_code '
            u = Nginx::Upstream.new "g2fc_plain"
            Nginx.rputs u.keepalive_cache.to_s
        ';
    }

    location /g2fc/upstream/set {
        mruby_content_handler_code '
            u = Nginx::Upstream.new "g2fc_set"
            before = u.keepalive_cache
            ret = u.send(:keepalive_cache=, 9)
            min = u.send(:keepalive_cache=, 2)
            Nginx.rputs "#{before}|#{ret}|#{min}|#{u.keepalive_cache}"
        ';
    }

    location /g2fc/upstream/set_invalid {
        mruby_content_handler_code '
            u = Nginx::Upstream.new "g2fc_invalid"
            out = []
            [1, 0, -3].each do |v|
              begin
                u.keepalive_cache = v
                out << "accepted #{v}"
              rescue => e
                out << "#{e.class}: #{e.message}"
              end
            end
            out << u.keepalive_cache.to_s
            Nginx.rputs out.join("|")
        ';
    }

    location /g2fc/upstream/persist_set {
        mruby_content_handler_code '
            u = Nginx::Upstream.new "g2fc_persist"
            u.keepalive_cache = 6
            Nginx.rputs u.keepalive_cache.to_s
        ';
    }

    location /g2fc/upstream/persist_get {
        mruby_content_handler_code '
            Nginx.rputs Nginx::Upstream.new("g2fc_persist").keepalive_cache.to_s
        ';
    }

    location /g2fc/upstream/set_then_proxy {
        mruby_rewrite_handler_code '
            u = Nginx::Upstream.new "g2fc_proxy"
            u.keepalive_cache = 5
            Nginx::Request.new.headers_out["X-G2fc-Cache"] = u.keepalive_cache.to_s
            Nginx.return Nginx::DECLINED
        ';
        proxy_pass http://g2fc_proxy/g2fc/backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /g2fc/upstream/name_match {
        mruby_content_handler_code '
            a = Nginx::Upstream.new("g2fc_prefix").keepalive_cache
            b = Nginx::Upstream.new("G2FC_KEEPALIVE").keepalive_cache
            Nginx.rputs "#{a}|#{b}"
        ';
    }

    location /g2fc/upstream/unknown {
        mruby_content_handler_code '
            begin
              Nginx::Upstream.new "g2fc_nothing"
              Nginx.rputs "no error"
            rescue => e
              Nginx.rputs "#{e.class}: #{e.message}"
            end
        ';
    }

    # Nginx::Connection over plain HTTP
    location /g2fc/conn/info {
        mruby_content_handler_code '
            c = Nginx::Connection.new
            Nginx.rputs [c.remote_ip, c.local_ip, c.local_port, c.local_port.class, c.remote_port.class].join("|")
        ';
    }

    location /g2fc/conn/remote_port {
        mruby_content_handler_code 'Nginx.rputs Nginx::Connection.new.remote_port';
    }
}

server {
    listen 58113 proxy_protocol;

    location /g2fc/pp {
        mruby_content_handler_code '
            c = Nginx::Connection.new
            v = Nginx::Var.new
            Nginx.rputs [
              c.remote_ip, c.local_ip, c.local_port,
              v.proxy_protocol_addr.inspect, v.proxy_protocol_port.inspect,
              v.proxy_protocol_server_addr.inspect, v.proxy_protocol_server_port.inspect
            ].join("|")
        ';
    }
}
