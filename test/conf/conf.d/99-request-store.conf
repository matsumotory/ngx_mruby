# Nginx::Request#store, the Hash of a request that every handler of the
# request sees (section 2.1 of docs/proposals/core-alpha1.md).
# Cases: test/t/cases/request_store.rb. Port 18094.
#
# /redirect: an mruby_set handler and the access handler fill the store,
# the location has no content and answers 404, and error_page sends the
# request to @next, an internal redirect. The content handler, the header
# filter and the log handler of @next read the store there.
# /sub: the access handler fills the store of the main request, and the
# subrequest to /sub_leaf sees a store of its own, empty, and fills it.
# /stats: the gc_root counter of Nginx::Debug.stats, which counts the
# objects in the GC root holder; a store holds a slot until its request ends.
server {
    listen 18094;
    # the line of the log handler goes to a file of its own
    error_log logs/request_store.error.log notice;

    location = /redirect {
        mruby_set_code $request_store_set '
          Nginx::Request.new.store[:set] = "set"
        ';
        mruby_access_handler_code '
          store = Nginx::Request.new.store
          store[:key] = "from-access"
          store[:id] = store.object_id
        ';
        error_page 404 = @next;
    }

    location @next {
        mruby_content_handler_code '
          store = Nginx::Request.new.store
          Nginx.rputs "key=#{store[:key]} set=#{store[:set]} same=#{store[:id] == store.object_id}"
        ';
        mruby_output_header_filter_code '
          Nginx::Headers_out.new["X-Store"] = Nginx::Request.new.store[:key].to_s
        ';
        mruby_log_handler_code '
          Nginx.log Nginx::LOG_NOTICE, "request_store log: key=#{Nginx::Request.new.store[:key]}"
        ';
    }

    location = /sub {
        mruby_access_handler_code '
          Nginx::Request.new.store[:key] = "main"
        ';
        mruby_content_handler_code '
          res = Nginx::Async::HTTP.sub_request "/sub_leaf"
          Nginx.rputs "leaf=#{res.body} main=#{Nginx::Request.new.store[:key]}"
        ';
    }

    location = /sub_leaf {
        mruby_content_handler_code '
          r = Nginx::Request.new
          store = r.store
          Nginx.rputs "sub=#{r.sub_request?} empty=#{store.empty?}"
          store[:key] = "leaf"
        ';
    }

    location = /stats {
        mruby_content_handler_code '
          Nginx.rputs "gc_root=#{Nginx::Debug.stats[:gc_root]}"
        ';
    }
}
