# Calls the Uname class of the bundled mrbgem matsumotory/mruby-uname from a
# handler. The first call of a worker allocates the data object in which the
# gem keeps the result of uname(2), so this fails when the gem does not build
# or cannot allocate its object with the vendored mruby.
# Port 18128. The cases are in test/t/cases/gem_uname.rb.

server {
    listen 18128;

    location /gem_uname {
        mruby_content_handler_code '
            Nginx.rputs [Uname.sysname, Uname.nodename, Uname.release, Uname.version, Uname.machine].join("\n")
        ';
    }
}
