# A Request setter (the shared NGX_MRUBY_DEFINE_METHOD_NGX_SET_REQUEST_MEMBER_STR
# macro, here Nginx::Request#content_type=), Nginx::Async::HTTP.sub_request and
# Nginx::Headers_out#[]= raise TypeError for an argument that is not a String.
# Nginx::Headers_in#[] returns an Array when a header name is sent more than
# once; these locations read that value and pass it to each method so the
# cases can check the result.
# Cases: test/t/cases/type_unchecked_reads.rb. Port 18192.
server {
    listen 18192;

    # content_type= stands for the seven Request setters: they share one macro.
    location = /setter {
        mruby_content_handler_code '
          r = Nginx::Request.new
          v = r.headers_in["X-Dup"]
          begin
            r.content_type = v
            Nginx.rputs "ok"
          rescue => e
            Nginx.rputs "raised: #{e.class}: #{e.message}"
          end
        ';
    }

    # Headers_out#[]= with the header name taken from a header value.
    location = /headers_set {
        mruby_content_handler_code '
          r = Nginx::Request.new
          v = r.headers_in["X-Dup"]
          begin
            r.headers_out[v] = "x"
            Nginx.rputs "ok"
          rescue => e
            Nginx.rputs "raised: #{e.class}: #{e.message}"
          end
        ';
    }

    # Nginx::Async::HTTP.sub_request with the path taken from a header value.
    # Only the Array case is sent here: the path is read while the argument is
    # parsed, before any subrequest runs.
    location = /sub_request_path {
        mruby_content_handler_code '
          r = Nginx::Request.new
          v = r.headers_in["X-Dup"]
          begin
            Nginx::Async::HTTP.sub_request v
            Nginx.rputs "ok"
          rescue => e
            Nginx.rputs "raised: #{e.class}: #{e.message}"
          end
        ';
    }

    # Confirms the worker still answers after the cases above.
    location = /alive {
        mruby_content_handler_code 'Nginx.rputs "alive"';
    }
}
