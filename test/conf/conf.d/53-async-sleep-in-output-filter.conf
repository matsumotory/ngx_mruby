# Nginx::Async in the output filters.
# Cases: test/t/cases/async_sleep_in_output_filter.rb. Port 18131.
#
# A header filter runs inside ngx_http_send_header and a body filter inside
# ngx_http_output_filter. Both calls return to their caller with the result
# of the filter, so a filter cannot wait for a timer or a subrequest.
# Nginx::Async.sleep and Nginx::Async::HTTP.sub_request raise a RuntimeError
# in a filter, and a fiber that a filter suspends with Fiber.yield ends the
# filter with status 500. Each location sends its own response with return,
# and the filters belong to that location.
server {
    listen 18131;

    location /header_filter_sleep {
        return 200 "origin";
        mruby_output_header_filter_code 'Nginx::Async.sleep 100';
    }

    location /body_filter_sleep {
        return 200 "origin";
        mruby_output_body_filter_code '
          Nginx::Async.sleep 100
          Nginx::Filter.new.output "filtered"
        ';
    }

    location /header_filter_yield {
        return 200 "origin";
        mruby_output_header_filter_code 'Fiber.yield';
    }

    location /body_filter_yield {
        return 200 "origin";
        mruby_output_body_filter_code '
          Fiber.yield
          Nginx::Filter.new.output "filtered"
        ';
    }

    location /header_filter_sub_request {
        return 200 "origin";
        mruby_output_header_filter_code 'Nginx::Async::HTTP.sub_request "/filter_leaf"';
    }

    location /filter_leaf {
        return 200 "leaf";
    }
}
