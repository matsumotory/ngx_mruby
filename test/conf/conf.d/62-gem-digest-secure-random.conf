# Calls Digest, Digest::HMAC and SecureRandom from a handler. They come from
# the gems mrbgems/digest and mrbgems/secure-random of this repository, in
# place of iij/mruby-digest and monochromegane/mruby-secure-random. The
# scripts print one line per check, and a check that raises prints the
# exception class, so that a change shows as a changed line instead of a 500.
# /gem_digest compares the digests and HMACs with known values (FIPS 180,
# RFC 1321, RFC 2202 and RFC 4231). /gem_secure_random prints the lengths and
# the characters of the values, and their values, which the case compares
# between two requests.
# Port 18189. The cases are in test/t/cases/gem_digest_secure_random.rb.

server {
    listen 18189;

    location /gem_digest {
        set $gem_digest_file __NGXDOCROOT__gem_digest.txt;
        mruby_content_handler __NGXDOCROOT__gem_digest.rb;
    }

    location /gem_secure_random {
        mruby_content_handler __NGXDOCROOT__gem_secure_random.rb;
    }
}
