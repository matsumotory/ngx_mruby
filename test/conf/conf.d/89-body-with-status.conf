# A handler that writes output and then sets a status with Nginx.return.
# Cases: test/t/cases/body_with_status.rb. Hook script:
# test/html/body_with_status.rb, which writes the output and sets the status
# that the path of the request names. Port 18197.
#
# The output is sent with the status that the handler set after it, for
# every status from 200 up, in post_read, server rewrite, rewrite, access
# and content handlers and in subrequests. An error_page of the location
# for that status does not apply to the response, as for nginx's own
# "return 401 text". A status below 200 after output answers 500. The
# location /status_only shows the way back to nginx's page and its
# error_page: the status without output.
server {
    listen 18197;

    # Server-level handlers act only on their own paths.
    mruby_post_read_handler_code '
      if Nginx::Request.new.uri == "/post_read_403"
        Nginx.rputs %({"error":"post_read"})
        Nginx.return Nginx::HTTP_FORBIDDEN
      end
    ';
    mruby_server_rewrite_handler_code '
      if Nginx::Request.new.uri == "/server_rewrite_403"
        Nginx.rputs %({"error":"server rewrite"})
        Nginx.return Nginx::HTTP_FORBIDDEN
      end
    ';

    error_page 401 403 429 500 /error_page;

    location = /error_page {
        internal;
        return 200 "from error_page";
    }

    location = /content_401 {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /access_429 {
        mruby_access_handler build/nginx/html/body_with_status.rb;
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }

    location = /access_202 {
        mruby_access_handler build/nginx/html/body_with_status.rb;
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }

    location = /rewrite_403 {
        mruby_rewrite_handler build/nginx/html/body_with_status.rb;
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }

    location = /post_read_403 {
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }

    location = /server_rewrite_403 {
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }

    location = /moved {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /no_content {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /not_modified {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /switching_protocols {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /status_only {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    # A subrequest whose content handler writes output and sets 403, read by
    # its parent with Nginx::Async::HTTP.sub_request.
    location = /sub_target {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /sub_request {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/sub_target"
          res = Nginx::Async::HTTP.last_response
          Nginx.rputs "status:#{res.status} body:#{res.body}"
        ';
    }
}
