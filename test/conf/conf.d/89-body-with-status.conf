# A handler that writes output and then sets a status with Nginx.return.
# Cases: test/t/cases/body_with_status.rb. Hook script:
# test/html/body_with_status.rb, which writes the output and sets the status
# that the path of the request names. Port 18197.
#
# The output is sent with the status that the handler set before or after
# it, for every status from 200 up, in post_read, server rewrite, rewrite,
# access and content handlers and in subrequests, also after
# Nginx::Async::HTTP.sub_request resumed the handler. An error_page of the
# location for that status does not apply to the response, as for nginx's
# own "return 401 text". A status below 200 answers 500. The location
# /status_only shows the way back to nginx's page and its error_page: the
# status without output. The locations whose name starts with /before_ set
# the status before the first output.
server {
    listen 18197;

    # Server-level handlers act only on their own paths.
    mruby_post_read_handler_code '
      if Nginx::Request.new.uri == "/post_read_403"
        Nginx.rputs %({"error":"post_read"})
        Nginx.return Nginx::HTTP_FORBIDDEN
      end
    ';
    mruby_server_rewrite_handler_code '
      if Nginx::Request.new.uri == "/server_rewrite_403"
        Nginx.rputs %({"error":"server rewrite"})
        Nginx.return Nginx::HTTP_FORBIDDEN
      end
    ';

    error_page 401 403 429 500 /error_page;

    location = /error_page {
        internal;
        return 200 "from error_page";
    }

    location = /content_401 {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /access_429 {
        mruby_access_handler build/nginx/html/body_with_status.rb;
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }

    location = /access_202 {
        mruby_access_handler build/nginx/html/body_with_status.rb;
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }

    location = /rewrite_403 {
        mruby_rewrite_handler build/nginx/html/body_with_status.rb;
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }

    location = /post_read_403 {
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }

    location = /server_rewrite_403 {
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }

    location = /moved {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /no_content {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /not_modified {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /switching_protocols {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /status_only {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    # A subrequest whose content handler writes output and sets 403, read by
    # its parent with Nginx::Async::HTTP.sub_request.
    location = /sub_target {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /sub_request {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/sub_target"
          res = Nginx::Async::HTTP.last_response
          Nginx.rputs "status:#{res.status} body:#{res.body}"
        ';
    }

    location = /before_content_401 {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /before_access_429 {
        mruby_access_handler build/nginx/html/body_with_status.rb;
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }

    location = /before_rewrite_403 {
        mruby_rewrite_handler build/nginx/html/body_with_status.rb;
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }

    # 200 before the output in an access handler: Nginx.return logs that
    # the body is empty and keeps 500 as the result of a handler that
    # writes nothing, but the output that follows goes out with 200.
    location = /before_access_200 {
        mruby_access_handler build/nginx/html/body_with_status.rb;
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }

    location = /before_switching_protocols {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /before_then_after {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /before_sub_target {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /before_sub_request {
        mruby_rewrite_handler_code '
          Nginx::Async::HTTP.sub_request "/before_sub_target"
          res = Nginx::Async::HTTP.last_response
          Nginx.rputs "status:#{res.status} body:#{res.body}"
        ';
    }

    # Handlers that Nginx::Async::HTTP.sub_request resumes, with a
    # subrequest that answers 200.
    location = /sub_ok {
        mruby_content_handler_code 'Nginx.rputs "sub ok"';
    }

    location = /resumed_access_429 {
        mruby_access_handler_code '
          Nginx::Async::HTTP.sub_request "/sub_ok"
          Nginx.rputs "rate limited after #{Nginx::Async::HTTP.last_response.body}"
          Nginx.return Nginx::HTTP_TOO_MANY_REQUESTS
        ';
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }

    location = /resumed_content_301 {
        mruby_content_handler_code '
          Nginx::Async::HTTP.sub_request "/sub_ok"
          Nginx.rputs "moved after #{Nginx::Async::HTTP.last_response.body}"
          Nginx.return Nginx::HTTP_MOVED_PERMANENTLY
        ';
    }

    # Nginx::HTTP_CLOSE (444) with output, before or after it: the output
    # is not sent, and nginx closes the connection without a response
    # (decision 7 of docs/proposals/core-alpha1.md).
    location = /close_after_output {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    location = /access_close_after_output {
        mruby_access_handler build/nginx/html/body_with_status.rb;
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }

    location = /before_close {
        mruby_content_handler build/nginx/html/body_with_status.rb;
    }

    # The status of the output is the one that the handler that ends set:
    # not one that an earlier handler set before its own output and then
    # declined (its rputs chain stays in the module context), and not one
    # that Nginx.redirect with a URL replaced after the output.
    location = /earlier_status_declined {
        mruby_access_handler_code '
          Nginx.return Nginx::HTTP_FORBIDDEN
          Nginx.rputs "a-"
          Nginx.return Nginx::DECLINED
        ';
        mruby_content_handler_code 'Nginx.rputs "b"';
    }

    location = /later_status_after_declined {
        mruby_access_handler_code '
          Nginx.rputs "a-"
          Nginx.return Nginx::DECLINED
        ';
        mruby_content_handler_code '
          Nginx.return Nginx::HTTP_FORBIDDEN
          Nginx.rputs "b"
        ';
    }

    location = /status_then_url_redirect {
        mruby_content_handler_code '
          Nginx.return Nginx::HTTP_FORBIDDEN
          Nginx.rputs "x"
          Nginx.redirect "http://example.com/"
        ';
    }

    location = /before_resumed_rewrite_403 {
        mruby_rewrite_handler_code '
          Nginx.status_code = Nginx::HTTP_FORBIDDEN
          Nginx::Async::HTTP.sub_request "/sub_ok"
          Nginx.rputs "forbidden after #{Nginx::Async::HTTP.last_response.body}"
        ';
        mruby_content_handler_code 'Nginx.rputs "content handler"';
    }
}
