# The auto-ssl mrbgem: Nginx::SSL::ACME::Dehydrated and
# Nginx::SSL::ACME::Client. Tested by test/t/cases/auto_ssl.rb, which runs
# only with the services of test/auto_ssl/deps.sh (see "Testing the auto-ssl
# mrbgem" in docs/test/README.md). The handlers connect to Redis on
# 127.0.0.1:6379 when a request comes, not at startup, so this fragment
# changes nothing in a run without those services.

# The methods called one by one, with the values they return.
server {
    listen 127.0.0.1:18171;
    server_name localhost;

    # Whether the build has the gem: it is in the default build of master
    # and opt-in on next.
    location = /auto-ssl/built {
        mruby_content_handler_code 'Nginx.rputs Nginx::SSL.const_defined?(:ACME).to_s';
    }

    location = /auto-ssl/client/allow_domain {
        mruby_content_handler_code '
          r = Nginx::Request.new
          acme = Nginx::SSL::ACME::Client.new "http://127.0.0.1:18173/", r.var.arg_domain, nil, false, %w(client.autossl.test)
          Nginx.rputs acme.allow_domain?.inspect
        ';
    }

    # Calls #private_key twice and returns whether both calls returned the
    # same object, then the key in PEM.
    location = /auto-ssl/client/private_key {
        mruby_content_handler_code '
          redis = Redis.new "127.0.0.1", 6379
          acme = Nginx::SSL::ACME::Client.new "http://127.0.0.1:18173/", "client.autossl.test", redis
          key = acme.private_key
          Nginx.rputs "#{key.equal?(acme.private_key)}\n#{key.to_pem}"
          redis.close
        ';
    }

    # #client builds an Acme::Client that reads the ACME v1 directory of the
    # endpoint, which the nginx of test/auto_ssl/peer.conf serves.
    location = /auto-ssl/client/client {
        mruby_content_handler_code '
          redis = Redis.new "127.0.0.1", 6379
          acme = Nginx::SSL::ACME::Client.new "http://127.0.0.1:18173/", "client.autossl.test", redis
          c = acme.client
          endpoints = c.operation_endpoints.keys.sort.map { |k| "#{k}=#{c.operation_endpoints[k]}" }.join(",")
          Nginx.rputs [c.class.to_s, c.endpoint, c.private_key.equal?(acme.private_key).to_s, endpoints].join("|")
          redis.close
        ';
    }

    location = /auto-ssl/client/clear {
        mruby_content_handler_code '
          redis = Redis.new "127.0.0.1", 6379
          Nginx::SSL::ACME::Client.new("http://127.0.0.1:18173/", "client.autossl.test", redis).clear
          Nginx.rputs "cleared"
          redis.close
        ';
    }

    location = /auto-ssl/dehydrated/allow_domain {
        mruby_content_handler_code '
          r = Nginx::Request.new
          acme = Nginx::SSL::ACME::Dehydrated.new r.var.arg_domain, {}, %w(dehydrated.autossl.test)
          Nginx.rputs acme.allow_domain?.inspect
        ';
    }

    # The class methods that read the request of a dehydrated hook.
    location = /auto-ssl/dehydrated/hook_request {
        mruby_enable_read_request_body on;
        mruby_content_handler_code '
          r = Nginx::Request.new
          d = Nginx::SSL::ACME::Dehydrated
          Nginx.rputs [d.secret_token(r), d.challenged_domain(r), d.challenged_token_filename(r), d.challenged_token_value(r)].inspect
        ';
    }

    location = /auto-ssl/dehydrated/deploy_cert_information {
        mruby_enable_read_request_body on;
        mruby_content_handler_code '
          info = Nginx::SSL::ACME::Dehydrated.deploy_cert_information Nginx::Request.new
          Nginx.rputs [info.keys.map { |k| k.to_s }.sort.inspect, info[:domain], info[:key], info[:crt]].inspect
        ';
    }

    location ^~ /.well-known/acme-challenge/ {
        mruby_content_handler_code '
          Nginx.rputs Nginx::SSL::ACME::Dehydrated.token_filename_from_url(Nginx::Request.new).inspect
        ';
    }
}

# A TLS server that gets its certificate with dehydrated during the
# handshake, as test/conf/auto-ssl/nginx.conf.dehydrated_example does. The
# hook server and the challenge server are those of test/auto_ssl/peer.conf,
# in the second nginx that the case starts; the case writes dehydrated,
# its configuration and the hook under NGINX_INSTALL_DIR/auto_ssl/. For
# eab.autossl.test, dehydrated uses the second Pebble of
# test/auto_ssl/deps.sh, where every account registration fails.
server {
    listen 127.0.0.1:18172 ssl;
    server_name _;
    ssl_certificate     __NGXDOCROOT__/dummy.crt;
    ssl_certificate_key __NGXDOCROOT__/dummy.key;

    mruby_ssl_handshake_handler_code '
      ssl = Nginx::SSL.new
      domain = ssl.servername
      opts = {
        bin: "__NGXDOCROOT__../auto_ssl/dehydrated",
        conf: domain == "eab.autossl.test" ? "__NGXDOCROOT__../auto_ssl/dehydrated-eab.conf" : "__NGXDOCROOT__../auto_ssl/dehydrated.conf",
        hook: "__NGXDOCROOT__../auto_ssl/hook.sh",
        secret_token: "auto-ssl-test-secret",
      }
      acme = Nginx::SSL::ACME::Dehydrated.new domain, opts, %w(dehydrated.autossl.test eab.autossl.test)

      raise "not allowed servername: #{domain}" unless acme.allow_domain?

      redis = Redis.new "127.0.0.1", 6379
      if redis["#{domain}.crt"].nil? or redis["#{domain}.key"].nil?
        acme.auto_cert_deploy
      end

      ssl.certificate_data = redis["#{domain}.crt"]
      ssl.certificate_key_data = redis["#{domain}.key"]
      redis.close
    ';

    location / {
        mruby_content_handler_code 'Nginx.rputs "hello #{Nginx::Request.new.hostname} from auto-ssl"';
    }
}
