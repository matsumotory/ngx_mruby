# The http {} and stream {} blocks of the nginx with a master process and
# two worker processes that test/t/cases/_workers.rb starts in the mode
# "reload". Case: test/t/cases/workers.rb. Ports 18181 (http) and 12379
# (stream). This file is not in conf.d/, so the test nginx of test.sh does
# not include it.
#
# _workers.rb writes the configuration with __GENERATION__ replaced by 1,
# and before the reload by 2. __PREFIX__ is the prefix of that nginx, where
# _workers.rb writes script.rb (read by /script) and, to end the sleeps of
# /sleep and of the stream server, the file "release". The sleeps wait for
# that file instead of for a fixed time, so that they are still in flight
# when the old workers shut down, however long the reload takes (under
# valgrind, the master reads the configuration for seconds).
http {
    access_log off;

    server {
        listen 127.0.0.1:18181;

        location /generation {
            mruby_content_handler_code 'Nginx.rputs "generation __GENERATION__ pid=#{Nginx::Var.new.pid}"';
        }

        location /script {
            mruby_content_handler __PREFIX__script.rb cache;
        }

        # At most 1200 sleeps of 50 ms (60 seconds).
        location /sleep {
            mruby_content_handler_code '
              pid = Nginx::Var.new.pid
              Nginx.log Nginx::LOG_NOTICE, "workers reload: http sleep started"
              n = 0
              while n < 1200 && !File.exist?("__PREFIX__release")
                Nginx::Async.sleep 50
                n += 1
              end
              Nginx.log Nginx::LOG_NOTICE, "workers reload: http sleep resumed"
              Nginx.rputs "generation __GENERATION__ pid=#{pid} released=#{File.exist?("__PREFIX__release")}"
            ';
        }
    }
}

stream {
    server {
        listen 127.0.0.1:12379;

        mruby_stream_code '
          Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "workers reload: stream sleep started"
          n = 0
          while n < 1200 && !File.exist?("__PREFIX__release")
            Nginx::Stream::Async.sleep 50
            n += 1
          end
          Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "workers reload: stream sleep resumed"
        ';
        return "stream generation __GENERATION__";
    }
}
