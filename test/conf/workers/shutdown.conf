# The http {} and stream {} blocks of the nginx with a master process and
# one worker process that test/t/cases/_workers.rb starts in the mode
# "shutdown". Case: test/t/cases/workers.rb. Ports 18185 (http, which
# _workers.rb probes to see that nginx listens) and 12393 (stream). This
# file is not in conf.d/, so the test nginx of test.sh does not include it.
#
# The handler of /sleep and the stream code log a line when they start and
# sleep for up to 10 seconds, much longer than worker_shutdown_timeout. After a reload, the old
# worker shuts down, and when the timeout expires nginx sets c->close on the
# session and calls its read handler: the handler ends the wait and the
# session, so the old worker exits after the timeout, and the code does not
# run a second time.
worker_shutdown_timeout 1s;

http {
    access_log off;

    server {
        listen 127.0.0.1:18185;

        location /generation {
            mruby_content_handler_code 'Nginx.rputs "generation __GENERATION__"';
        }

        # At most 200 sleeps of 50 ms (10 seconds). nginx terminates the
        # request when worker_shutdown_timeout expires, and the request
        # cleanup drops the fiber.
        location /sleep {
            mruby_content_handler_code '
              Nginx.log Nginx::LOG_NOTICE, "workers shutdown: http sleep started"
              n = 0
              while n < 200
                Nginx::Async.sleep 50
                n += 1
              end
              Nginx.log Nginx::LOG_NOTICE, "workers shutdown: http sleep resumed"
              Nginx.rputs "slept"
            ';
        }
    }
}

stream {
    server {
        listen 127.0.0.1:12393;

        mruby_stream_code '
          Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "workers shutdown: stream sleep started"
          n = 0
          while n < 200
            Nginx::Stream::Async.sleep 50
            n += 1
          end
          Nginx::Stream.log Nginx::Stream::LOG_NOTICE, "workers shutdown: stream sleep resumed"
        ';
        return "stream generation __GENERATION__";
    }
}
