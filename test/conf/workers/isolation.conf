# The http {} block of the nginx with a master process and four worker
# processes that test/t/cases/_workers.rb starts in the mode "isolation".
# Case: test/t/cases/workers.rb. Port 18180. This file is not in conf.d/,
# so the test nginx of test.sh does not include it.
#
# Each worker has its own mrb_state, and the requests of one worker share
# it. Every handler of /worker counts its runs in a global variable of the
# state, so the counts of a worker go up by one with each of its requests,
# and the counts of another worker start again at 1. reuseport gives each
# worker a listening socket of its own, and the kernel spreads the
# connections over them by the address and port of the client, so that
# the connections of the case reach every worker.
http {
    access_log off;

    server {
        listen 127.0.0.1:18180 reuseport;

        location /worker {
            mruby_set_code $mruby_sets '$sets = ($sets || 0) + 1; $sets.to_s';
            mruby_rewrite_handler_code '
              $rewrites = ($rewrites || 0) + 1
              Nginx.return Nginx::DECLINED
            ';
            mruby_access_handler_code '
              $accesses = ($accesses || 0) + 1
              Nginx.return Nginx::DECLINED
            ';
            mruby_content_handler_code '
              $contents = ($contents || 0) + 1
              v = Nginx::Var.new
              h = {}
              20.times { |i| h["k#{i}"] = i * 2 }
              Nginx.rputs "pid=#{v.pid} set=#{v.mruby_sets} rewrite=#{$rewrites} access=#{$accesses} content=#{$contents} work=#{h.values.inject(:+)}"
            ';
        }
    }
}
