name: nginx-tests

# nginx's own test suite (https://github.com/nginx/nginx-tests) against nginx
# built with ngx_mruby, as test.sh builds it, and against nginx of the same
# version and configure options without ngx_mruby ("nginx-tests" in
# docs/test/README.md). The job records the results in its summary and in
# the artifact nginx-tests. It fails when a test file fails on nginx with
# ngx_mruby and not on nginx without it, and when a build, the fetch of the
# suite or prove itself fails; a file that fails on both builds does not
# fail it. The required check ci-ok (test.yml) does not need it.
#
# Pull requests do not run it. The author of a change of an input of the
# nginx binary (test/ci/changes.sh gives code true), of test.sh or of
# test/nginx-tests/ runs test/nginx-tests/run.sh locally, in a Linux
# container on macOS, before marking the pull request ready, and quotes
# the result under "How was this tested" ("Build and test" in AGENTS.md).
# This workflow is the nightly run of the tip of next, and runs only on
# "Run workflow" (gh workflow run nginx-tests.yml --ref next): GitHub runs
# a schedule only from the workflow files on the default branch, master,
# which does not have this file. nginx-tests-nightly.yml on master starts
# it on next every day at 19:23 UTC (04:23 JST), waits for the run and
# fails when that run fails, as valgrind-nightly.yml on master starts the
# nightly runs of test.yml.
on:
  workflow_dispatch:

# One run at a time per branch; a second one waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  nginx-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build packages of the soak job, and the perl modules and the
      # daemon that the test files of nginx-tests look for: a test file
      # whose module or daemon is missing is skipped, not failed.
      - name: install
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install rake bison git gperf zlib1g-dev libpcre3-dev libssl-dev ruby \
            libio-socket-ssl-perl libnet-ssleay-perl libfcgi-perl libscgi-perl \
            libcache-memcached-perl libcache-memcached-fast-perl libprotocol-websocket-perl memcached
          perl -v | sed -n 2p
          prove --version
      # results.pl and compare.pl on the output of prove for the small test
      # files of test/nginx-tests/self-test/, so that a change of them that
      # misreads a result fails here.
      - name: Check the reading of the results
        run: sh test/nginx-tests/self-test.sh
      - name: nginx-tests
        run: sh test/nginx-tests/run.sh
      - name: Write the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -s build_nginxtests/summary.md ]; then
            cat build_nginxtests/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=nginx-tests::build_nginxtests/summary.md is missing: the run stopped before the results were compared (see the step above)"
            exit 1
          fi
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nginx-tests
          path: |
            build_nginxtests/summary.md
            build_nginxtests/*.txt
            build_nginxtests/mruby
            build_nginxtests/plain/*.log
            build_nginxtests/plain/*.txt
            build_nginxtests/plain/*.tsv
          if-no-files-found: ignore
