name: site

# The ngx.mruby.org site (docs/proposals/site.md, 5.3 and steps 1 to 7 of
# section 6): build site/ and docs/ from a fresh clone, and the 2.x pages
# under /v2/ from docs/ of master, run the checks of steps 1 to 6, and
# upload the built site and the screenshots of step 3 as workflow
# artifacts. On next (a push, or a workflow_dispatch such as the one
# that site-dispatch.yml on master starts after every push there),
# the deploy job publishes the built site to GitHub Pages at
# https://ngx.mruby.org/ once every check has passed (step 7). Pull requests
# never deploy. The Pages settings of 5.3 (the source "GitHub Actions", and
# the github-pages environment limited to next) are the owner's; "The site"
# in AGENTS.md lists them.
#
# Pull requests run it when they touch site/, docs/ or this file. Every push
# to next runs it: docs/ links to files outside docs/ and site/, and a link
# to a file that git no longer tracks stops the build, so a merge that
# removes or renames such a file fails here, on that merge, and not on the
# next pull request that touches docs/.
#
# Every push to master starts it on next through site-dispatch.yml of
# master (workflow_dispatch), so that /v2/ is built again from the new
# docs/ of master. Every pull request to master runs site-v2.yml of
# master, which builds the same site with the pull request's docs/.
on:
  pull_request:
    branches:
      - next
    paths:
      - 'site/**'
      - 'docs/**'
      - 'examples/**'
      - 'test/**'
      - 'src/**'
      - 'build_config.rb'
      - '**.md'
      - '.github/workflows/site.yml'
  push:
    branches:
      - next
  workflow_dispatch:
    inputs:
      measure_scope:
        description: 'Measure full vs two-page style checks on the same artifact (no deploy off next)'
        type: boolean
        default: false

# A new push to a pull request cancels the run for its previous commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      site_revision: ${{ steps.versions.outputs.site_revision }}
      v2_revision: ${{ steps.versions.outputs.v2_revision }}
      browser_mode: ${{ steps.scope.outputs.mode }}
      measure_scope: ${{ steps.scope.outputs.measure_scope }}
    steps:
      # The whole history: the last-updated date of each page is the date of
      # the last commit that changed its source (git log).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Step 6: the 2.x pages under /v2/ are built from docs/ of master,
      # with its whole history for their last-updated dates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: master
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact source revisions
        id: versions
        run: |
          echo "site_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "v2_revision=$(git -C master rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The Node.js version of site/.node-version. No npm cache: npm ci
      # takes about 20 seconds without one.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      # Check: a fresh clone builds with npm ci and npm run build. The clone
      # of the checked-out commit (for a pull request, its merge commit), in
      # $RUNNER_TEMP/fresh, is the build that the other checks read and that
      # the artifact holds.
      - name: Build a fresh clone with npm ci --ignore-scripts and npm run build
        id: build
        run: sh site/scripts/check-fresh-clone.sh --keep "$RUNNER_TEMP/fresh"
      # Check of step 2: the build succeeds with network access blocked after
      # npm ci (4.4). It builds dist/ again in the clone, so the checks
      # below and the artifact read a build made without network.
      - name: Build again with network access blocked
        id: offline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: sh scripts/check-offline-build.sh
      # Step 6: the 2.x pages, built from docs/ of master into dist/v2/
      # with their own search index, after the 3.x build above, whose
      # index stays without them (scripts/build-v2.mjs).
      - name: Build the 2.x pages under /v2/ from docs/ of master
        id: v2
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: node scripts/build-v2.mjs --tree "$GITHUB_WORKSPACE/master"
      - name: Test the generator fixtures and release-state classification
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: npm test
      - name: Check complete Markdown exports, source metadata and release context
        if: ${{ !cancelled() && steps.v2.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: node scripts/check-docs-export.mjs
      # Step 4: the relative links and the heading anchors of the Markdown
      # files that git tracks, outside the vendored trees, as GitHub shows
      # them.
      - name: Check the relative links and anchors of the Markdown files
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh
        run: git ls-files -z -- '*.md' ':!:mruby/' ':!:dependence/' | xargs -0 python3 site/scripts/check_links.py .
      # With the 2.x pages: no broken link under /v2/ (step 6).
      - name: Check that every internal link of the built HTML resolves, under /v2/ too
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: node scripts/check-built-links.mjs
      - name: Check that every page has a title and the last-updated date of its source
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: node scripts/check-pages.mjs
      # Steps 1 and 5: the translations and the notices of the pages under
      # /ja/ that show an English page, lang and hreflang on every page,
      # no space between Japanese and Latin text in the Japanese sources,
      # the code blocks of the English pages, no "wbr" in titles, ids and
      # navigation, and the labels of the diagrams under /ja/.
      - name: Check the Japanese pages (translations, notices, lang and hreflang, spaces, code blocks, wbr, diagram labels)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: node scripts/check-japanese.mjs
      - name: Check that pages read with JavaScript off
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: node scripts/check-no-js.mjs
      - name: Check the color tokens of tokens.css (palette A and the code colors)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: python3 scripts/contrast.py
      - name: Check the built CSS (hex colors, text-wrap, keep-all, transitions, terminal frames, external fonts)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: node scripts/check-css.mjs
      # Step 3: the home pages show the files that the example's case
      # compares, with their date, and no benchmark or performance figure.
      - name: Check the home pages (the example's files and date, no performance figure)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: node scripts/check-home.mjs
      # Step 3: the drawings and the source lines of the diagrams; the
      # diagrams whose lines changed since their commit go to the summary.
      - name: Check the diagrams (drawings, source files and lines; changed lines in the summary)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: node scripts/check-diagrams.mjs
      # Step 4: every sample block of the pages names a case and files that
      # exist, and every use case of docs/use_case/ has a sample or the
      # reason why it has none.
      - name: Check the samples and the use cases
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: node scripts/check-samples.mjs
      # Step 4: every directive of the ngx_command_t tables has a section
      # in the directive reference, mruby_output_filter appears only in
      # removal notes, and the default mrbgems of the build reference are
      # those of build_config.rb.
      - name: Check the reference (directives, removed directives, default mrbgems)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: node scripts/check-reference.mjs
      # Step 7: the Google verification file of the old site at its URL,
      # with the 54 bytes of the gh-pages copy (Q5), and no analytics
      # script and no script from another host in the built site (Q6).
      - name: Check the files kept from the old site and that no analytics script is built
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: node scripts/check-deploy.mjs
      # Step 4: every Ruby block of the pages compiles with the mrbc of the
      # bundled mruby, built alone (about ten seconds).
      - name: Build mrbc from the bundled mruby
        id: mrbc
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/mruby
        run: |
          command -v rake > /dev/null || { sudo apt-get -qq update && sudo apt-get -qq install rake; }
          MRUBY_CONFIG=build_config/mrbc.rb MRUBY_BUILD_DIR="$RUNNER_TEMP/mrbc" rake -j4
      - name: Check that every Ruby block of the pages compiles with mrbc
        if: ${{ !cancelled() && steps.mrbc.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/fresh/site
        run: node scripts/check-ruby-blocks.mjs --mrbc "$RUNNER_TEMP/mrbc/host/bin/mrbc"
      - name: Check all version metadata, banners and links without a browser
        working-directory: ${{ runner.temp }}/fresh/site
        run: node scripts/check-v2.mjs --no-browser
      - name: Test the browser scope and lane contracts
        working-directory: ${{ runner.temp }}/fresh/site
        run: |
          node scripts/test-ci-scope.mjs
          node scripts/test-ci-browser.mjs
          node scripts/test-ci-integration.mjs
      - name: Plan browser coverage from the verified diff
        id: scope
        working-directory: ${{ runner.temp }}/fresh/site
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-plan.mjs
      - name: Bind generated manifests and output to this exact run
        working-directory: ${{ runner.temp }}/fresh/site
        env:
          V2_REVISION: ${{ steps.versions.outputs.v2_revision }}
        run: |
          node scripts/ci-artifact.mjs --write
          tar -czf "$RUNNER_TEMP/site-validation.tar.gz" dist generated/pages.json generated/pages-v2.json generated/ci-scope.json generated/ci-identity.json
      - name: Upload the same-run browser input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-validation
          path: ${{ runner.temp }}/site-validation.tar.gz
          if-no-files-found: error
      - name: Upload the built site
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ runner.temp }}/fresh/site/dist
          if-no-files-found: error
      # The artifact that the deploy job publishes, uploaded on every run so
      # that pull requests exercise the step. Without an if, it runs only
      # when every step above passed, so a failed check never reaches the
      # deploy job.
      - name: Upload the built site for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/fresh/site/dist

  # Independent suites consume one exact build; matrix fail-fast is disabled
  # so all relevant evidence survives a failure in another lane.
  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [styles-chromium, styles-webkit, interaction, japanese, accessibility, screenshots]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-validation
          path: ${{ runner.temp }}/site-validation
          digest-mismatch: error
      - name: Read the same-run build and verify exact source identity
        working-directory: site
        env:
          V2_REVISION: ${{ needs.build.outputs.v2_revision }}
        run: |
          tar -xzf "$RUNNER_TEMP/site-validation/site-validation.tar.gz"
          node scripts/ci-artifact.mjs
      - name: Install locked browser tools for selected checks
        if: ${{ needs.build.outputs.browser_mode != 'none' }}
        working-directory: site
        env:
          LANE: ${{ matrix.lane }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          case "$LANE" in
            styles-chromium) npx playwright install --with-deps chromium ;;
            styles-webkit) npx playwright install --with-deps webkit ;;
            *) npx playwright install --with-deps chromium webkit ;;
          esac
      - name: Run selected browser suite
        working-directory: site
        env:
          LANE: ${{ matrix.lane }}
          MEASURE_SCOPE: ${{ (inputs.measure_scope || needs.build.outputs.measure_scope == 'true') && matrix.lane == 'styles-chromium' }}
        run: node scripts/ci-browser.mjs "$LANE"
      - name: Keep screenshots, including partial evidence on failure
        if: ${{ !cancelled() && matrix.lane == 'screenshots' && needs.build.outputs.browser_mode != 'none' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: site/build-screenshots
          if-no-files-found: error

  maintenance-lines:
    name: Check maintenance and read-only publication evidence
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-validation
          path: ${{ runner.temp }}/maintenance-validation
          digest-mismatch: error
      - name: Match both artifact revisions to the build checkouts
        working-directory: site
        env:
          SITE_REVISION: ${{ needs.build.outputs.site_revision }}
          V2_REVISION: ${{ needs.build.outputs.v2_revision }}
          CHECKOUT_REVISION: ${{ github.sha }}
        run: |
          tar -xzf "$RUNNER_TEMP/maintenance-validation/site-validation.tar.gz"
          node scripts/ci-artifact.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          assert.equal(process.env.SITE_REVISION, process.env.CHECKOUT_REVISION);
          for (const [file, expected] of [
            ['dist/docs-index.json', process.env.SITE_REVISION],
            ['dist/v2/docs-index.json', process.env.V2_REVISION],
          ]) {
            assert.match(expected, /^[0-9a-f]{40}$/);
            const index = JSON.parse(fs.readFileSync(file, 'utf8'));
            assert.equal(index.source_revision, expected, file);
            assert.equal(index.working_tree_clean, true, file);
          }
          console.log(`maintenance-lines: exact clean artifacts ${process.env.SITE_REVISION} / ${process.env.V2_REVISION}`);
          JS
      - name: Install the locked browser tools
        working-directory: site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Check the Japanese maintenance entry lines in Chromium and WebKit
        working-directory: site
        run: |
          node scripts/test-read-only-browser.mjs
          node scripts/screenshots-live.mjs --local --out build-screenshots/predeploy-smoke
          node scripts/check-japanese-lines.mjs --pages /v2/ja/
      - name: Check all maintenance code surfaces and both search indexes
        working-directory: site
        run: |
          SITE_CI_VERSION=2 node scripts/check-code-layout.mjs
          node scripts/check-v2.mjs
          node scripts/check-search-identifiers.mjs

      - name: Upload predeploy read-only smoke evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: predeploy-smoke
          path: site/build-screenshots/predeploy-smoke
          if-no-files-found: warn

  site-ok:
    needs: [build, browser, maintenance-lines]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected suite and its exact build
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          MAINTENANCE_RESULT: ${{ needs.maintenance-lines.result }}
        run: node site/scripts/ci-browser.mjs --gate

  # Step 7: publish the artifact of the build job to GitHub Pages. It runs
  # only in this repository (not in forks), only on next, never for a pull request (github.ref is then
  # refs/pull/...), and only after the build job and all its checks passed.
  # The github-pages environment allows deployments from next only
  # (setting 2 of 5.3), so a workflow pushed on another branch cannot
  # publish the site even if it names the environment.
  deploy:
    name: Deploy to GitHub Pages
    needs: [build, site-ok]
    if: ${{ github.repository == 'matsumotory/ngx_mruby' && github.ref == 'refs/heads/next' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One deployment at a time; a newer run waits instead of cancelling one
    # that is publishing.
    concurrency:
      group: pages
      cancel-in-progress: false
    # The permissions that actions/deploy-pages names (its README,
    # "Security considerations"): pages to create the deployment, id-token
    # for the OIDC token that proves the run to Pages.
    permissions:
      pages: write # create the Pages deployment
      id-token: write # request the OIDC token for the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Reads the Pages settings; the origin must be the custom domain over
      # https (setting 1 of 5.3), or the deployment would publish the site
      # at another address.
      - name: Read the Pages settings
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Check that Pages serves https://ngx.mruby.org
        env:
          ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          if [ "$ORIGIN" != 'https://ngx.mruby.org' ]; then
            echo "::error::GitHub Pages reports the origin '$ORIGIN', not https://ngx.mruby.org: check the custom domain and Enforce HTTPS in the Pages settings"
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Read-only acceptance of the artifact just published above. No token or
  # new permission is needed: the GitHub metadata is public, and artifact
  # download is limited to this workflow run. Fail closed on unavailable
  # evidence, a concurrent different deployment, or mismatched public bytes.
  verify-live:
    name: Verify the published site
    needs: [build, deploy]
    if: ${{ github.repository == 'matsumotory/ngx_mruby' && github.ref == 'refs/heads/next' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: site/dist
          digest-mismatch: error
      - name: Install the locked verification tools
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Match artifact SHA, deployment SHA and the public deployment policy
        working-directory: site
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/check-public-deployment.mjs --sha "$EXPECTED_SHA"
      - name: Check published bytes, HTTPS redirect, retained file and live Lighthouse
        working-directory: site
        # GitHub evidence was checked above through the unauthenticated public API.
        # The existing live HTTP and Lighthouse checks remain unchanged.
        run: node scripts/check-live.mjs --no-gh
      - name: Capture the actual desktop and mobile reader journeys
        working-directory: site
        run: node scripts/screenshots-live.mjs --out live-screenshots
      - name: Keep live evidence, including partial screenshots on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-screenshots
          path: site/live-screenshots
          if-no-files-found: warn
