name: test

# Pushes to topic branches (claude/*, backport/*, ...) do not run here:
# they are tested through their pull request, so the matrix runs once.
# Use "Run workflow" (workflow_dispatch) to test a branch without a PR.
#
# valgrind (docs/test/README.md, "valgrind in CI"): on pull requests and
# pushes, one cell of the build matrix runs nginx under valgrind and the
# others run it directly. A manual run with the input "valgrind" runs every
# cell under valgrind except the sanitizer cell; the nightly run that
# .github/workflows/valgrind-nightly.yml starts is such a run. A cell under
# valgrind fails when valgrind reports an error, or a leak that
# test/valgrind.supp does not suppress.
on:
  push:
    branches:
      - master
      - next
      - 'v*.x'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - next
      - 'v*.x'
  workflow_dispatch:
    inputs:
      valgrind:
        description: 'Run every cell of the build matrix under valgrind (the nightly run)'
        type: boolean
        default: false

# A new push to a pull request cancels the run for its previous commit.
# Runs for branch and tag pushes are not cancelled once started; a newer
# push to the same ref waits for them (only the newest waiting run is kept).
# A run with every cell under valgrind has a group of its own, so that it
# and a push to the same branch do not replace each other while waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.valgrind && '-valgrind' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  OPENSSL_SRC_VERSION: 1.1.1w

jobs:
  # Files that do not belong in the repository (docs/test/README.md, "Files
  # that do not belong in the repository"): test/check_added_files.sh fails
  # when the change, or one of its commits, adds a path that
  # test/forbidden_paths.txt forbids, or when the change adds an empty file.
  # A pull request is checked on its merge commit against the base it was
  # merged into, and on its own commits; a push to a branch from the
  # previous tip to the pushed commit.
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The whole history (all branches; about 13 MB in October 2026): only
      # the full history tells which commits of the pull request the base
      # does not have yet. No later step needs the token that actions/checkout
      # would keep (persist-credentials): the fetch of the previous tip of a
      # push reads the public repository without it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the added files
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # A tag push, a push that creates a branch (its previous tip is
          # the zero id) and a manual run have no range of commits to check,
          # and pass, so that ci-ok can require this job on every event.
          if [ "${EVENT_NAME}" = pull_request ]; then
            # The checkout is the merge commit of the pull request
            # (refs/pull/N/merge): its first parent is the base branch it
            # was merged into, its second parent the head of the pull
            # request. The merge commit against its first parent leaves out
            # what the base changed after the branch was created, and the
            # commits from the head back to the base are the pull request's
            # own.
            if ! base=$(git rev-parse --verify --quiet 'HEAD^1') || ! tip=$(git rev-parse --verify --quiet 'HEAD^2'); then
              echo "::error title=files::the checkout is not the merge commit of a pull request"
              exit 1
            fi
            head=$(git rev-parse HEAD)
          elif [ "${EVENT_NAME}" = push ] && [ "${REF_TYPE}" = branch ] && [[ ! "${PUSH_BEFORE}" =~ ^0+$ ]]; then
            base=${PUSH_BEFORE}
            head=${PUSH_SHA}
            tip=${PUSH_SHA}
            # The previous tip of a push that is not a fast-forward is not
            # in the history of any branch that the checkout fetched.
            if [ -n "${base}" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "${base}"
            fi
          else
            echo "nothing to check: event ${EVENT_NAME}, ref type ${REF_TYPE}, previous tip '${PUSH_BEFORE}'"
            exit 0
          fi
          echo "base: ${base}, head: ${head}, commits: ${base}..${tip}"
          if ! sh test/check_added_files.sh "${base}" "${head}" "${tip}"; then
            echo "::error title=files::the change adds files that do not belong in the repository, or the check could not run (see the lines above)"
            exit 1
          fi

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        NGINX_VERSION:
          - 1.31.6
          - 1.30.5
          - 1.28.3
          - 1.26.3
        BUILD_DYNAMIC_MODULE:
          - ""
          - "TRUE"
        BUILD_WITH_OPENSSL_SRC:
          - ""
          - "TRUE"
        SANITIZER:
          - ""
        # The cell that runs nginx under valgrind on every run, pull requests
        # included: the job "build (1.31.6)" (GitHub leaves a key that include
        # adds to a combination out of the job name). The other cells without
        # a sanitizer run nginx under valgrind only in a run with the input
        # "valgrind" (the nightly run).
        include:
          - NGINX_VERSION: 1.31.6
            BUILD_DYNAMIC_MODULE: ""
            BUILD_WITH_OPENSSL_SRC: ""
            SANITIZER: ""
            VALGRIND_ON_EVERY_RUN: valgrind
        # One more job: nginx, ngx_mruby and mruby built with AddressSanitizer
        # (LeakSanitizer included) and UndefinedBehaviorSanitizer. It runs nginx
        # directly, because valgrind does not work with ASan.
          - NGINX_VERSION: 1.31.6
            BUILD_DYNAMIC_MODULE: ""
            BUILD_WITH_OPENSSL_SRC: ""
            SANITIZER: "address,undefined"
    steps:
      # No later step runs git against this repository with credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Echo matrix
        env:
          NGINX_VERSION: ${{ matrix.NGINX_VERSION }}
          BUILD_DYNAMIC_MODULE: ${{ matrix.BUILD_DYNAMIC_MODULE }}
          BUILD_WITH_OPENSSL_SRC: ${{ matrix.BUILD_WITH_OPENSSL_SRC }}
          SANITIZER: ${{ matrix.SANITIZER }}
        run: |
          echo $NGINX_VERSION
          echo $BUILD_DYNAMIC_MODULE
          echo $BUILD_WITH_OPENSSL_SRC
          echo $SANITIZER
      - name: before_install
        env:
          NGINX_VERSION: ${{ matrix.NGINX_VERSION }}
          BUILD_DYNAMIC_MODULE: ${{ matrix.BUILD_DYNAMIC_MODULE }}
          BUILD_WITH_OPENSSL_SRC: ${{ matrix.BUILD_WITH_OPENSSL_SRC }}
        run: |
          sudo apt-get -qq update
      - name: install
        env:
          NGINX_VERSION: ${{ matrix.NGINX_VERSION }}
          BUILD_DYNAMIC_MODULE: ${{ matrix.BUILD_DYNAMIC_MODULE }}
          BUILD_WITH_OPENSSL_SRC: ${{ matrix.BUILD_WITH_OPENSSL_SRC }}
          CXX: g++
        run: |
          sudo apt-get -qq install rake bison git gperf zlib1g-dev g++-11 libstdc++-11-dev valgrind
          sudo apt-get remove -y libssl-dev
          if [ "$CXX" = "g++" ]; then
            export CXX="g++-11" CC="gcc-11" LD="gcc-11"
            echo "CXX=g++-11" >> $GITHUB_ENV
            echo "CC=gcc-11"  >> $GITHUB_ENV
            echo "LD=gcc-11"  >> $GITHUB_ENV
          fi
          $CXX -v
      - name: before_script
        env:
          NGINX_VERSION: ${{ matrix.NGINX_VERSION }}
          BUILD_DYNAMIC_MODULE: ${{ matrix.BUILD_DYNAMIC_MODULE }}
          BUILD_WITH_OPENSSL_SRC: ${{ matrix.BUILD_WITH_OPENSSL_SRC }}
        run: |
          curl -sfL https://www.openssl.org/source/openssl-${OPENSSL_SRC_VERSION}.tar.gz -o openssl-${OPENSSL_SRC_VERSION}.tar.gz
          mkdir openssl-${OPENSSL_SRC_VERSION} && tar -xzf openssl-${OPENSSL_SRC_VERSION}.tar.gz -C openssl-${OPENSSL_SRC_VERSION} --strip-components 1
          rm openssl-${OPENSSL_SRC_VERSION}.tar.gz
          cd openssl-${OPENSSL_SRC_VERSION}
          ./config --prefix=/usr/local --shared zlib -fPIC >> /dev/null 2>&1
          make >> /dev/null 2>&1
          sudo make install >> /dev/null 2>&1
          sudo ldconfig /usr/local/lib
          cd -
          openssl version
      - name: script
        env:
          NGINX_VERSION: ${{ matrix.NGINX_VERSION }}
          BUILD_DYNAMIC_MODULE: ${{ matrix.BUILD_DYNAMIC_MODULE }}
          BUILD_WITH_OPENSSL_SRC: ${{ matrix.BUILD_WITH_OPENSSL_SRC }}
          SANITIZER: ${{ matrix.SANITIZER }}
          NUM_THREADS_ENV: 1
          VALGRIND: ${{ matrix.SANITIZER == '' && (matrix.VALGRIND_ON_EVERY_RUN != '' || inputs.valgrind) && 'TRUE' || '' }}
          # NGINX_HEATTIME is left to the default of test.sh: the upper bound of
          # the wait for nginx to listen, which ends as soon as nginx does.
        run: |
          if [ -n "${VALGRIND}" ]; then
            # docs/test/README.md, "valgrind in CI". A memory error (an
            # invalid read or write, a jump on an uninitialised value, an
            # invalid free) and a leak of the kinds definite and indirect
            # are errors, unless test/valgrind.supp suppresses them.
            # Possibly lost blocks are printed with their stacks, but are
            # not errors: their number changes from run to run with the
            # connections that are still open when nginx exits.
            # --error-exitcode makes valgrind exit with 99 when it counted
            # an error; test.sh prints the exit status of nginx but does not
            # keep it in its own, so the next step reads the ERROR SUMMARY of
            # the log, which is the same count. One log per process (%p).
            mkdir -p "${RUNNER_TEMP}/valgrind"
            export NGINX_RUNNER="valgrind --error-exitcode=99 --leak-check=full --show-leak-kinds=definite,indirect,possible --errors-for-leak-kinds=definite,indirect --suppressions=${PWD}/test/valgrind.supp --log-file=${RUNNER_TEMP}/valgrind/valgrind.%p.log"
          else
            export NGINX_RUNNER=exec
          fi
          echo "NGINX_RUNNER=${NGINX_RUNNER}"
          echo "NGINX_SRC_MAJOR=$(echo $NGINX_VERSION | cut -d '.' -f 1)" > nginx_version
          echo "NGINX_SRC_MINOR=$(echo $NGINX_VERSION | cut -d '.' -f 2)" >> nginx_version
          echo "NGINX_SRC_PATCH=$(echo $NGINX_VERSION | cut -d '.' -f 3)" >> nginx_version
          echo "NGINX_SRC_VER=nginx-${NGINX_VERSION}" >> nginx_version
          if [ "${BUILD_WITH_OPENSSL_SRC}" == "TRUE" ]; then build_opts="--with-openssl-src=${PWD}/openssl-${OPENSSL_SRC_VERSION}"; fi
          if [ -n "${SANITIZER}" ]; then
            # ASan's shadow memory layout fails with the high mmap ASLR entropy
            # of some runner kernels; 28 bits is what ASan expects.
            sudo sysctl -w vm.mmap_rnd_bits=28
            # nginx compiles ngx_mruby; build_config.rb passes NGX_MRUBY_* to mruby.
            export NGINX_EXTRA_CC_OPT="-fsanitize=${SANITIZER} -fno-omit-frame-pointer"
            export NGINX_EXTRA_LD_OPT="-fsanitize=${SANITIZER}"
            export NGX_MRUBY_CFLAGS="-fsanitize=${SANITIZER} -fno-omit-frame-pointer"
            export NGX_MRUBY_LDFLAGS="-fsanitize=${SANITIZER}"
            export ASAN_OPTIONS="detect_leaks=1"
            # nginx leaves cycle->connections and the event arrays to exit();
            # test/lsan.supp suppresses them so that only other leaks fail the job.
            export LSAN_OPTIONS="suppressions=${PWD}/test/lsan.supp"
            export UBSAN_OPTIONS="print_stacktrace=1:suppressions=${PWD}/test/ubsan.supp"
          fi
          sh test.sh ${build_opts}

      # UBSan reports do not stop nginx, and LeakSanitizer reports come when a
      # process exits, so the tests can pass while reports were written. The
      # reports go to the stderr of the process, which is one of these files:
      # - build/nginx/logs/error.log: the test nginx, which writes its stderr
      #   to its error log once it has opened it (the leak report at its
      #   exit included);
      # - build/nginx/logs/stderr.log: the stderr of the test client
      #   (test/t/ngx_mruby.rb and test/t/cases/*.rb; test.sh redirects it),
      #   and so of the processes that the tests start without redirecting
      #   it (nginx -t, nginx -s quit, an nginx before it opened its log);
      # - the other *.log files of build/nginx/logs/: error logs of the
      #   nginx processes that the tests start (stream_only.error.log of
      #   the daemon on test, after it redirected its stderr there);
      # - build/nginx/second_instance/<mode>/*.log: the error.log, stderr.log
      #   and stdout.log of the second nginx (test/t/cases/_second_instance.rb).
      # The *.log.bak files that test.sh keeps of an earlier run are not read.
      - name: Check for sanitizer reports
        if: ${{ !cancelled() && matrix.SANITIZER != '' }}
        run: |
          log=build/nginx/logs/error.log
          if [ ! -s "$log" ]; then
            echo "::error title=sanitizer::$log is missing or empty"
            exit 1
          fi
          if [ ! -e build/nginx/logs/stderr.log ]; then
            echo "::error title=sanitizer::build/nginx/logs/stderr.log is missing"
            exit 1
          fi
          # second_instance/ is missing when test.sh stopped before the case
          # files (a failed assertion of test/t/ngx_mruby.rb, for example);
          # find exits 1 for a missing directory, which -e would turn into a
          # silent failure of the step.
          dirs=build/nginx/logs
          if [ -d build/nginx/second_instance ]; then
            dirs="$dirs build/nginx/second_instance"
          else
            echo "build/nginx/second_instance is missing: the second nginx did not run"
          fi
          logs=$(find $dirs -type f -name '*.log' | LC_ALL=C sort)
          echo "reading:" $logs
          # The names are file names of the test harness, without spaces.
          if grep -HnE 'ERROR: (AddressSanitizer|LeakSanitizer)|runtime error:|SUMMARY: (AddressSanitizer|UndefinedBehaviorSanitizer)' $logs; then
            echo "::error title=sanitizer::sanitizer reports found (see the lines above, each with its file)"
            exit 1
          fi
          echo "no sanitizer reports in" $logs

      # The valgrind logs of the step above, one per process: the test nginx,
      # and a process that it forked, if any (a fork that runs another
      # program leaves a log without a summary, because valgrind does not
      # follow the new program). Each log is printed, and the step fails
      # unless one log has an ERROR SUMMARY and every ERROR SUMMARY counts 0
      # errors. A missing summary of the test nginx (valgrind ended before
      # it wrote one) leaves no summary at all, and fails.
      - name: Check the valgrind reports
        if: ${{ !cancelled() && matrix.SANITIZER == '' && (matrix.VALGRIND_ON_EVERY_RUN != '' || inputs.valgrind) }}
        run: |
          dir="${RUNNER_TEMP}/valgrind"
          shopt -s nullglob
          logs=("${dir}"/valgrind.*.log)
          if [ "${#logs[@]}" -eq 0 ]; then
            echo "::error title=valgrind::no valgrind log in ${dir}: nginx did not start under valgrind"
            exit 1
          fi
          summaries=0
          failed=0
          for log in "${logs[@]}"; do
            echo "=== ${log}"
            cat "${log}"
            # The step runs with bash -e -o pipefail: without "|| true", a
            # log without a summary (grep exits 1) would end the step here.
            line=$(grep -E '^==[0-9]+== ERROR SUMMARY: ' "${log}" | tail -n 1) || true
            if [ -z "${line}" ]; then
              echo "(no ERROR SUMMARY in ${log})"
              continue
            fi
            summaries=$((summaries + 1))
            if ! [[ "${line}" =~ ERROR\ SUMMARY:\ 0\ errors ]]; then
              echo "::error title=valgrind::${log##*/}: ${line#*== }"
              failed=1
            fi
          done
          if [ "${summaries}" -eq 0 ]; then
            echo "::error title=valgrind::no valgrind log has an ERROR SUMMARY: valgrind did not finish"
            exit 1
          fi
          if [ "${failed}" -ne 0 ]; then
            echo "::error title=valgrind::valgrind reported errors or leaks (see the logs above and docs/test/README.md, \"valgrind in CI\")"
            exit 1
          fi
          echo "valgrind: ${summaries} of ${#logs[@]} logs have an ERROR SUMMARY, all with 0 errors"

      - name: after_failure
        if: failure()
        run: |
          if [ -e build/nginx/logs/error.log ]; then cat build/nginx/logs/error.log ; else cat build_dynamic/nginx/logs/error.log; fi
          if [ -e build/nginx/logs/stderr.log ]; then cat build/nginx/logs/stderr.log ; else cat build_dynamic/nginx/logs/stderr.log; fi
          # When nginx could not bind a test port, show who holds it.
          # The test ports lie below the kernel's ephemeral range (32768-60999),
          # so nothing on the runner should hold one; show the holder if it does.
          sudo ss -tanpo '( sport >= :18080 and sport <= :18199 ) or ( sport >= :12345 and sport <= :12399 )' || true

  # Memory soak test (docs/test/README.md, "Soak test for memory"): an -O2
  # build without MRB_GC_STRESS and --with-debug, many requests per scenario,
  # and the worker's GC roots, live objects, timers, file descriptors,
  # connections and RSS compared between samples.
  soak:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      # No later step runs git against this repository with credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The soak build uses the default gcc and no valgrind (test/soak/run.sh).
      - name: install
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install rake bison git gperf zlib1g-dev ruby
      - name: soak
        env:
          NUM_THREADS_ENV: 1
        run: sh test/soak/run.sh
      - name: after_failure
        if: failure()
        run: |
          logs=build_soak/nginx/soak/logs
          for f in "$logs"/error.*.log "$logs"/stderr.*.log; do
            if [ -e "$f" ]; then
              echo "=== $f (last 50 lines)"
              tail -n 50 "$f"
            fi
          done
          if [ -e "$logs/soak.log" ]; then
            echo "=== $logs/soak.log (last 100 lines)"
            tail -n 100 "$logs/soak.log"
          fi
      - name: Upload the soak logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-logs
          path: build_soak/nginx/soak/logs
          if-no-files-found: ignore

  # Performance comparison (docs/test/README.md, "Performance comparison with
  # callgrind"): instructions per request of the PR's base and of the PR
  # merged into it, both release builds, measured with callgrind. It runs
  # when the PR changes an input of the measured binary (the code, the
  # vendored trees, the top-level build files, nginx_version), the
  # measurement or this workflow, or has the label "perf". Advisory for now:
  # ci-ok does not need it until it has also run on pull requests that change
  # the code (calibration in the docs).
  perf:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The checkout is the merge commit of the PR (refs/pull/N/merge); its
      # first parent is the base branch it was merged into. The later steps
      # read both commits locally (git diff, git archive) and give gh the
      # token in GH_TOKEN, so the checkout keeps no credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Decide whether to compare
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          # The labels are read now, not from the event, so that adding the
          # label and re-running the job is enough.
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' > "$RUNNER_TEMP/labels"
          # The inputs of the measured binary are those that
          # test/build_release.sh copies: src/, mrbgems/, mruby/, dependence/
          # (ngx_devel_kit, added to nginx by Makefile.in), the top-level
          # build files and the gem lock. Then the measurement and this
          # workflow.
          inputs='^(src/|mrbgems/|mruby/|dependence/|(build_config\.rb|build_config\.rb\.lock|configure|config\.in|Makefile\.in|build\.sh|nginx_version)$'
          measurement='|test/perf/|test/build_release\.sh$|test/soak/(nginx\.conf|nginx\.agent\.conf|scenarios\.rb|http_client\.rb|mock_llm\.rb|handlers/)|\.github/workflows/test\.yml$)'
          if grep -qE "$inputs$measurement" "$RUNNER_TEMP/changed"; then
            echo "The PR changes files that the comparison measures."
            echo "run=yes" >> "$GITHUB_OUTPUT"
          elif grep -qx perf "$RUNNER_TEMP/labels"; then
            echo "The PR has the label perf."
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "No change to the measured files and no label perf: nothing to compare."
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi
      - name: install
        if: steps.scope.outputs.run == 'yes'
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install rake bison git gperf zlib1g-dev ruby valgrind
          valgrind --version
      - name: Check out the base
        if: steps.scope.outputs.run == 'yes'
        run: |
          mkdir -p build_perf
          git archive --prefix=build_perf/base-src/ HEAD^1 | tar -x
          echo "base: $(git rev-parse HEAD^1), head: $(git rev-parse HEAD) (merge of $(git rev-parse HEAD^2))"
      - name: perf
        if: steps.scope.outputs.run == 'yes'
        env:
          NUM_THREADS_ENV: 1
        run: sh test/perf/compare.sh build_perf/base-src
      - name: Upload the profiles and the report
        if: ${{ !cancelled() && steps.scope.outputs.run == 'yes' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-callgrind
          path: |
            build_perf/report.txt
            build_perf/report.json
            build_perf/base/callgrind
            build_perf/head/callgrind
            build_perf/base/nginx/perf/logs
            build_perf/head/nginx/perf/logs
          if-no-files-found: ignore

  # The only status check that rulesets should require. Matrix job names
  # change whenever the matrix changes, so they cannot be required directly.
  # "always()" makes this job run, and fail, when build, soak or files failed
  # or was cancelled; a skipped job would count as passing.
  ci-ok:
    name: ci-ok
    needs: [build, soak, files]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every build job, the soak job and the files job succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SOAK_RESULT: ${{ needs.soak.result }}
          FILES_RESULT: ${{ needs.files.result }}
        run: |
          echo "build: ${BUILD_RESULT}"
          echo "soak: ${SOAK_RESULT}"
          echo "files: ${FILES_RESULT}"
          failed=0
          if [ "${BUILD_RESULT}" != "success" ]; then
            echo "::error title=ci-ok::build finished with result '${BUILD_RESULT}', expected 'success'"
            failed=1
          fi
          if [ "${SOAK_RESULT}" != "success" ]; then
            echo "::error title=ci-ok::soak finished with result '${SOAK_RESULT}', expected 'success'"
            failed=1
          fi
          if [ "${FILES_RESULT}" != "success" ]; then
            echo "::error title=ci-ok::files finished with result '${FILES_RESULT}', expected 'success'"
            failed=1
          fi
          exit "${failed}"
