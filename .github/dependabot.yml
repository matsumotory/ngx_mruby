version: 2
updates:
  # Keep the actions used in .github/workflows up to date. Workflows pin
  # actions to a full commit SHA with a "# vX.Y.Z" comment; Dependabot
  # updates both. Pull requests target the default branch (master).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Propose a release only once it is 7 days old, so that a release that
    # is compromised or withdrawn soon after its publication is not picked
    # up. Security updates do not wait (Dependabot options reference,
    # "cooldown").
    cooldown:
      default-days: 7

  # The workflows that exist only on next (nginx-tests.yml, site.yml,
  # examples.yml) are not updated by the entry above, which reads the default
  # branch. Dependabot reads this file from the default branch, so this entry
  # is here, with the pull requests targeting next. Security updates use the
  # default branch.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "next"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # mruby/ is a vendored copy of upstream mruby. Its Gemfile and
  # Gemfile.lock belong to mruby's own documentation tooling, which
  # ngx_mruby neither installs nor ships, and local edits would be lost on
  # the next mruby update. Ignore every dependency there: "ignore" also
  # applies to Dependabot security updates, and "open-pull-requests-limit: 0"
  # turns off version updates for this directory.
  - package-ecosystem: "bundler"
    directory: "/mruby"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    # No version update is opened here; the cooldown only keeps zizmor's
    # dependabot-cooldown audit quiet for this entry.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
